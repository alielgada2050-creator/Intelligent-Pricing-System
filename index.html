        <div class="card-head" style="background:linear-gradient(90deg,rgba(0,132,61,0.08),transparent);">
          <span style="font-size:16px;">🧠</span>
          <span class="card-title">${ar?'ذكاء التسعير وقائمة الشراء':'Price Intelligence & Buy List'}</span>
          <span style="font-size:10.5px;color:var(--text-muted);margin-${ar?'right':'left'}:auto;">${ref?(ar?'آخر تحديث مرجعي: '+ref.date+' ('+ref.count+' بند)':'Ref. update: '+ref.date+' ('+ref.count+' items)'):(ar?'لا يوجد تحديث مرجعي بعد':'No reference update yet')}</span>
        </div>
        <div class="card-body">
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:4px;">
            ${this._plStatCell(ar?'متوسط الزيادة':'Avg increase', stats.avgInc+'%', ar?'من القديم للجديد':'old → new', stats.avgInc>15?'var(--accent-red)':'var(--sec-primary)')}
            ${this._plStatCell(ar?'بنود زيادة ≥ 15%':'Items inc ≥ 15%', stats.high, ar?'شراء عاجل مقترح':'suggested urgent buy', 'var(--accent-red)')}
            ${this._plStatCell(ar?'بنود مستقرة (≤5%)':'Stable items (≤5%)', stats.low, ar?'قابلة للتأجيل':'deferrable', 'var(--sec-primary)')}
            ${this._plStatCell(ar?'أعلى قسم زيادة':'Top-gain section', esc(stats.topSection), stats.topSectionAvg+'%', 'var(--accent-gold)')}
          </div>
          ${this._plBuyListHTML()}
          ${this._plSnapshotHTML()}
        </div>
      </div>`;
  },

  _plStatCell(lbl,val,sub,col) {
    return `<div style="background:var(--bg-surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px;border-top:3px solid ${col};">
      <div style="font-size:10px;color:var(--text-muted);font-weight:700;">${esc(lbl)}</div>
      <div style="font-size:16px;font-weight:900;color:var(--text-h);margin:3px 0 1px;">${esc(val)}</div>
      <div style="font-size:9.5px;color:var(--text-sub);line-height:1.5;">${esc(sub)}</div></div>`;
  },

  _plStats() {
    let high=0, low=0, sum=0, n=0;
    const bySec={};
    PRICE_LIST.forEach(i=>{
      const inc=parseFloat(i.incPct)||0;
      if(!(i.newPrice>0)) return;
      sum+=inc; n++;
      if(inc>=15) high++;
      else if(inc<=5) low++;
      bySec[i.section]=(bySec[i.section]||0)+inc;
    });
    let topSection='—', topAvg=0;
    Object.keys(bySec).forEach(s=>{
      const cnt=PRICE_LIST.filter(x=>x.section===s&&x.newPrice>0).length||1;
      const avg=bySec[s]/cnt;
      if(avg>topAvg){ topAvg=avg; topSection=s; }
    });
    return { avgInc: n?(sum/n).toFixed(1):'0', high, low, topSection, topSectionAvg: topAvg.toFixed(1) };
  },

  _priceRefMeta() {
    try{
      const r=JSON.parse(localStorage.getItem('price_ref_source')||'null');
      if(!r||!r.appliedAt) return null;
      return { date:new Date(r.appliedAt).toLocaleDateString(this.lang==='ar'?'ar-SA':'en-US'), count:r.count||0, rfx:r.rfx||'' };
    }catch(e){ return null; }
  },

  _buyRows() {
    return (this.state.boq.items||[]).map(it=>{
      const p=getItemByCode(it.code);
      const price=it.customPrice||(p?p.newPrice:0);
      const inc=parseFloat(p?p.incPct:0)||0;
      const qty=it.qty||0;
      const total=qty*price;
      return { code:it.code, arDesc:p?p.arDesc:'', qty, price, total, inc,
        rec: inc>=15?'urgent':inc>=10?'watch':inc>=5?'normal':'hold',
        saved:(p&&p.bidPrice>price)?(qty*(p.bidPrice-price)):0 };
    }).sort((a,b)=>b.total-a.total);
  },

  _plBuyListHTML() {
    const ar=this.lang==='ar';
    const rows=this._buyRows();
    if(!rows.length) return `<div style="font-size:11.5px;color:var(--text-sub);background:var(--bg-inset,rgba(0,0,0,.04));border-radius:8px;padding:10px;margin-top:10px;">${ar?'أضف بنوداً إلى المقايسة الحالية لتوليد قائمة الشراء المحسّنة.':'Add items to the current BOQ to generate an optimized buy list.'}</div>`;
    const totalSum=rows.reduce((s,r)=>s+r.total,0);
    const savedSum=rows.reduce((s,r)=>s+r.saved,0);
    const urgent=rows.filter(r=>r.rec==='urgent').length;
    const recT={ urgent:[ar?'🔴 شراء عاجل':'🔴 Buy now','var(--accent-red)'], watch:[ar?'🟠 مراقبة':'🟠 Watch','#ff8c00'], normal:[ar?'🟡 عادي':'🟡 Normal','var(--accent-gold)'], hold:[ar?'🟢 تأجيل':'🟢 Defer','var(--sec-primary)'] };
    return `
      <div style="font-size:12.5px;font-weight:800;margin:14px 0 8px;color:var(--accent-blue);">🛒 ${ar?'قائمة الشراء المحسّنة (من المقايسة الحالية)':'Optimized Buy List (from current BOQ)'}</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:10px;">
        ${this._plStatCell(ar?'إجمالي الشراء المقترح':'Suggested purchase total', fmtNum(totalSum)+' '+(ar?'ر.س':'SAR'), ar?'حسب السعر الموحد':'at unified prices', 'var(--accent-blue)')}
        ${this._plStatCell(ar?'وفورات مقابل عرض المناقصة':'Savings vs bid', fmtNum(savedSum)+' '+(ar?'ر.س':'SAR'), ar?'عندما يكون الموحد أقل من العرض':'when unified < bid', 'var(--sec-primary)')}
        ${this._plStatCell(ar?'بنود شراء عاجل':'Urgent-buy items', urgent, ar?'زيادة متوقعة ≥ 15%':'expected inc ≥ 15%', 'var(--accent-red)')}
      </div>
      <div class="tbl-wrap"><table class="data-table"><thead><tr>
        <th>#</th><th>${ar?'الرمز':'Code'}</th><th>${ar?'البند':'Item'}</th><th>${ar?'الكمية':'Qty'}</th><th>${ar?'السعر الموحد':'Unified'}</th><th>${ar?'الإجمالي':'Total'}</th><th>${ar?'الزيادة':'Inc.'}</th><th>${ar?'التوصية':'Recommendation'}</th>
      </tr></thead><tbody>
        ${rows.map((r,i)=>{
          const t=recT[r.rec];
          return `<tr>
            <td style="color:var(--text-muted);font-size:11px;">${i+1}</td>
            <td class="td-code">${esc(r.code)}</td>
            <td class="td-desc"><div class="td-desc-ar">${esc(r.arDesc)}</div></td>
            <td>${fmtNum(r.qty)}</td>
            <td class="td-price">${fmtNum(r.price)}</td>
            <td class="td-total">${fmtNum(r.total)}</td>
            <td>${fmtNum(r.inc)}%</td>
            <td style="color:${t[1]};font-weight:800;font-size:11px;">${t[0]}${r.saved>0?` <span style="color:var(--sec-primary);">(${ar?'وفرة':'save'} ${fmtNum(r.saved)})</span>`:''}</td>

        }).join('')}

        <button class="btn btn-outline btn-sm" onclick="App._exportBuyList()">⬇ ${ar?'تصدير قائمة الشراء CSV':'Export buy list CSV'}</button>
        <button class="btn btn-outline btn-sm" onclick="App._capturePriceSnapshot()">📸 ${ar?'التقاط لقطة أسعار':'Capture price snapshot'}</button>
      </div>`;
  },

  _exportBuyList() {
    const ar=this.lang==='ar';
    const rows=this._buyRows();
    if(!rows.length){ toast(ar?'أضف بنوداً إلى المقايسة أولاً':'Add BOQ items first','warning'); return; }
    const ce=v=>{ v=String(v==null?'':v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
    const head=['#','الرمز','البند','الكمية','السعر الموحد','الإجمالي','الزيادة%','التوصية','وفورات'];
    const labels={urgent:ar?'شراء عاجل':'urgent',watch:ar?'مراقبة':'watch',normal:ar?'عادي':'normal',hold:ar?'تأجيل':'hold'};
    const lines=[head.join(',')];
    rows.forEach((r,i)=>{
      lines.push([i+1, r.code, r.arDesc, r.qty, r.price, r.total, r.inc, labels[r.rec], r.saved].map(ce).join(','));
    });
    const blob=new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv;charset=utf-8'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='BuyList_'+Date.now()+'.csv';
    document.body.appendChild(a); a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},400);
    toast(ar?'تم تصدير قائمة الشراء':'Buy list exported','success');
  },

  _getSnapshots() {
    try{ return JSON.parse(localStorage.getItem('price_snapshots_v1')||'[]')||[]; }catch(e){ return []; }
  },
  _saveSnapshots(a) { try{ localStorage.setItem('price_snapshots_v1', JSON.stringify(a)); }catch(e){} },

  _capturePriceSnapshot() {
    const ar=this.lang==='ar';
    const stats=this._plStats();
    const buy=this._buyRows();
    const buyTotal=buy.reduce((s,r)=>s+r.total,0);
    const arr=this._getSnapshots();
    arr.push({ at:new Date().toISOString(), avgInc:parseFloat(stats.avgInc)||0, buyTotal:Math.round(buyTotal*100)/100, items:buy.length });
    if(arr.length>40) arr.splice(0,arr.length-40);
    this._saveSnapshots(arr);
    toast(ar?'تم التقاط لقطة الأسعار':'Price snapshot captured','success');
    this._renderPriceIntel();
  },

    const rows=snaps.slice().reverse().map(s=>`

        <td style="font-weight:800;color:${s.avgInc>15?'var(--accent-red)':'var(--sec-primary)'};">${fmtNum(s.avgInc)}%</td>

  renderOperations(c) {
    const ar = this.lang === 'ar';
    const boqs = (this.state.savedBOQs || []).filter(boq => boq.id);
    if (!boqs.length) {
      c.innerHTML = `<div class="card"><div class="empty-state"><div class="empty-icon">🦺</div><h3>${ar ? 'ابدأ بأمر عمل محفوظ' : 'Start with a saved work order'}</h3><p>${ar ? 'سجّل مقايسة أمر العمل أولاً، ثم اربط بها التنفيذ والموارد والفحوصات.' : 'Save a work-order BOQ first, then link field execution, resources and inspections to it.'}</p><br><button class="btn btn-primary" onclick="App.go('boq')">📋 ${ar ? 'فتح منشئ المقايسات' : 'Open BOQ Builder'}</button></div></div>`;
      return;
    }

    const savedId = boqs.some(boq => boq.id === this._selectedOpsBOQId) ? this._selectedOpsBOQId : boqs[0].id;
    this._selectedOpsBOQId = savedId;
    const boq = boqs.find(item => item.id === savedId);
    let summary, records, audit;
    try {
      summary = ExecutionWorkspace.summary(boq);
      records = ExecutionWorkspace.list(boq.id);
      audit = ExecutionWorkspace.audit(boq.id);
    } catch (error) {
      c.innerHTML = `<div class="card"><div class="card-body"><div class="alert alert-danger">${ar ? 'تعذر قراءة سجل العمليات؛ لم يتم تغييره.' : 'The operations ledger could not be read; no data was changed.'} ${esc(error.message)}</div><button class="btn btn-outline btn-sm" onclick="App.go('backup')">${ar ? 'فتح النسخ الاحتياطي' : 'Open backup'}</button></div></div>`;
      return;
    }
    const items = (boq.items || []).map(item => {
      const product = getItemByCode(item.code);
      return `<option value="${esc(item.code)}">${esc(item.code)} — ${esc(product?.arDesc || item.code)} (${esc(product?.uom || '')})</option>`;
    }).join('');
    const money = value => `${fmtNum(value)} ${ar ? 'ر.س' : 'SAR'}`;
    const number = value => Number(value || 0).toLocaleString(ar ? 'ar-SA' : 'en-US', { maximumFractionDigits: 2 });
    const types = {
      execution: ar ? 'تنفيذ يومي' : 'Daily execution',
      material: ar ? 'حركة مواد' : 'Material movement',
      labor: ar ? 'عمالة وإنتاجية' : 'Labor & productivity',
      equipment: ar ? 'تشغيل معدات' : 'Equipment operation',
      waste: ar ? 'مخلفات ونقل' : 'Waste & logistics',
      inspection: ar ? 'فحص جودة' : 'Quality inspection'

      required: ar ? 'احتياج' : 'Required', ordered: ar ? 'طلب/أمر توريد' : 'Ordered',
      received: ar ? 'استلام' : 'Received', issued: ar ? 'صرف للموقع' : 'Issued to site',
      consumed: ar ? 'استهلاك' : 'Consumed', returned: ar ? 'مرتجع' : 'Returned',
      damaged: ar ? 'تالف/هالك' : 'Damaged'

    const materialSources = {
      sec: 'SEC', contractor: ar ? 'المقاول' : 'Contractor',
      mixed: ar ? 'مختلط' : 'Mixed', recovered: ar ? 'مسترد' : 'Recovered'
    };
    const recordsHtml = records.slice(0, 100).map(record => {
      let detail = '';
      if (record.kind === 'execution') detail = `${number(record.executedQty)} ${esc(record.unit)}`;
      else if (record.kind === 'inspection') detail = `${ar ? 'مفحوص' : 'Inspected'} ${number(record.inspectedQty)} • ${ar ? 'مقبول داخلياً' : 'Internally accepted'} ${number(record.acceptedQty)}`;
      else if (record.kind === 'material') detail = `${esc(record.description)} • ${number(record.qty)} ${esc(record.unit)} • ${esc(materialEvents[record.event])}`;
      else if (record.kind === 'labor') detail = `${esc(record.crew)} • ${number(record.workers)} ${ar ? 'عامل' : 'workers'} • ${number(record.regularHours + record.overtimeHours)} ${ar ? 'ساعة' : 'hours'}`;
      else if (record.kind === 'equipment') detail = `${esc(record.asset)} • ${number(record.operatingHours)} ${ar ? 'ساعة تشغيل' : 'operating hours'}`;
      else detail = `${esc(record.wasteType)} • ${number(record.hauledQty)} / ${number(record.qty)} ${esc(record.unit)} ${ar ? 'منقول' : 'hauled'}`;
      const cost = record.actualCost ? money(record.actualCost) : '—';
      return `<tr><td>${esc(record.date)}</td><td>${esc(types[record.kind])}</td><td>${esc(record.itemCode || '—')}</td><td>${detail}</td><td>${cost}</td><td><button class="btn btn-outline btn-sm" onclick="App.archiveOperation('${esc(record.id)}')">${ar ? 'إلغاء مع حفظ الأثر' : 'Void with audit'}</button></td></tr>`;
    }).join('');
    const materialRows = Object.values(summary.materials).map(material => `<tr><td>${esc(material.materialCode || '—')}<br>${esc(material.description)}</td><td>${esc(materialSources[material.source])}</td><td>${number(material.required)}</td><td>${number(material.ordered)}</td><td>${number(material.received)}</td><td>${number(material.issued)}</td><td>${number(material.consumed)}</td><td>${number(material.returned)}</td><td>${number(material.damaged)}</td><td>${number(material.balance)} ${esc(material.unit)}</td></tr>`).join('');

      const boqItem = boq.items.find(item => String(item.code) === code);

    };
    const req = ar ? ' مطلوب' : ' required';
    const unitField = field(ar ? 'الوحدة' : 'Unit', 'unit', 'text', { required: true, maxLength: 30 });
    const outputUnitField = field(ar ? 'وحدة الإنتاج (إن أدخلت كمية)' : 'Output unit (if quantity entered)', 'unit', 'text', { maxLength: 30 });

          <div class="ops-local-badge"><span aria-hidden="true">●</span> ${ar ? 'محفوظ محلياً على هذا المتصفح' : 'Stored locally in this browser'}</div>

        <div class="ops-kpis">

          <div class="ops-kpi"><span>${ar ? 'كمية مقبولة داخلياً' : 'Internally accepted'}</span><strong>${number(summary.acceptedQty)}</strong><small>${number(summary.inspectedQty)} ${ar ? 'مفحوصة' : 'inspected'}</small></div>

                  ${field(ar ? 'الصيانة الفعلية (SAR)' : 'Actual maintenance (SAR)', 'maintenanceCost', 'number', { min: 0, step: '0.01' })}
                  ${field(ar ? 'الإيجار الفعلي (SAR)' : 'Actual rental (SAR)', 'hireCost', 'number', { min: 0, step: '0.01' })}
                  ${field(ar ? 'النقل الفعلي (SAR)' : 'Actual transport (SAR)', 'transportCost', 'number', { min: 0, step: '0.01' })}
                  ${field(ar ? 'الإنتاج' : 'Output quantity', 'outputQty', 'number', { min: 0, step: '0.01' })}
                  ${outputUnitField}
                  ${field(ar ? 'سبب التوقف' : 'Downtime reason', 'breakdownReason', 'text', { maxLength: 500 })}
                  ${field(ar ? 'مرجع فاتورة/سجل تكلفة' : 'Invoice / cost record reference', 'evidenceRef', 'text', { maxLength: 160 })}
                </div>
              </div>
              <div class="ops-type-fields" data-kind="waste" hidden>
                <h3>${ar ? 'المخلفات والترحيل' : 'Waste & hauling'}</h3><div class="ops-form-grid">
                  ${field(ar ? 'نوع المخلفات' : 'Waste type', 'wasteType', 'text', { required: true, maxLength: 120 })}
                  ${field(ar ? 'كمية ناتجة' : 'Generated quantity', 'qty', 'number', { required: true, min: 0.01, step: '0.01' })}
                  ${field(ar ? 'كمية منقولة' : 'Hauled quantity', 'hauledQty', 'number', { required: true, min: 0, step: '0.01' })}
                  ${unitField}
                  ${field(ar ? 'عدد الرحلات' : 'Trips', 'trips', 'number', { required: true, min: 0, step: '1' })}
                  ${field(ar ? 'المركبة' : 'Vehicle', 'vehicle', 'text', { maxLength: 120 })}
                  ${field(ar ? 'السعة الاسمية (اختياري)' : 'Rated capacity (optional)', 'capacity', 'number', { min: 0, step: '0.01' })}
                  ${field(ar ? 'موقع التخلص' : 'Disposal destination', 'destination', 'text', { maxLength: 180 })}
                  ${field(ar ? 'تكلفة النقل الفعلية (SAR)' : 'Actual hauling cost (SAR)', 'transportCost', 'number', { min: 0, step: '0.01' })}
                  ${field(ar ? 'تكلفة التخلص الفعلية (SAR)' : 'Actual disposal cost (SAR)', 'disposalCost', 'number', { min: 0, step: '0.01' })}
                  ${field(ar ? 'مرجع فاتورة/مستند النقل' : 'Hauling / disposal evidence reference', 'evidenceRef', 'text', { maxLength: 160 })}
                </div>
              </div>
              <label class="ops-field">${ar ? 'ملاحظات السجل' : 'Record notes'}<textarea class="form-control" name="notes" rows="2" maxlength="1000"></textarea></label>
              <div class="ops-form-actions"><button class="btn btn-primary" type="submit">💾 ${ar ? 'حفظ السجل المرتبط بأمر العمل' : 'Save work-order record'}</button><span>${ar ? 'التكلفة المدخلة فعلية فقط، دون الضريبة، ولا بد من مرجع مستند.' : 'Enter actual cost only, ex VAT, with an evidence reference.'}</span></div>
            </form>
          </section>
          <section class="card ops-resource-summary">
            <div class="card-head"><span>📦</span><span class="card-title">${ar ? 'مطابقة المواد والموارد' : 'Materials & resource reconciliation'}</span></div>
            <div class="ops-summary-lines">
              <div><span>${ar ? 'تكلفة المواد الموثقة' : 'Evidenced materials'}</span><b>${money(summary.costs.material)}</b></div>
              <div><span>${ar ? 'تكلفة العمالة الموثقة' : 'Evidenced labor'}</span><b>${money(summary.costs.labor)}</b></div>
              <div><span>${ar ? 'تكلفة المعدات الموثقة' : 'Evidenced equipment'}</span><b>${money(summary.costs.equipment)}</b></div>
              <div><span>${ar ? 'النقل والتخلص الموثق' : 'Evidenced hauling/disposal'}</span><b>${money(summary.costs.logistics)}</b></div>
              <div><span>${ar ? 'مخلفات لم تسجل منقولاً' : 'Waste not recorded as hauled'}</span><b>${number(summary.unhauledWasteQty)}</b></div>
            </div>
            ${(summary.uncostedMaterialReceipts || summary.uncostedLaborLogs || summary.uncostedEquipmentLogs) ? `<div class="ops-incomplete">${ar ? `تكلفة غير مكتملة: ${summary.uncostedMaterialReceipts} استلام مادة للمقاول بلا تكلفة، و${summary.uncostedLaborLogs} سجل عمالة، و${summary.uncostedEquipmentLogs} سجل معدات بلا تكلفة موثقة. لا نحول الكميات أو الساعات إلى تكلفة تقديرية.` : `Incomplete cost: ${summary.uncostedMaterialReceipts} contractor material receipts and ${summary.uncostedLaborLogs} labor / ${summary.uncostedEquipmentLogs} equipment logs have no evidenced cost. Quantities and hours are not converted to estimates.`}</div>` : ''}
            <div class="ops-table-wrap"><table class="data-table ops-table"><thead><tr><th>${ar ? 'كود/وصف المادة' : 'Material'}</th><th>${ar ? 'المصدر' : 'Source'}</th><th>${ar ? 'مطلوب' : 'Required'}</th><th>${ar ? 'مطلوب توريده' : 'Ordered'}</th><th>${ar ? 'مستلم' : 'Received'}</th><th>${ar ? 'مصروف' : 'Issued'}</th><th>${ar ? 'مستهلك' : 'Consumed'}</th><th>${ar ? 'مرتجع' : 'Returned'}</th><th>${ar ? 'تالف' : 'Damaged'}</th><th>${ar ? 'الرصيد' : 'Balance'}</th></tr></thead><tbody>${materialRows || `<tr><td colspan="10" class="ops-empty">${ar ? 'لا توجد حركات مواد بعد.' : 'No material movements recorded yet.'}</td></tr>`}</tbody></table></div>
            <p class="ops-footnote">${ar ? 'مواد SEC لا تتحول إلى تكلفة على المقاول إلا بمبلغ فعلي ومرجع موثق. الرصيد هنا: المستلم − المستهلك − التالف.' : 'SEC-supplied materials are not charged to the contractor unless an evidenced actual amount is recorded. Balance shown: received − consumed − damaged.'}</p>
          </section>
        </div>
        <section class="card ops-item-progress">
          <div class="card-head"><span>📐</span><span class="card-title">${ar ? 'التنفيذ والفحص مقابل بنود المقايسة' : 'Execution & inspection against BOQ items'}</span></div>
          <div class="ops-table-wrap"><table class="data-table ops-table"><thead><tr><th>${ar ? 'البند' : 'Item'}</th><th>${ar ? 'كمية المقايسة' : 'BOQ quantity'}</th><th>${ar ? 'منفذ مسجل' : 'Recorded executed'}</th><th>${ar ? 'مقبول داخلياً بعد الفحص' : 'Internally accepted after inspection'}</th><th>${ar ? 'متبقٍ للتنفيذ' : 'Remaining'}</th><th>${ar ? 'مراجعة' : 'Review'}</th></tr></thead><tbody>${itemRows || `<tr><td colspan="6" class="ops-empty">${ar ? 'لم تسجل كميات تنفيذ بعد.' : 'No execution quantities recorded yet.'}</td></tr>`}</tbody></table></div>
          <p class="ops-footnote">${ar ? 'القبول في هذا السجل داخلي فقط، ولا يؤهل الكمية تلقائياً لمستخلص أو اعتماد من SEC.' : 'Acceptance recorded here is internal only; it does not automatically qualify a quantity for a certificate or SEC approval.'}</p>
        </section>
        <section class="card">
          <div class="card-head"><span>🗓️</span><span class="card-title">${ar ? 'آخر سجلات أمر العمل' : 'Latest work-order records'}</span><span class="ops-record-count">${records.length}</span></div>
          <div class="ops-table-wrap"><table class="data-table ops-table"><thead><tr><th>${ar ? 'التاريخ' : 'Date'}</th><th>${ar ? 'السجل' : 'Record'}</th><th>${ar ? 'البند' : 'Item'}</th><th>${ar ? 'البيانات' : 'Details'}</th><th>${ar ? 'تكلفة موثقة' : 'Evidenced cost'}</th><th></th></tr></thead><tbody>${recordsHtml || `<tr><td colspan="6" class="ops-empty">${ar ? 'لا توجد سجلات. ابدأ بإضافة يومية تنفيذ أو حركة موارد.' : 'No records. Start with a daily execution or resource entry.'}</td></tr>`}</tbody></table></div>
          ${records.length > 100 ? `<p class="ops-footnote">${ar ? 'تُعرض أحدث 100 حركة فقط.' : 'Showing the latest 100 records.'}</p>` : ''}
        </section>
        <details class="card ops-audit">
          <summary>${ar ? 'سجل التدقيق المحلي' : 'Local audit trail'} <span>${audit.length}</span></summary>
          <div class="ops-audit-list">${historyHtml || `<div class="ops-empty">${ar ? 'لا توجد تغييرات مسجلة.' : 'No audit events.'}</div>`}</div>
        </details>
      </div>`;
    const dateInput = c.querySelector('#ops-record-form [name="date"]');
    if (dateInput) dateInput.value = today;
    const kindSelect = c.querySelector('#ops-record-form [name="kind"]');
    if (kindSelect) {
      kindSelect.addEventListener('change', () => this.switchOperationsForm(kindSelect.value));
      this.switchOperationsForm(kindSelect.value);
    }
    const itemSelect = c.querySelector('#ops-record-form [name="itemCode"]');
    if (itemSelect) itemSelect.addEventListener('change', () => {
      const unitInput = c.querySelector('.ops-type-fields:not([hidden]) [name="unit"]');
      const product = itemSelect.value ? getItemByCode(itemSelect.value) : null;
      if (unitInput && product) unitInput.value = product.uom || '';
    });
  },

  switchOperationsForm(kind) {
    document.querySelectorAll('#ops-record-form .ops-type-fields').forEach(section => {
      const active = section.dataset.kind === kind;
      section.hidden = !active;
      section.querySelectorAll('input,select,textarea').forEach(input => {
        input.disabled = !active;
        input.required = active && input.dataset.required === 'true';
      });
    });
  },

  selectOperationsBOQ(id) {
    this._selectedOpsBOQId = id;
    this.renderOperations(this.getArea());
  },

  saveOperation(event) {
    event.preventDefault();
    const form = event.currentTarget;
    const boq = (this.state.savedBOQs || []).find(item => item.id === this._selectedOpsBOQId);
    if (!boq) {
      toast(this.lang === 'ar' ? 'اختر مقايسة محفوظة أولاً' : 'Select a saved BOQ first', 'warning');
      return;
    }
    try {
      const input = Object.fromEntries(new FormData(form).entries());
      const record = ExecutionWorkspace.create(boq, input, Auth.current()?.name || 'local-user');
      toast(this.lang === 'ar' ? 'تم حفظ سجل أمر العمل محلياً' : 'Work-order record saved locally', 'success');
      this.renderOperations(this.getArea());
      const kindSelect = document.getElementById('ops-record-form')?.elements.kind;
      if (kindSelect) kindSelect.value = record.kind;
      this.switchOperationsForm(record.kind);
    } catch (error) {
      toast((this.lang === 'ar' ? 'تعذر حفظ السجل: ' : 'Could not save record: ') + error.message, 'error');
    }
  },

  archiveOperation(id) {
    const ar = this.lang === 'ar';
    const reason = prompt(ar ? 'اكتب سبب إلغاء هذا السجل. سيبقى محفوظاً في سجل التدقيق:' : 'Enter why this record is being voided. It will remain in the audit trail:');
    if (reason == null) return;
    try {
      ExecutionWorkspace.archive(this._selectedOpsBOQId, id, reason, Auth.current()?.name || 'local-user');
      toast(ar ? 'أُلغي السجل مع الاحتفاظ بأثره' : 'Record voided; audit history retained', 'info');
      this.renderOperations(this.getArea());
    } catch (error) {
      toast((ar ? 'تعذر إلغاء السجل: ' : 'Could not void record: ') + error.message, 'error');
    }
  },

  // ────────────────────────────────────────────────
  // PROFITABILITY & DELIVERY CONTROL — cost, commitment and forecast at completion
  // ────────────────────────────────────────────────
  renderProfitability(c) {
    const ar=this.lang==='ar';
    const boq=this.state.boq;
    const ready=boq && boq.items && boq.items.length;
    if(!ready){
      c.innerHTML=`<div class="card"><div class="empty-state"><div class="empty-icon">📈</div><h3>${ar?'يلزم فتح أو إنشاء مقايسة أولاً':'Open or create a BOQ first'}</h3><p>${ar?'مركز الربحية يحول بنود المقايسة إلى ميزانية تنفيذية قابلة للمتابعة.':'The profitability center turns BOQ items into a controllable execution budget.'}</p><br><button class="btn btn-primary" onclick="App.go('boq')">📋 ${ar?'فتح منشئ المقايسات':'Open BOQ Builder'}</button></div></div>`;
      return;
    }
    const p=ProjectProfitability.get(boq), m=ProjectProfitability.metrics(p,boq), alerts=ProjectProfitability.alerts(p,boq);
    const sar=ar?' ر.س':' SAR'; const money=x=>fmtNum(x)+sar;
    const tone=m.margin<5?'var(--accent-red)':m.margin<10?'var(--sec-gold)':'var(--sec-primary)';
    const fields=[['material',ar?'المواد والتوريد':'Materials & supply','📦'],['labor',ar?'العمالة والإنتاجية':'Labour & productivity','👷'],['equipment',ar?'المعدات والمحروقات':'Equipment & fuel','🚜'],['subcontract',ar?'المقاولون الباطن':'Subcontractors','🤝'],['indirect',ar?'المصاريف غير المباشرة':'Indirect cost','🏢']];
    const val=(group,key)=>Math.round((p[group]||{})[key]||0);
    c.innerHTML=`
      <div class="card mb-16" style="border-color:rgba(14,116,144,.34);background:linear-gradient(115deg,rgba(7,48,78,.95),rgba(10,85,103,.82));color:#fff;overflow:hidden;">
        <div class="card-body" style="padding:22px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;">
          <div style="font-size:36px;width:58px;height:58px;border-radius:14px;background:rgba(255,255,255,.12);display:grid;place-items:center;">📈</div>
          <div style="flex:1;min-width:240px;"><div style="font-size:11px;font-weight:800;letter-spacing:1.2px;color:#8ee4e7;">PROJECT CONTROL / EAC</div><div style="font-size:20px;font-weight:900;margin-top:4px;">${esc(p.name)}</div><div style="font-size:12px;color:#d8f2f2;margin-top:4px;">${ar?'ربط العقد بالتكلفة الفعلية والالتزامات وتوقع الربح عند الإكمال':'Contract-to-cost link: actuals, commitments and forecast profit at completion'}</div></div>
          <div style="min-width:160px;border-${ar?'right':'left'}:1px solid rgba(255,255,255,.18);padding-${ar?'right':'left'}:18px;"><div style="font-size:10px;color:#b9e5e6;">${ar?'هامش الربح المتوقع':'FORECAST MARGIN'}</div><div style="font-size:28px;font-weight:900;color:${m.margin<5?'#ff9cae':m.margin<10?'#fde68a':'#9ff3c5'};">${m.margin.toFixed(1)}%</div></div>
        </div>
      </div>
      <div class="grid-4 mb-16">
        ${[[ar?'قيمة العقد قبل الضريبة':'Contract value',m.contract,'💼'],[ar?'تكلفة الإكمال المتوقعة (EAC)':'Forecast final cost',m.eac,'🎯'],[ar?'الربح المتوقع':'Forecast profit',m.forecastProfit,'💰'],[ar?'الانحراف عن الميزانية':'Budget variance',m.variance,'↕️']].map((x,i)=>`<div class="stat-card" style="text-align:${ar?'right':'left'};border-top:3px solid ${i===2?tone:'var(--se-blue)'};"><div style="font-size:10px;color:var(--text-muted);font-weight:800;">${x[2]} ${x[0]}</div><div class="stat-val" style="font-size:20px;color:${i===2?tone:'var(--text-h)'};margin-top:7px;">${money(x[1])}</div></div>`).join('')}
      </div>
      <div class="grid-2 mb-16">
        <div class="card"><div class="card-head"><span>🧭</span><span class="card-title">${ar?'الإنجاز والتنبؤ المالي':'Progress & financial forecast'}</span></div><div class="card-body">
          <div style="display:flex;justify-content:space-between;font-size:12px;font-weight:800;margin-bottom:7px;"><span>${ar?'نسبة الإنجاز الفعلي':'Actual progress'}</span><span style="color:var(--sec-primary)">${m.progress.toFixed(0)}%</span></div>
          <input class="form-control" type="range" min="0" max="100" value="${m.progress}" oninput="App.updateProfitability('progress','value',this.value)" style="padding:0;accent-color:var(--sec-primary);">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:16px;">${[[ar?'القيمة المكتسبة':'Earned value',m.earned],[ar?'تكلفة حتى اليوم + الالتزامات':'Cost + commitments',m.costToDate],[ar?'الميزانية المعتمدة':'Baseline budget',m.planned],[ar?'تكلفة متبقية مخططة':'Planned remaining',m.remainingPlan]].map(x=>`<div style="background:var(--bg-surface);border:1px solid var(--border);border-radius:9px;padding:9px;"><div style="font-size:10px;color:var(--text-muted)">${x[0]}</div><div style="font-weight:900;font-size:14px;margin-top:3px;">${money(x[1])}</div></div>`).join('')}</div>
        </div></div>
        <div class="card"><div class="card-head"><span>🤖</span><span class="card-title">${ar?'وكلاء الرقابة المجانية':'Free control agents'}</span><span class="badge badge-info">${ar?'قواعد محلية':'Local rules'}</span></div><div class="card-body" style="display:flex;flex-direction:column;gap:8px;">${alerts.map(a=>`<div style="padding:10px 11px;border-radius:9px;border:1px solid ${a.level==='critical'?'rgba(255,77,106,.34)':a.level==='warning'?'var(--border-gold)':'var(--border-sec)'};background:${a.level==='critical'?'rgba(255,77,106,.06)':a.level==='warning'?'rgba(200,168,75,.06)':'var(--sec-primary-faint)'};"><div style="font-size:10px;font-weight:900;color:${a.level==='critical'?'var(--accent-red)':a.level==='warning'?'var(--sec-gold)':'var(--sec-primary)'};">${a.level==='critical'?'⛔':a.level==='warning'?'⚠️':'✓'} ${esc(a.agent)}</div><div style="font-size:11px;color:var(--text-body);margin-top:3px;line-height:1.65;">${esc(a.text)}</div></div>`).join('')}</div></div>
      </div>
      <div class="card"><div class="card-head"><span>🧾</span><span class="card-title">${ar?'سجل الميزانية والتكلفة':'Budget, actual cost & commitments register'}</span><button class="btn btn-outline btn-sm" style="margin-${ar?'right':'left'}:auto" onclick="App.resetProfitability()">↺ ${ar?'إعادة خط الأساس':'Reset baseline'}</button></div><div class="card-body ops-footnote">${ar?'تضاف التكاليف الفعلية الموثقة من سجل التنفيذ إلى المدخلات اليدوية. لا تكرر إدخال المصروف نفسه في الموضعين.':'Evidenced costs from field operations are added to manual actuals. Do not enter the same expense in both places.'}</div><div class="tbl-wrap"><table class="data-table"><thead><tr><th>${ar?'الفئة':'Cost category'}</th><th>${ar?'الميزانية المخططة':'Baseline budget'}</th><th>${ar?'فعلي يدوي + سجل التنفيذ':'Manual actual + operations ledger'}</th><th>${ar?'التزامات / أوامر شراء':'Committed / PO'}</th><th>${ar?'التعرض الكلي':'Total exposure'}</th><th>${ar?'الحالة':'Status'}</th></tr></thead><tbody>${fields.map(f=>{const execution=Number(m.executionCosts[f[0]]||0);const actual=val('actual',f[0])+execution;const exposure=actual+val('committed',f[0]);const pct=val('planned',f[0])?exposure/val('planned',f[0]):0;return `<tr><td><b>${f[2]} ${f[1]}</b></td><td><input class="form-control" type="number" min="0" value="${val('planned',f[0])}" onchange="App.updateProfitability('planned','${f[0]}',this.value)"></td><td><input class="form-control" type="number" min="0" value="${val('actual',f[0])}" onchange="App.updateProfitability('actual','${f[0]}',this.value)">${execution?`<small class="ops-cost-source">+ ${money(execution)} ${ar?'من سجل التنفيذ':'from field log'}</small>`:''}</td><td><input class="form-control" type="number" min="0" value="${val('committed',f[0])}" onchange="App.updateProfitability('committed','${f[0]}',this.value)"></td><td class="td-total">${money(exposure)}</td><td>${pct>1?'<span class="badge badge-critical">تجاوز</span>':pct>.85?'<span class="badge badge-warning">تنبيه</span>':'<span class="badge badge-ok">ضمن الحد</span>'}</td></tr>`}).join('')}</tbody></table></div><div class="card-body" style="font-size:10.5px;color:var(--text-muted);">${ar?'المعادلة: EAC = المدفوع الفعلي + الالتزامات + التكلفة المتوقعة للمتبقي. الربح المتوقع = قيمة العقد قبل الضريبة − EAC. لا تُعد الضريبة قيمة ربحية.':'Formula: EAC = actual paid + commitments + forecast remaining cost. Forecast profit = pre-VAT contract value − EAC. VAT is excluded from profitability.'}</div></div>`;
  },

  updateProfitability(section,key,value) {
    if(!this.state.boq?.items?.length) return;
    ProjectProfitability.update(this.state.boq,section,key,value);
    this.renderProfitability(this.getArea());
  },

  resetProfitability() {
    if(!this.state.boq?.items?.length) return;
    if(!confirm(this.lang==='ar'?'سيُعاد احتساب الميزانية التقديرية وتصفير الفعلي والالتزامات. متابعة؟':'This resets baseline, actuals, and commitments. Continue?')) return;
    ProjectProfitability.reset(this.state.boq); this.renderProfitability(this.getArea());
  },

  sendWA() {
    const subj=document.getElementById('sup-subj')?.value||'';
    const msg=document.getElementById('sup-msg')?.value||'';
    const text=encodeURIComponent(`*منصة العقود الذكية — ${this.lang==='ar'?'رسالة دعم فني':'Technical Support Message'}*\n\n${this.lang==='ar'?'الموضوع:':'Subject:'} ${subj}\n\n${msg}\n\n_${this.lang==='ar'?'من منصة':'From'} منصة العقود الذكية للإنشاءات ومشاريع البنية التحتية | RFx 4000083770_`);
    window.open(`https://wa.me/966596439721?text=${text}`,'_blank');
  }
};

// ─── Init on DOM Ready ────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', ()=> App.init());
</script>
</body>
</html>
