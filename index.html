.hud-corners i:nth-child(3) { bottom: 8px; left: 8px; border-width: 0 0 2px 2px; }

  color: rgba(0,194,255,0.95); font-family: var(--font-mono); margin-bottom: 5px;
}
.hud-title { font-size: 23px; font-weight: 900; color: #ffffff; margin-bottom: 6px; text-shadow: 0 0 18px rgba(0,128,255,0.55); }
.hud-sub { font-size: 12.5px; color: rgba(215,235,255,0.9); line-height: 1.8; font-family: var(--font-mono); }
.hud-right { display: flex; flex-direction: column; gap: 8px; align-items: stretch; }

/* 3D Stat Cards */
.stat-card {
  position: relative; overflow: hidden;
  border-radius: 16px;
  background: linear-gradient(160deg, var(--bg-card) 20%, rgba(0,128,255,0.06) 130%);

  padding: 18px 16px; text-align: center;
  transform: perspective(900px) rotateX(0deg);
  transition: transform .35s cubic-bezier(.25,.8,.25,1), box-shadow .35s, border-color .35s;
  box-shadow: 0 6px 18px rgba(0,20,70,0.16), inset 0 1px 0 rgba(255,255,255,0.5);
}
.stat-card::before {
  content: ''; position: absolute; top: 0; left: 12%; right: 12%; height: 3px; border-radius: 0 0 6px 6px;
  background: linear-gradient(90deg, transparent, rgba(0,128,255,0.95), transparent);
  filter: drop-shadow(0 0 8px rgba(0,128,255,0.8));
}
.stat-card::after {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(115deg, transparent 30%, rgba(0,194,255,0.1) 45%, transparent 60%);
  transform: translateX(-130%); transition: transform .6s;
}
.stat-card:hover {
  transform: perspective(900px) rotateX(6deg) translateY(-6px);
  border-color: rgba(0,128,255,0.5);
  box-shadow: 0 20px 44px rgba(0,40,110,0.32), inset 0 1px 0 rgba(255,255,255,0.6);

.stat-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 9px; }
.stat-ic { font-size: 22px; filter: drop-shadow(0 0 10px rgba(0,128,255,0.5)); }
.stat-tag {

  border: 1px solid rgba(0,128,255,0.25); padding: 2px 7px; border-radius: 5px;
}
.stat-val {
  font-size: 32px; font-weight: 900; line-height: 1.1; font-family: var(--font-mono);
  background: linear-gradient(180deg, #0a6ef0, #00b7ff);

/* 3D Quick Actions */
.section-hud {
  display: flex; align-items: center; gap: 9px;
  font-size: 11px; font-weight: 900; letter-spacing: 1.5px; text-transform: uppercase;
  color: var(--text-muted); font-family: var(--font-mono); margin-bottom: 13px;
}

.qa-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
.qa-card {
  position: relative; overflow: hidden; cursor: pointer;
  border-radius: 16px;
  background: linear-gradient(160deg, var(--bg-card) 25%, rgba(0,128,255,0.06) 130%);
  border: 1px solid rgba(0,128,255,0.18);
  padding: 16px;
  transform: perspective(800px) rotateX(0deg);
  transition: transform .35s cubic-bezier(.25,.8,.25,1), box-shadow .35s, border-color .35s;
  box-shadow: 0 6px 18px rgba(0,20,70,0.14);

.qa-card::before {
  content: ''; position: absolute; inset: 0; pointer-events: none;

}
.qa-card::after {
  content: '→'; position: absolute; bottom: 11px; left: 14px; font-size: 15px; font-weight: 900;

  transform: perspective(800px) rotateX(8deg) translateY(-6px);

.qa-icon {
  width: 46px; height: 46px; border-radius: 13px; display: flex; align-items: center; justify-content: center;
  font-size: 23px; margin-bottom: 11px; position: relative; z-index: 1;
  background: linear-gradient(145deg, rgba(0,128,255,0.18), rgba(0,128,255,0.04));
  border: 1px solid rgba(0,128,255,0.3);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.4), 0 0 14px rgba(0,128,255,0.14);
}
.qa-label { font-size: 13.5px; font-weight: 900; color: var(--text-h); margin-bottom: 4px; position: relative; z-index: 1; }
.qa-sub { font-size: 10.5px; color: var(--text-sub); line-height: 1.55; position: relative; z-index: 1; font-family: var(--font-mono); }

/* Fluent-inspired enterprise theme: clean surfaces, clear hierarchy, restrained motion. */
:root {
  --font-main:'Tajawal','Segoe UI Variable','Segoe UI',Inter,Tahoma,sans-serif;
  --se-navy:#0f6cbd; --se-blue:#115ea3; --sec-primary:#0f6cbd; --sec-primary-2:#115ea3;
  --sec-gold:#a5821f; --accent-blue:#0f6cbd; --bg-body:#f5f5f5; --bg-card:#fff;
  --bg-surface:#fafafa; --bg-hover:#f0f3f6; --text-h:#242424; --text-main:#333;
  --text-body:#424242; --text-sub:#616161; --text-muted:#707070; --text-code:#0f6cbd;
  --border:#e1e1e1; --border-sec:rgba(15,108,189,.22); --sec-primary-dim:rgba(15,108,189,.1);
  --sec-primary-faint:rgba(15,108,189,.045); --glow-green:0 1px 2px rgba(0,0,0,.08);
  --shadow-sm:0 1px 2px rgba(0,0,0,.08); --shadow-md:0 4px 8px rgba(0,0,0,.12);
  --shadow-lg:0 12px 28px rgba(0,0,0,.18); --t-fast:.14s ease-out; --t-med:.22s cubic-bezier(.2,0,0,1);
}
[data-theme="dark"] {
  --bg-body:#1f1f1f; --bg-card:#292929; --bg-surface:#252525; --bg-hover:#383838;
  --text-h:#f5f5f5; --text-main:#e1e1e1; --text-body:#d1d1d1; --text-sub:#b3b3b3;
  --text-muted:#999; --text-code:#75beff; --border:#3d3d3d; --sec-primary:#479ef5;
  --sec-primary-2:#2886de; --sec-primary-dim:rgba(71,158,245,.16);
  --sec-primary-faint:rgba(71,158,245,.08); --accent-blue:#75beff;
  --shadow-sm:0 1px 2px rgba(0,0,0,.2); --shadow-md:0 4px 8px rgba(0,0,0,.28);
  --shadow-lg:0 12px 28px rgba(0,0,0,.4);
}
body { font-family:var(--font-main); font-size:14px; letter-spacing:0; }
body.lang-en { font-family:Inter,'Segoe UI Variable','Segoe UI',Tahoma,sans-serif; }
html[data-theme] .brand-bar { background:#0f6cbd!important; border:0; box-shadow:0 1px 3px rgba(0,0,0,.16); }
.brand-bar::before,.brand-bar::after { display:none; animation:none; }
.brand-bar-inner { min-height:66px; }
.brand-center .sys-name { color:#fff; text-shadow:none; }
.brand-center .sys-sub { color:rgba(255,255,255,.78); }
.brand-center-inner { border-radius:8px; box-shadow:0 1px 3px rgba(0,0,0,.12); animation:none; }
.brand-center-inner .sys-name-main { color:#0f6cbd!important; -webkit-text-fill-color:#0f6cbd!important; background:none!important; text-shadow:none; }
.sidebar { background:var(--bg-card); border-color:var(--border); box-shadow:1px 0 3px rgba(0,0,0,.04); }
.sidebar-logo { background:var(--bg-card); }
.sidebar-logo-icon { border-radius:8px; background:#0f6cbd; box-shadow:none; }
.nav-wrap { gap:2px; }
.nav-item { border-radius:6px; }
.nav-item:hover { transform:none; }
.nav-item.active { color:var(--sec-primary); background:var(--sec-primary-dim); border-color:transparent; }
.nav-item.active::before { background:var(--sec-primary); box-shadow:none; }
.top-bar { box-shadow:0 1px 2px rgba(0,0,0,.04); }
.card,.stat-card,.qa-card,.boq-stat-card { border-radius:8px; box-shadow:var(--shadow-sm); }
.card-head { background:var(--bg-card); }
.stat-card:hover,.qa-card:hover { transform:translateY(-1px); box-shadow:var(--shadow-md); }
.btn { border-radius:6px; transition:background-color var(--t-fast),border-color var(--t-fast),color var(--t-fast),box-shadow var(--t-fast); }
.btn:hover { transform:none; }
.btn:active { transform:scale(.99); }
.btn-primary { background:#0f6cbd!important; box-shadow:none; }
.btn-primary:hover { background:#115ea3!important; }
.form-control:focus,input:focus,select:focus,textarea:focus { border-color:#0f6cbd!important; box-shadow:0 0 0 1px #0f6cbd; outline:none; }
.data-table th { font-size:11px; }
.account-avatar,.auth-mark { background:#0f6cbd; }
.page-area { animation-duration:180ms; }
@media(prefers-reduced-motion:reduce) {
  *,*::before,*::after { scroll-behavior:auto!important; animation-duration:.01ms!important; animation-iteration-count:1!important; transition-duration:.01ms!important; }
}

function T(key) {
  const lang = App ? App.lang : 'ar';
  return TR[lang]?.[key] || TR['ar'][key] || key;
}

// ─── Utilities ────────────────────────────────────────────────────
function fmtNum(n) {
  if (n == null || isNaN(n)) return '0';
  return Math.round(Number(n)).toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
}
// Alias for export.js compatibility
const formatNum = fmtNum;
// Global HTML-escape helper (XSS safety for user/AI-derived strings)
function esc(s) {
  return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
const t = T;
const showToast = typeof toast === 'function' ? toast : function(msg){console.log(msg);};

function riskIcon(r) {
  return r === 'critical' ? '🔴' : r === 'medium' ? '🟡' : '🟢';
}
function riskLabel(r) {
  const lang = App ? App.lang : 'ar';
  const L = { ar: { critical:'حرج', medium:'متوسط', minor:'ثانوي' }, en: { critical:'Critical', medium:'Medium', minor:'Minor' } };
  return L[lang]?.[r] || r;
}

// ─── Storage ──────────────────────────────────────────────────────
const Store = {
  KEY: 'ps_sec_v3',
  load() {
    try { return JSON.parse(localStorage.getItem(this.KEY)) || {}; } catch { return {}; }
  },
  save(data) {
    try { localStorage.setItem(this.KEY, JSON.stringify(data)); } catch(e) { console.warn(e); }
  },
  getData() { return this.load(); },
  setKey(k, v) { const d = this.load(); d[k] = v; this.save(d); },
  getKey(k, def) { return this.load()[k] ?? def; }
};

// ─── Toast ────────────────────────────────────────────────────────
function toast(msg, type='success', dur=3500) {
  const icons = { success:'✅', error:'❌', warning:'⚠️', info:'ℹ️' };
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `<span>${icons[type]}</span><span>${esc(msg)}</span>`;
  document.getElementById('toast-wrap').appendChild(el);
  setTimeout(() => {
    el.classList.add('hide');
    setTimeout(() => el.remove(), 280);
  }, dur);
}

// ─── Main App Object ──────────────────────────────────────────────
const App = {
  lang: Store.getKey('lang', 'ar'),
  theme: Store.getKey('theme', 'light'),
  page: 'dashboard',

  state: {
    boqNormal: { id: null, isEmergency: false, meta: { wo:'', project:'', location:'', date:'' }, items: [] },
    boqEmergency: { id: null, isEmergency: true, meta: { wo:'', project:'', location:'', date:'' }, items: [] },
    get boq() {
      return App.page === 'emergency_boq' ? this.boqEmergency : this.boqNormal;
    },
    set boq(val) {
      if (App.page === 'emergency_boq') {
        this.boqEmergency = val;
      } else {
        this.boqNormal = val;
      }
    },
    savedBOQs: Store.getKey('boqs', []),
    selectedBOQItem: null,
    contracts: Store.getKey('contracts', [])
  },

  // ── Init ──
  init() {
    this.setTheme(this.theme, false);
    this.setLang(this.lang, false);
    this.applyI18n();
    this.updateHeaderClock();
    if (!this._clockTimer) this._clockTimer = setInterval(() => this.updateHeaderClock(), 30000);
    this._lastBoqId = (this.state.boqNormal.id || this.state.boqEmergency.id) || null;

    document.querySelectorAll('.nav-item[data-page]').forEach(el => {
      el.addEventListener('click', () => this.go(el.dataset.page));
    });



    this.checkMobile();
    window.addEventListener('resize', () => this.checkMobile());
    if (typeof BackupManager !== 'undefined') BackupManager.initAuto();
    document.addEventListener('click', e => {
      if (!e.target.closest('#sidebar') && !e.target.closest('#menu-btn'))
        document.getElementById('sidebar').classList.remove('open');
      if (!e.target.closest('.dd-wrap'))
        this._closeDDs();
    });

    this.go('dashboard');
  },

  checkMobile() {
    const mb = document.getElementById('menu-btn');
    if (mb) mb.style.display = window.innerWidth <= 1024 ? 'flex' : 'none';
  },

  updateHeaderClock() {
    const time = document.getElementById('brand-clock-time');
    const date = document.getElementById('brand-clock-date');
    const label = document.getElementById('brand-clock-label');
    if (!time || !date || !label) return;
    const ar = this.lang === 'ar';
    const locale = ar ? 'ar-SA-u-ca-gregory-nu-latn' : 'en-GB';
    if (!this._clockFormatters || this._clockLocale !== locale) {
      this._clockLocale = locale;
      this._clockFormatters = {
        time: new Intl.DateTimeFormat(locale, {
          timeZone: 'Asia/Riyadh', hour: '2-digit', minute: '2-digit', hourCycle: 'h23'
        }),
        date: new Intl.DateTimeFormat(locale, {
          timeZone: 'Asia/Riyadh', weekday: 'short', day: 'numeric', month: 'short', year: 'numeric'
        }),
        isoDate: new Intl.DateTimeFormat('en-CA', {
          timeZone: 'Asia/Riyadh', year: 'numeric', month: '2-digit', day: '2-digit'
        })
      };
    }
    const now = new Date();
    label.textContent = ar ? 'توقيت الرياض' : 'RIYADH TIME';
    time.textContent = this._clockFormatters.time.format(now);
    date.textContent = this._clockFormatters.date.format(now);
    const dateParts = this._clockFormatters.isoDate.formatToParts(now);
    const part = type => dateParts.find(entry => entry.type === type)?.value || '';
    date.dateTime = `${part('year')}-${part('month')}-${part('day')}`;
  },

  // ── Theme ──
  setTheme(theme, save=true) {
    this.theme = theme;
    document.documentElement.setAttribute('data-theme', theme);
    document.getElementById('btn-dark').classList.toggle('active', theme === 'dark');
    document.getElementById('btn-light').classList.toggle('active', theme === 'light');
    if (save) Store.setKey('theme', theme);
  },

  // ── Language ──
  setLang(lang, save=true) {
    this.lang = lang;
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.body.classList.toggle('lang-ar', lang === 'ar');
    document.body.classList.toggle('lang-en', lang === 'en');
    document.getElementById('btn-lang-ar').classList.toggle('active', lang === 'ar');
    document.getElementById('btn-lang-en').classList.toggle('active', lang === 'en');
    if (save) Store.setKey('lang', lang);
    this.applyI18n();
    this.updateHeaderClock();
    if (save) this.go(this.page); // re-render current page
  },

  applyI18n() {
    document.querySelectorAll('[data-k]').forEach(el => {
      el.textContent = T(el.dataset.k);
    });
    // Nav labels
    const nlbls = ['main','tools','ref','support'];
    nlbls.forEach(k => {
      const el = document.getElementById(`nlbl-${k}`);
      if (el) el.textContent = T(`nlbl.${k}`);
    });
    // Sidebar footer
    const sf = document.getElementById('sfooter-text');
    if (sf) sf.textContent = T('sfooter');
    // Brand tagline
    const bt = document.getElementById('brand-tagline');
    if (bt) bt.textContent = T('brand.tagline');
  },

  // ── Navigation ──
  getArea() {
    return document.getElementById('page-area');
  },

  go(page) {
    this.page = page;    document.querySelectorAll('.nav-item[data-page]').forEach(el => {
      el.classList.toggle('active', el.dataset.page === page);
    });

    const icons = { news:'🛰️', dashboard:'🏠', contracts:'📑', profitability:'📈', operations:'🦺', boq:'📋', emergency_boq:'🚨', pdf:'📄', gemini:'✨', ai:'🤖', compare:'⚖️', certificate:'📜', link:'🔗', search:'🔍', pricelist:'📊', saved:'💾', backup:'🗄️', support:'📞' };
    document.getElementById('page-icon').textContent = icons[page] || '⚡';
    document.getElementById('page-title').textContent = T(`page.${page}`);

    const area = document.getElementById('page-area');
    area.innerHTML = '';
    area.style.animation = 'none';
    area.offsetHeight; // reflow
    area.style.animation = '';

    const renderers = {
      news:      () => this.renderNews(area),
      dashboard: () => this.renderDashboard(area),
      contracts: () => this.renderContracts(area),
      profitability: () => this.renderProfitability(area),
      operations: () => this.renderOperations(area),
      boq:       () => this.renderBOQ(area, false),
      emergency_boq: () => this.renderBOQ(area, true),
      ai:        () => this.renderAI(area),
      compare:   () => this.renderCompare(area),
      certificate: () => this.renderCertificate(area),
      link:        () => this.renderLink(area),
      search:    () => this.renderSearch(area),
      pricelist: () => this.renderPriceList(area),
      saved:     () => this.renderSaved(area),
      backup:    () => this.renderBackup(area),
      support:   () => this.renderSupport(area)
    };

    if (renderers[page]) renderers[page]();

    // Close sidebar on mobile/tablet
    if (window.innerWidth <= 1024)
      document.getElementById('sidebar').classList.remove('open');
  },

  newBOQ() {
    const isEmerg = (this.page === 'emergency_boq');
    this.state.boq = { id: null, isEmergency: isEmerg, status: 'draft', draftNo: null, refNo: null, approvedAt: null, approvedBy: null, rejectedAt: null, archivedAt: null, workflowLog: [], meta: { wo:'', project:'', location:'', date: new Date().toISOString().slice(0,10) }, items: [] };
    this._lastBoqId = null;
    this.go(isEmerg ? 'emergency_boq' : 'boq');
  },

  // ── BOQ Storage ──
  saveBOQToStore() {
    this._mergeBOQDuplicates();
    const boqs = this.state.savedBOQs;
    const boq = { ...this.state.boq, savedAt: new Date().toISOString() };
    if (!boq.id) boq.id = 'boq_' + Date.now();
    if (!boq.draftNo) boq.draftNo = this._nextBOQNo('D');
    this.state.boq.id = boq.id;
    this.state.boq.draftNo = boq.draftNo;
    this._lastBoqId = boq.id;
    const idx = boqs.findIndex(b => b.id === boq.id);
    if (idx >= 0) boqs[idx] = boq;
    else boqs.unshift(boq);
    this.state.savedBOQs = boqs;
    Store.setKey('boqs', boqs);
    return boq.id;
  },

  loadBOQ(id) {
    const boq = this.state.savedBOQs.find(b => b.id === id);
    if (!boq) return;
    this.state.boq = JSON.parse(JSON.stringify(boq));
    this._mergeBOQDuplicates();
    this._lastBoqId = id;
    this.go(this.state.boq.isEmergency ? 'emergency_boq' : 'boq');
    toast(this.lang === 'ar' ? 'تم فتح المقايسة' : 'BOQ opened', 'info');
  },

  deleteBOQ(id) {
    const msg = this.lang === 'ar' ? 'حذف هذه المقايسة نهائياً؟' : 'Permanently delete this BOQ?';
    if (!confirm(msg)) return;
    this.state.savedBOQs = this.state.savedBOQs.filter(b => b.id !== id);
    Store.setKey('boqs', this.state.savedBOQs);
    if (this._lastBoqId === id) this._lastBoqId = null;
    toast(this.lang === 'ar' ? 'تم الحذف' : 'Deleted', 'warning');
    this.go('saved');
  },

  // Emergency classification never changes a contract item's unit rate.
  boqUnitPrice(item) {
    const p = getItemByCode(item.code);
    const base = item.customPrice ?? item.contractPrice ?? (p ? p.newPrice : 0);
    return Math.round(base);
  },

  boqSubtotal(items) {
    return Math.round(items.reduce((s, i) => s + this.boqUnitPrice(i) * i.qty, 0));
  },

  // دمج الأكواد المكررة داخل المقايسة الحالية (جمع الكميات) — يمنع تكرار البنود
  _mergeBOQDuplicates() {
    const items = this.state.boq.items || [];
    if (!items.length) return false;
    const map = new Map();
    items.forEach(i => {
      if (!i || i.code == null) return;
      const k = String(i.code);
      if (!map.has(k)) map.set(k, Object.assign({}, i));
      else {
        const ex = map.get(k);
        ex.qty = (parseFloat(ex.qty) || 0) + (parseFloat(i.qty) || 0);
        if (!ex.customPrice && i.customPrice) ex.customPrice = i.customPrice;
        if (!ex.note && i.note) ex.note = i.note;
      }
    });
    const merged = [...map.values()];
    if (merged.length !== items.length) {
      this.state.boq.items = merged;
      return true;
    }
    return false;
  },

  // ────────────────────────────────────────────────
  // AI HUB — merged (PDF Analyzer + Gemini)
  // ────────────────────────────────────────────────
  renderAI(c) {
    const ar = this.lang === 'ar';
    const icon = (n) => `<span class="ai-tab-icon">${n}</span>`;
    const boqs = this.state.savedBOQs;
    const nBoqs = boqs.length;
    const nItems = boqs.reduce((s, b) => s + (b.items || []).length, 0);
    const nVal = boqs.reduce((s, b) => s + this.boqSubtotal(b.items, b.isEmergency), 0);
    const stat = (lbl, val, sub, col) => `<div style="flex:1;min-width:130px;background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--r-md);padding:12px 14px;border-top:3px solid ${col};">
      <div style="font-size:9.5px;color:var(--text-muted);font-weight:700;">${lbl}</div>
      <div style="font-size:19px;font-weight:900;color:var(--text-h);margin:3px 0 1px;">${val}</div>
      <div style="font-size:10px;color:var(--text-sub);">${sub}</div>
    </div>`;
    const cfg = this._aiConfig();
    const aiReady = !!(cfg.apiKey && cfg.endpoint && cfg.model);
    c.innerHTML = `
      <div style="display:flex;flex-direction:column;gap:16px;animation:pageFade 0.25s ease;">
        <div style="display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;">
          <div style="font-size:38px;line-height:1;">🧠</div>
          <div>
            <div style="font-weight:900;font-size:20px;color:var(--text-h);">${ar ? 'مركز الذكاء الهندسي الموحد' : 'Unified Engineering Intelligence'}</div>
            <div style="font-size:12.5px;color:var(--text-sub);margin-top:3px;">${ar ? 'خط تحليل واحد: ملفات • حصر بنود • كميات ومواد • تدقيق • تصدير واستيراد' : 'One analysis pipeline: files • item takeoff • quantities & materials • audit • export/import'}</div>
          </div>
          <span id="ai-connected-badge" style="margin-${ar?'right':'left'}:auto;padding:6px 14px;border-radius:99px;font-size:11px;font-weight:800;${aiReady ? 'background:rgba(0,132,61,0.1);color:var(--sec-primary);border:1px solid rgba(0,132,61,0.25);' : 'background:rgba(229,72,77,0.08);color:#e5484d;border:1px solid rgba(229,72,77,0.2);'}">${aiReady ? (cfg.providerName || cfg.provider) + ' • ' + cfg.model : (ar ? '⚠️ لم يتم الإعداد — أضف مفتاح API' : '⚠️ Not configured — add an API key')}</span>
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;">
          ${stat(ar ? 'مقايسات محفوظة' : 'Saved BOQs', nBoqs, ar ? 'إجمالي المحفوظات' : 'total', 'var(--sec-primary)')}
          ${stat(ar ? 'البنود الكلية' : 'Total Items', nItems, ar ? 'عبر كل المقايسات' : 'across all BOQs', 'var(--accent-blue)')}
          ${stat(ar ? 'قيمة المحفظة' : 'Portfolio Value', fmtNum(nVal) + (ar ? ' ر.س' : ' SAR'), ar ? 'بدون ضريبة' : 'excl. VAT', 'var(--accent-gold)')}
          ${stat(ar ? 'أقسام الأسعار' : 'Price Sections', CATEGORIES.length, ar ? 'في العقد الموحد' : 'in unified contract', 'var(--sec-gold)')}
        </div>
        <div class="ai-tabs" style="display:flex;gap:6px;background:var(--bg-inset, rgba(0,0,0,0.04));padding:5px;border-radius:14px;max-width:620px;border:1px solid var(--border);">
          <button class="ai-tab-btn active" data-aipanel="unified" onclick="App.switchAITab(this)">
            ${icon('🧪')}<span>${ar ? 'التحليل الموحد' : 'Unified Analysis'}</span>
          </button>
          <button class="ai-tab-btn" data-aipanel="gemini" onclick="App.switchAITab(this)">
            ${icon('🤖')}<span>${ar ? 'مساعد Gemini' : 'Gemini Assistant'}</span>
          </button>
          <button class="ai-tab-btn" data-aipanel="tools" onclick="App.switchAITab(this)">
            ${icon('🛠️')}<span>${ar ? 'المحركات المتخصصة' : 'Specialist Engines'}</span>
          </button>
        </div>
        <div id="ai-panel-unified"></div>
        <div id="ai-panel-gemini" style="display:none;"></div>
        <div id="ai-panel-tools" style="display:none;"></div>
      </div>`;
    const unified = c.querySelector('#ai-panel-unified');
    const gemPanel = c.querySelector('#ai-panel-gemini');
    const toolsPanel = c.querySelector('#ai-panel-tools');
    this._aiUnifiedPanel(unified);
    this.renderGemini(gemPanel);
    this._aiToolsPanel(toolsPanel);
  },

  switchAITab(btn) {
    const wrap = btn.closest('.ai-tabs');
    if (!wrap) return;
    wrap.querySelectorAll('.ai-tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const target = btn.getAttribute('data-aipanel');
    const root = document.getElementById('page-area');
    ['unified', 'gemini', 'tools'].forEach(id => {
      const el = root.querySelector('#ai-panel-' + id);
      if (el) el.style.display = (target === id) ? '' : 'none';
    });
  },

  // UNIFIED ANALYSIS — تحليل موحد: ملف/نص → بنود + كميات + تدقيق + تصدير
  // ────────────────────────────────────────────────

          <div class="card-head" style="background:linear-gradient(90deg,rgba(0,128,255,0.07),transparent);border-bottom:1px solid var(--border);">
            <span style="font-size:16px;">🧪</span>
            <span class="card-title">${ar ? 'محرك التحليل الذكي الموحد' : 'Unified Smart Analysis Engine'}</span>
            <span style="margin-${ar?'right':'left'}:auto;font-size:10.5px;color:var(--text-muted);">${ar ? 'PDF • Excel • CSV • JSON • نص → بنود مطابقة للأسعار الموحدة' : 'PDF • Excel • CSV • JSON • text → items matched to unified prices'}</span>

          <div class="card-body" style="display:flex;flex-direction:column;gap:12px;">

              <div style="font-size:34px;margin-bottom:6px;">📂</div>
              <div style="font-weight:800;color:var(--text-h);font-size:13.5px;">${ar ? 'اسحب الملف هنا أو انقر للاختيار' : 'Drop a file here or click to browse'}</div>
              <div style="font-size:10.5px;color:var(--text-muted);margin-top:5px;">${ar ? 'يدعم PDF / Excel / CSV / JSON / TXT — يُستخرج النص ويُحلَّل تلقائياً' : 'Supports PDF / Excel / CSV / JSON / TXT — text extracted & auto-analyzed'}</div>
              <input type="file" id="ai-unified-file" accept=".pdf,.xlsx,.xls,.csv,.json,.txt,application/pdf" style="display:none;">

              <span style="flex:1;height:1px;background:var(--border);"></span>
            </div>
            <textarea class="form-control" id="ai-unified-input" rows="5" style="font-size:12.5px;line-height:1.8;font-family:var(--font-mono,monospace);direction:rtl;" placeholder="${ar ? 'مثال: تركيب لوحة توزيع فرعية حديدة مع حفر مفتوح 20 متر وتمديد كيبل 300مم 30 متر وعمل 2 وصلة 300 و2 نهاية...' : 'e.g. install steel sub-distribution panel, open excavation 20 m, lay 300 mm cable 30 m, 2 joints 300, 2 terminations...'}"></textarea>
            <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
              <button class="btn btn-primary btn-lg" id="ai-unified-run" style="background:linear-gradient(135deg,#0069d9,#0080ff);border:none;font-size:13px;" onclick="App._aiUnifiedRun()">⚡ ${ar ? 'تشغيل التحليل الذكي' : 'Run Smart Analysis'}</button>
              <button class="btn btn-outline btn-sm" onclick="App._aiExample()">💡 ${ar ? 'مثال جاهز' : 'Example'}</button>
              <button class="btn btn-outline btn-sm" onclick="App._aiRestoreAnalysis()">📥 ${ar ? 'استعادة آخر تحليل' : 'Restore last analysis'}</button>
              <span id="ai-unified-status" style="font-size:11.5px;color:var(--text-sub);"></span>

    `;
    const drop = c.querySelector('#ai-unified-drop');
    const input = c.querySelector('#ai-unified-file');
    const defBg = 'linear-gradient(160deg,rgba(0,128,255,0.05),transparent)';
    drop.addEventListener('click', () => input.click());
    drop.addEventListener('dragover', e => { e.preventDefault(); drop.style.borderColor = 'rgba(0,128,255,0.85)'; drop.style.background = 'rgba(0,128,255,0.10)'; });
    drop.addEventListener('dragleave', () => { drop.style.borderColor = 'rgba(0,128,255,0.35)'; drop.style.background = defBg; });
    drop.addEventListener('drop', e => {
      e.preventDefault();
      drop.style.borderColor = 'rgba(0,128,255,0.35)';

      if (e.dataTransfer.files && e.dataTransfer.files[0]) this._aiUnifiedRead(e.dataTransfer.files[0]);
    });
    input.addEventListener('change', () => { if (input.files && input.files[0]) this._aiUnifiedRead(input.files[0]); });

  _aiUnifiedRead(file) {
    const ar = this.lang === 'ar';
    const name = (file.name || '').toLowerCase();
    const st = document.getElementById('ai-unified-status');
    const prog = document.getElementById('ai-unified-progress');
    const set = (t) => { if (st) st.textContent = t; };
    const pshow = (t) => { if (prog) { prog.style.display = 'block'; prog.innerHTML = `<div style="font-size:11.5px;color:var(--text-sub);">${t}</div>`; } };
    const phide = () => { if (prog) prog.style.display = 'none'; };
    if (/\.(pdf)$/i.test(name)) {
      pshow(ar ? '📄 جاري استخراج نص PDF...' : '📄 Extracting PDF text...');
      if (typeof _extractPdfText !== 'function') { phide(); set(ar ? '⚠️ مكتبة PDF غير متاحة' : 'PDF library unavailable'); return; }
      _extractPdfText(file).then(text => {
        const el = document.getElementById('ai-unified-input');
        if (el) el.value = text;
        this._aiUnifiedFromFile = true;
        this._aiUnifiedFileText = text;
        phide();
        set(ar ? `✅ استُخرج ${text.length} حرف — شغّل التحليل` : `✅ Extracted ${text.length} chars — run analysis`);
        toast(ar ? 'تم قراءة ملف PDF بنجاح' : 'PDF read successfully', 'success');
      }).catch(e => { phide(); set('⚠️ ' + (e.message || ar ? 'فشل قراءة PDF' : 'PDF read failed')); });
    } else if (/\.(xlsx?|csv|json|txt)$/i.test(name)) {
      if (typeof AIEngine === 'undefined') { set(ar ? 'محرك الذكاء غير محمل' : 'AI engine not loaded'); return; }
      AIEngine.readFile(file).then(res => {
        const el = document.getElementById('ai-unified-input');
        if (el) el.value = res.text;
        this._aiUnifiedRows = (res.rows && res.rows.length) ? res.rows : null;
        this._aiUnifiedFromFile = true;
        this._aiUnifiedFileText = res.text;
        set(ar ? `✅ تم قراءة ${name} — شغّل التحليل` : `✅ ${name} read — run analysis`);
        toast(ar ? 'تم قراءة الملف بنجاح' : 'File read successfully', 'success');
      }).catch(e => set('⚠️ ' + (e.message || 'read failed')));
    } else {
      set(ar ? '⚠️ صيغة غير مدعومة — PDF/Excel/CSV/JSON/TXT' : 'Unsupported format');
      toast(ar ? 'اختر PDF أو Excel أو CSV أو JSON أو TXT' : 'Choose PDF, Excel, CSV, JSON or TXT', 'warning');
    }
  },

  _aiExample() {
    const ar = this.lang === 'ar';
    const example = ar
      ? 'تركيب لوحة توزيع فرعية حديدة مع حفر مفتوح 20 متر وتمديد كيبل 300مم 30 متر وعمل 2 وصلة 300 و2 نهاية وتمديد كيبل 185 مم 6 متر و1 نهاية له وتمديد كيبل 70مم 6 متر وعمل نهاية له'
      : 'Install steel sub-distribution panel with open excavation 20 m and lay 300 mm cable 30 m make 2 joints 300 and 2 terminations and lay 185 mm cable 6 m one termination and lay 70 mm cable 6 m and make one termination';
    const el = document.getElementById('ai-unified-input');
    if (el) { el.value = example; this._aiUnifiedFromFile = false; this._aiUnifiedFileText = null; toast(ar ? 'تم تحميل المثال' : 'Example loaded', 'info'); }
  },

  _aiUnifiedRun() {
    const ar = this.lang === 'ar';
    const inp = document.getElementById('ai-unified-input');
    if (!inp || !inp.value.trim()) { toast(ar ? 'أدخل وصف الأعمال أو ارفع ملفاً أولاً' : 'Enter a work description or upload a file first', 'warning'); return; }
    if (typeof AIEngine === 'undefined') { toast(ar ? 'محرك الذكاء غير محمل' : 'AI engine not loaded', 'error'); return; }
    const status = document.getElementById('ai-unified-status');
    if (status) status.textContent = ar ? '⏳ جاري التحليل الذكي...' : '⏳ Running smart analysis...';
    setTimeout(() => {
      // 1) Tabular files (Excel/CSV/JSON) keep real quantities — parse rows directly
      let tk = null;
      if (this._aiUnifiedRows && this._aiUnifiedRows.length) {
        tk = AIEngine.tabularTakeoff(this._aiUnifiedRows);
      }
      // 2) Otherwise run the free-text smart takeoff engine (strict qty for files)
      if (!tk || !tk.items.length) {
        const stillFile = this._aiUnifiedFromFile && this._aiUnifiedFileText === inp.value;
        const t = AIEngine.smartTakeoff(inp.value, { defaultQty: !stillFile });
        if (tk && t.items.length) t.unresolved = (t.unresolved || []).concat(tk.unresolved || []);
        tk = t;
      }
      this._aiUnifiedRows = null;
      if (status) status.textContent = ar
        ? `✅ ${tk.items.length} بند محصى — ${tk.unresolved.length} غير معروف`
        : `✅ ${tk.items.length} items — ${tk.unresolved.length} unresolved`;
      this._aiUnifiedResults(tk, inp.value);
    }, 60);
  },

  _aiUnifiedResults(tk, inputText) {
    const ar = this.lang === 'ar';
    const el = document.getElementById('ai-unified-results');
    if (!el) return;
    if (!tk.items.length) {
      el.innerHTML = `<div class="alert alert-warning" style="margin-top:4px;">${ar ? 'لم يتم التعرف على أي بند — حسّن الوصف أو استخدم رموزاً مباشرة' : 'No items recognized — refine the description or use direct codes'}</div>`;
      return;
    }
    this._tkItems = tk.items.slice();
    const total = tk.items.reduce((s, it) => { const p = getItemByCode(it.code); return s + (p ? p.newPrice * it.qty : 0); }, 0);
    const vat = Math.round(total * 0.15);
    const catMap = {};
    tk.items.forEach(it => { const p = getItemByCode(it.code); const g = (p && p.group) || (ar ? 'أخرى' : 'Other'); catMap[g] = (catMap[g] || 0) + 1; });
    const catChips = Object.entries(catMap).slice(0, 5).map(([g, n]) => `<span class="chip" style="font-size:10px;background:rgba(0,128,255,0.08);border-color:rgba(0,128,255,0.28);">${g}: <b>${n}</b></span>`).join('');
    let auditHtml = '';

      const nWarn = (rep && rep.warnings) ? rep.warnings.length : 0;
      auditHtml = `<span style="display:inline-block;padding:4px 12px;border-radius:99px;font-size:11px;font-weight:800;${nCrit ? 'background:rgba(229,72,77,0.12);color:#e5484d;' : 'background:rgba(0,132,61,0.12);color:var(--sec-primary);'}">${nCrit ? '⚠️ ' + nCrit + ' ' + (ar ? 'بند حرج' : 'critical') : '✅ ' + (ar ? 'مطابق للعقد الموحد' : 'contract-compliant')}</span>${nWarn ? `<span style="display:inline-block;padding:4px 12px;border-radius:99px;font-size:11px;font-weight:800;background:rgba(255,169,0,0.12);color:var(--sec-gold);">${nWarn} ${ar ? 'تنبيه' : 'warnings'}</span>` : ''}`;
    }
    el.innerHTML = `
      <div class="card" style="border:1px solid rgba(0,128,255,0.3);">
        <div class="card-head" style="background:linear-gradient(90deg,rgba(0,128,255,0.07),transparent);border-bottom:1px solid var(--border);">
          <span style="font-size:16px;">📋</span>
          <span class="card-title">${ar ? 'نتائج التحليل الموحد' : 'Unified Analysis Results'}</span>
          <span style="margin-${ar?'right':'left'}:auto;font-size:13px;font-weight:900;color:#0a6ef0;">${fmtNum(total)} ${ar?'ر.س':'SAR'}</span>
        </div>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;padding:12px 14px;border-bottom:1px solid var(--border);">
          <div style="padding:10px 12px;background:var(--bg-surface);border:1px solid var(--border);border-radius:10px;">
            <div style="font-size:9.5px;color:var(--text-muted);font-weight:700;">${ar ? 'البنود المحصاة' : 'Items'}</div>
            <div style="font-size:17px;font-weight:900;color:#0a6ef0;">${tk.items.length}</div>
          </div>
          <div style="padding:10px 12px;background:var(--bg-surface);border:1px solid var(--border);border-radius:10px;">
            <div style="font-size:9.5px;color:var(--text-muted);font-weight:700;">${ar ? 'إجمالي الأعمال' : 'Works Total'}</div>
            <div style="font-size:17px;font-weight:900;color:var(--text-h);">${fmtNum(total)}</div>
          </div>
          <div style="padding:10px 12px;background:var(--bg-surface);border:1px solid var(--border);border-radius:10px;">
            <div style="font-size:9.5px;color:var(--text-muted);font-weight:700;">VAT 15%</div>
            <div style="font-size:17px;font-weight:900;color:var(--sec-gold);">${fmtNum(vat)}</div>
          </div>
          <div style="padding:10px 12px;background:var(--bg-surface);border:1px solid var(--border);border-radius:10px;">
            <div style="font-size:9.5px;color:var(--text-muted);font-weight:700;">${ar ? 'المجموع شاملاً الضريبة' : 'Grand Total'}</div>
            <div style="font-size:17px;font-weight:900;color:var(--sec-primary);">${fmtNum(total + vat)}</div>
          </div>
        </div>
        <div class="tbl-wrap"><table class="data-table"><thead><tr>
          <th>#</th><th>${ar?'الرمز':'Code'}</th><th>${ar?'الوصف':'Description'}</th><th>${ar?'وحدة':'UOM'}</th>
          <th style="width:90px;">${ar?'الكمية':'Qty'}</th><th style="width:110px;">${ar?'السعر':'Price'}</th><th style="width:120px;">${ar?'الإجمالي':'Total'}</th><th style="width:84px;">${ar?'الثقة':'Conf'}</th><th></th>
        </tr></thead><tbody>
          ${tk.items.map((it, i) => {
            const p = getItemByCode(it.code);
            const tot = p ? p.newPrice * it.qty : 0;
            const conf = (typeof AIEngine2 !== 'undefined' && AIEngine2.confidence) ? AIEngine2.confidence(it.score) : null;
            const confColor = conf ? (conf.pct >= 75 ? 'var(--sec-primary)' : conf.pct >= 55 ? 'var(--sec-gold)' : '#e5484d') : '';
            const confBg = conf ? (conf.pct >= 75 ? 'rgba(0,132,61,0.12)' : conf.pct >= 55 ? 'rgba(255,169,0,0.12)' : 'rgba(229,72,77,0.12)') : '';
            return `<tr>
              <td style="color:var(--text-muted);font-size:11px;">${i + 1}</td>
              <td class="td-code"><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${(typeof AIEngine2 !== 'undefined' && AIEngine2.colorOfCode) ? AIEngine2.colorOfCode(it.code) : '#64748b'};margin-${ar?'left':'right'}:5px;vertical-align:middle;"></span>${esc(it.code)}</td>
              <td class="td-desc"><div class="td-desc-ar">${esc(p?.arDesc || '—')}</div><div style="font-size:10px;color:var(--text-muted);">${ar ? 'مطابقة' : 'matched'}: ${esc(it.score)}${conf ? '/' : ''}${conf ? conf.label : ''}</div></td>

              <td><button class="btn btn-danger btn-sm btn-icon" onclick="App._aiUnifiedRemove(${i})">✕</button></td>
            </tr>`;
          }).join('')}
        </tbody></table></div>
        ${tk.unresolved.length ? `
          <div class="card-body" style="border-top:1px solid var(--border);">
            <div style="font-size:11px;font-weight:800;color:var(--accent-gold);margin-bottom:6px;">⚠️ ${ar?'مقاطع غير معروفة — راجعها يدوياً':'Unresolved segments'}:</div>

        </div>
      </div>
    `;
  },

  _aiUnifiedRemove(i) {
    if (!this._tkItems) return;
    this._tkItems.splice(i, 1);
    this._aiUnifiedResults({ items: this._tkItems, unresolved: [] }, '');
  },

  _aiExport(kind) {
    const ar = this.lang === 'ar';
    if (!this._tkItems || !this._tkItems.length) { toast(ar ? 'لا توجد بنود للتصدير' : 'Nothing to export', 'warning'); return; }
    const items = this._tkItems.map(it => ({ code: it.code, qty: it.qty || 1, customPrice: null }));
    const meta = { project: ar ? 'تحليل ذكي' : 'Smart Analysis', wo: '', location: '', date: new Date().toISOString().slice(0, 10) };
    if (kind === 'excel' && typeof exportToExcel === 'function') exportToExcel({ items }, meta);
    else if (kind === 'csv') this._tkExportCSV();
    else if (kind === 'pdf' && typeof exportToPDF === 'function') exportToPDF({ items }, meta);
    else if (kind === 'json' && typeof exportToJSON === 'function') exportToJSON({ items }, meta);
    else toast(ar ? 'محرك التصدير غير محمل' : 'Export engine unavailable', 'error');
  },

  _aiSaveAnalysis() {
    const ar = this.lang === 'ar';
    if (!this._tkItems || !this._tkItems.length) { toast(ar ? 'لا توجد نتائج للحفظ' : 'Nothing to save', 'warning'); return; }
    Store.setKey('aiHub.analysis', { items: this._tkItems, savedAt: new Date().toISOString() });
    toast(ar ? '✅ تم حفظ التحليل محلياً (تصدير/استيراد عبر زر الاستعادة)' : '✅ Analysis saved locally', 'success');
  },

  _aiRestoreAnalysis() {
    const ar = this.lang === 'ar';
    const saved = Store.getKey('aiHub.analysis', null);
    if (!saved || !saved.items || !saved.items.length) { toast(ar ? 'لا يوجد تحليل محفوظ — شغّل تحليلاً أولاً' : 'No saved analysis — run one first', 'warning'); return; }
    this._tkItems = saved.items;
    this._aiUnifiedResults({ items: saved.items, unresolved: [] }, '');
    toast(ar ? '✅ تمت استعادة آخر تحليل محفوظ' : '✅ Restored last saved analysis', 'success');
  },

  // ────────────────────────────────────────────────
  // SPECIALIST ENGINES — محركات متخصصة قابلة للإطلاق
  // ────────────────────────────────────────────────
  _aiToolsPanel(c) {
    const ar = this.lang === 'ar';
    const tools = [
      { id: 'intel', icon: '🧮', title: ar ? 'محرك الكميات والمواد' : 'Quantity & Materials Engine', sub: ar ? 'معادلات الحساب حسب الكود السعودي: حفر، ردم، خرسانة، كابلات، تأريض، أعمدة...' : 'SBC formulas: excavation, backfill, concrete, cables, earthing, poles...', col: '#0a6ef0' },

  _geminiOpenChat(q) {
    const ar = this.lang === 'ar';
    const text = q || document.getElementById('gemini-input')?.value.trim() || '';
    const copied = (() => {
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text);
          return true;
        }
      } catch(e){}
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        return true;
      } catch(e){}
      return false;
    })();
    toast(ar
      ? (text ? '📋 تم نسخ سؤالك — الصقه في محادثة Gemini' : '💬 تم فتح محادثة Gemini — اكتب سؤالك هناك')
      : (text ? '📋 Question copied — paste it into Gemini chat' : '💬 Gemini chat opened — type your question there'),
      text ? 'success' : 'info');
    window.open(this.AI.CHAT_URL, '_blank', 'noopener');
  },

  _geminiSend() {
    const inp = document.getElementById('gemini-input');
    if (!inp) return;
    const q = inp.value.trim();
    if (!q) { toast(this.lang==='ar'?'اكتب سؤالك أولاً':'Type your question first','warning'); return; }
    this._geminiOpenChat(q);
  },

  _aiConfig() {
    if (this.AI.config) return this.AI.config;
    let cfg = null;
    try { cfg = JSON.parse(localStorage.getItem(this.AI.KEY) || 'null'); } catch(e){ cfg = null; }
    this.AI.config = cfg || this._aiDefaults();
    return this.AI.config;
  },

  _aiDefaults() {
    return { provider:'custom', providerName:'', model:'', endpoint:'', apiKey:'', presetEndpoint:'' };

  _aiProviderOptions(current) {
    const ar = this.lang === 'ar';
    const opts = [
      ['',         ar?'— اختر الموفر —':'— Select provider —'],
      ['openai',   'OpenAI (GPT)'],
      ['google',   'Google Gemini'],
      ['anthropic','Anthropic Claude'],
      ['groq',     'Groq'],
      ['mistral',  'Mistral AI'],
      ['deepseek', 'DeepSeek'],
      ['openrouter','OpenRouter (any model)'],
      ['local',    'Local free model (Ollama / LM Studio)'],
      ['custom',   'Custom / Any company'],
    ];
    return opts.map(o => {
      const isBase = o[0] === current || (current === 'custom' && o[0] === '');
      return `<option value="${o[0]}"${isBase?' selected':''}>${o[0] && ar ? this._aiProviderLabelAr(o[0]) : o[1]}</option>`;
    }).join('');
  },

  _aiProviderLabelAr(p) {
    return { openai:'OpenAI (GPT)', google:'Google Gemini', anthropic:'Anthropic Claude', groq:'Groq', mistral:'Mistral AI', deepseek:'DeepSeek', openrouter:'OpenRouter', local:'محلي مجاني (Ollama / LM Studio)', custom:'مخصص / أي شركة' }[p] || p;
  },

  _aiPreset(provider) {
    const ar = this.lang === 'ar';
    const presets = {
      openai:    { endpoint:'https://api.openai.com/v1',        model:'gpt-4o',               name:'OpenAI' },
      google:    { endpoint:'https://generativelanguage.googleapis.com', model:'gemini-1.5-flash', name:'Google Gemini' },
      anthropic: { endpoint:'https://api.anthropic.com',         model:'claude-3-5-sonnet-20241022', name:'Anthropic Claude' },
      groq:      { endpoint:'https://api.groq.com/openai/v1',    model:'llama-3.3-70b-versatile', name:'Groq' },
      mistral:   { endpoint:'https://api.mistral.ai/v1',         model:'mistral-large-latest', name:'Mistral AI' },
      deepseek:  { endpoint:'https://api.deepseek.com/v1',       model:'deepseek-chat',        name:'DeepSeek' },
      openrouter:{ endpoint:'https://openrouter.ai/api/v1',      model:'openai/gpt-4o',        name:'OpenRouter' },
      local:     { endpoint:'http://localhost:11434/v1',         model:'llama3.1',             name:'Local' },
      custom:    { endpoint:'',                                   model:'',                     name:'Custom' }
    };
    const p = presets[provider] || presets.custom;
    const set = (id, v) => { const el = document.getElementById(id); if (el) el.value = v || ''; };
    set('ai-endpoint', p.endpoint);
    set('ai-model', p.model);
    const nameEl = document.getElementById('ai-provider-name');
    if (nameEl) nameEl.value = p.name;
    this._setLocalAiKeyUi(provider === 'local');
    const st = document.getElementById('ai-status');
    if (st) { st.textContent = ar ? 'تم اختيار الإعدادات المسبقة — احفظ للتطبيق' : 'Preset loaded — save to apply'; st.style.color = 'var(--sec-gold)'; }
  },

  _aiSave() {
    const ar = this.lang === 'ar';
    const v = id => (document.getElementById(id)?.value || '').trim();
    const provider = v('ai-provider');
    if (!provider) { toast(ar?'اختر الموفر أولاً':'Select a provider first','warning'); return; }
    if (!v('ai-endpoint') || !v('ai-model')) { toast(ar?'أدخل رابط الموفر والموديل':'Enter the provider endpoint and model','warning'); return; }
    const apiKey = v('ai-key');
    if (provider !== 'local' && !apiKey) { toast(ar?'أدخل مفتاح API للموفر السحابي':'Enter an API key for the cloud provider','warning'); return; }
    const cfg = {
      provider,
      providerName: v('ai-provider-name') || (document.getElementById('ai-provider')?.selectedOptions?.[0]?.text || provider),
      model: v('ai-model'),
      endpoint: v('ai-endpoint'),
      apiKey,
      presetEndpoint: v('ai-endpoint')
    };
    try { localStorage.setItem(this.AI.KEY, JSON.stringify(cfg)); } catch(e) {
      toast((ar ? 'تعذر حفظ إعدادات النموذج: ' : 'Could not save model settings: ') + e.message, 'error');
      return;
    }

  _aiRequest(cfg, systemPrompt, question) {
    const history = (this.AI.history || []).slice(-8);
    const provider = (cfg.provider || 'custom').toLowerCase();
    const endpoint = (cfg.endpoint || '').trim().replace(/\/+$/, '');
    const apiKey = (cfg.apiKey || '').trim();
    const model = (cfg.model || '').trim() || 'model';

    // ── Google Gemini native format ──
    if (provider === 'google') {
      const contents = [{ role:'user', parts:[{ text: question }] }];
      history.forEach(h => contents.push({ role:h.role === 'user' ? 'user' : 'model', parts:[{ text: h.parts?.[0]?.text || '' }] }));
      return fetch(`${endpoint}/v1beta/models/${model}:generateContent?key=${encodeURIComponent(apiKey)}`, {
        method:'POST',
        headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({ contents, systemInstruction:{ parts:[{ text: systemPrompt }] } })
      })
      .then(async r => {
        const data = await r.json();
        if (!r.ok) throw new Error(data?.error?.message || ('HTTP ' + r.status));
        return (data.candidates?.[0]?.content?.parts || []).map(p=>p.text||'').join('') || '';
      });
    }

    // ── Anthropic Claude format ──
    if (provider === 'anthropic') {
      const messages = history.map(h => ({ role: h.role === 'user' ? 'user' : 'assistant', content: h.parts?.[0]?.text || '' }));
      messages.push({ role:'user', content: question });
      return fetch(`${endpoint}/v1/messages`, {
        method:'POST',
        headers:{ 'Content-Type':'application/json', 'x-api-key': apiKey, 'anthropic-version':'2023-06-01' },
        body: JSON.stringify({ model, max_tokens:1024, system: systemPrompt, messages })
      })
      .then(async r => {
        const data = await r.json();
        if (!r.ok) throw new Error(data?.error?.message || ('HTTP ' + r.status));
        return (data.content || []).map(p => p.text || '').join('') || '';
      });
    }

    // ── OpenAI-compatible chat completions (OpenAI, Groq, Mistral, DeepSeek, OpenRouter, Ollama, LM Studio, custom) ──
    const messages = [{ role:'system', content: systemPrompt }];
    history.forEach(h => messages.push({ role: h.role === 'user' ? 'user' : 'assistant', content: h.parts?.[0]?.text || '' }));
    messages.push({ role:'user', content: question });

    const headers = { 'Content-Type':'application/json' };
    if (apiKey && provider !== 'local') headers['Authorization'] = 'Bearer ' + apiKey;
    return fetch(`${endpoint}/chat/completions`, {
      method:'POST',
      headers,
      body: JSON.stringify({ model, messages, temperature:0.4 })
    })
    .then(async r => {
      const data = await r.json();
      if (!r.ok) throw new Error(data?.error?.message || ('HTTP ' + r.status));
      return data?.choices?.[0]?.message?.content || '';
    });
  },

  // ── Contract Items & Market Benchmark (مقارنة السوق وفق الكود السعودي) ──
  _contractItems(ct) {
    const map={};
    const add=(code,qty,price)=>{
      if(!code)return;
      code=String(code).trim();
      if(!map[code])map[code]={code,qty:0,price:0};
      map[code].qty+=parseFloat(qty)||0;
      if(price!=null)map[code].price=parseFloat(price)||0;
    };
    (ct.items||[]).forEach(i=>add(i.code,i.qty,i.price));
    (ct.linkedBoqs||[]).forEach(bid=>{
      const b=(this.state.savedBOQs||[]).find(x=>x.id===bid);
      if(!b)return;
      (b.items||[]).forEach(i=>{
        const up=(typeof getItemByCode==='function')?(getItemByCode(i.code)||{}).newPrice||0:0;
        add(i.code,i.qty,i.customPrice??up);
      });
    });
    return Object.values(map);
  },

  _contractMarketEstimate(ct){
    const items=this._contractItems(ct);
    let matched=0, unmatched=0, marketTotal=0, itemTotal=0;
    items.forEach(it=>{
      const p=(typeof getItemByCode==='function')?getItemByCode(it.code):null;
      const q=it.qty||0;
      if(p&&p.newPrice){matched++;marketTotal+=q*parseFloat(p.newPrice);itemTotal+=q*(it.price||0);}
      else unmatched++;
    });
    const contractTotal=parseFloat(ct.value||0)||itemTotal||0;
    const base=marketTotal||contractTotal||1;
    const variance=contractTotal-marketTotal;
    const variancePct=Math.round((variance/base)*1000)/10;
    return {items,matched,unmatched,marketTotal,itemTotal,contractTotal,variance,variancePct};
  },

  _renderMarketStrip(){
    const ar=this.lang==='ar';
    const cs=this.state.contracts||[];
    const ests=cs.map(c=>this._contractMarketEstimate(c));
    const totMarket=ests.reduce((s,e)=>s+e.marketTotal,0);
    const totContract=cs.reduce((s,c)=>s+parseFloat(c.value||0),0)||ests.reduce((s,e)=>s+e.itemTotal,0);
    const matched=ests.reduce((s,e)=>s+e.matched,0);
    const unmatched=ests.reduce((s,e)=>s+e.unmatched,0);
    const diff=totContract-totMarket;
    const up=diff>0;
    const strip=(icon,lbl,val,col,sub)=>`<div style="background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:11px 14px;border-top:3px solid ${col};">
      <div style="font-size:9.5px;color:var(--text-muted);font-weight:700;display:flex;align-items:center;gap:4px;">${icon} ${lbl}</div>
      <div style="font-size:16px;font-weight:900;color:var(--text-h);margin:3px 0 1px;">${val}</div>
      <div style="font-size:9.5px;color:${sub.col||'var(--text-sub)'};">${sub.txt||''}</div>
    </div>`;
    return strip('🧮',ar?'تقدير السوق (مرجع)':'Market Benchmark',fmtNum(totMarket),'var(--se-blue)',{txt:ar?`${matched} بند مطابق للقائمة الموحدة`:`${matched} matched to unified list`})
      + strip('⚖️',ar?'فرق السوق (وفورات/خسارة)':'Market Variance',(up?'+':'')+fmtNum(diff),up?'var(--accent-red)':'var(--accent-green)',{txt:(up?'▲':'▼')+' '+Math.abs(totMarket?Math.round((diff/totMarket)*1000)/10:0)+'%',col:up?'var(--accent-red)':'var(--accent-green)'})
      + strip('📋',ar?'بنود خارج القائمة':'Unmatched Items',unmatched,unmatched?'var(--sec-gold)':'var(--accent-green)',{txt:ar?'تتطلب تقديراً خاصاً':'need custom estimate'})
      + strip('🇸🇦',ar?'المرجع المعياري':'Standard Ref.','SBC · RFx','var(--sec-gold)',{txt:ar?'الكود السعودي للمباني':'Saudi Building Code'});
  },

  _contractPortfolioEstimate(){

    const rows=cs.map((c,i)=>{const e=this._contractMarketEstimate(c);return {c,e};});
    const totMarket=rows.reduce((s,r)=>s+r.e.marketTotal,0);
    const totContract=cs.reduce((s,c)=>s+parseFloat(c.value||0),0)||rows.reduce((s,r)=>s+r.e.itemTotal,0);
    const diff=totContract-totMarket; const up=diff>0;
    const pct=Math.round((diff/Math.max(1,totMarket))*1000)/10;

  _exportPortfolio(){
    const ar=this.lang==='ar';
    const cs=this.state.contracts||[];
    const rows=cs.map((c,i)=>{const e=this._contractMarketEstimate(c);return {title:c.title||('#'+(i+1)),ref:c.ref||'',partner:c.partner||'',value:c.value||0,market:e.marketTotal,variancePct:e.variancePct,matched:e.matched,unmatched:e.unmatched};});
    const totMarket=rows.reduce((s,r)=>s+r.market,0);
    const totContract=rows.reduce((s,r)=>s+r.value,0);
    const head=(ar?'تقرير تقدير محفظة العقود ومقارنة السوق':'Contract Portfolio Estimate Report')+'\n'
      +(ar?'التاريخ':'Date')+': '+new Date().toLocaleDateString()+'\n\n'
      +(ar?'إجمالي قيمة العقود':'Total value')+': '+fmtNum(totContract)+'\n'
      +(ar?'تقدير السوق':'Market estimate')+': '+fmtNum(totMarket)+'\n\n';
    const body=rows.map(r=>`${r.title}\t${r.ref}\t${r.partner}\t${r.value}\t${r.market}\t${r.variancePct}%\t${r.matched}/${r.matched+r.unmatched}`).join('\n');
    const blob=new Blob(["\uFEFF"+head+body],{type:'text/plain;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download='portfolio_estimate.txt';a.click();

  _contractExport(idx){
    const ar=this.lang==='ar';
    const ct=this.state.contracts[idx];
    if(!ct)return;
    const data={type:'unified-contract',version:2,exported:new Date().toISOString(),contract:JSON.parse(JSON.stringify(ct))};
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download=`contract_${ct.ref||ct.id}.json`;a.click();
    URL.revokeObjectURL(url);
    toast(ar?'تم تصدير العقد':'Contract exported','success');
  },

  _importContractFile(){
    const ar=this.lang==='ar';
    const inp=document.createElement('input');
    inp.type='file';inp.accept='.json,.txt,.csv';
    inp.addEventListener('change',()=>{
      const f=inp.files[0]; if(!f)return;
      const ext=String(f.name).split('.').pop().toLowerCase();
      const rd=new FileReader();
      rd.onload=()=>{
        if(ext==='json'){
          try{
            const obj=JSON.parse(rd.result);
            const c=obj.contract||obj;
            if(!c||typeof c!=='object'||!c.id&&!c.title&&!c.text)throw new Error('no contract');
            c.id='ct_'+Date.now();
            this.state.contracts.unshift(c);
            this._saveContracts();
            this._renderContractList();
            toast(ar?'✅ تم استيراد العقد':'✅ Contract imported','success');
          }catch(e){toast(ar?'ملف عقد غير صالح':'Invalid contract file','error');}
        } else {
          const text=String(rd.result||'');
          const rows=text.split(/\r?\n/).filter(l=>l.trim()).map(l=>l.split(/[,;\t]/).map(x=>x.trim()));
          const ct={id:'ct_'+Date.now(),title:f.name.replace(/\.[^.]+$/,''),ref:'',partner:'',value:0,date:new Date().toISOString().slice(0,10),status:'draft',notes:'',text:text,versions:[],aiAnalysis:null,linkedBoqs:[],items:[]};
          rows.slice(0,100).forEach(r=>{
            const cells=Array.isArray(r)?r:[String(r||'')];
            const code=cells.join(' ').match(/\d{8,9}/)?.[0];
            if(!code)return;
            let qty=0,price=0,vi=0;
            cells.forEach((v,i)=>{
              if(/^\d+([.,]\d+)?$/.test(String(v))){
                const n=parseFloat(String(v).replace(',','.'));
                if(vi===0)qty=n; else if(vi===1)price=n; vi++;
              }
            });
            ct.items.push({code,qty:qty||1,price:price||0});
          });
          this.state.contracts.unshift(ct);
          this._saveContracts();
          this._renderContractList();
          toast(ar?`✅ تم استيراد ${ct.items.length} بند في عقد جديد — راجع بياناته`:`✅ Imported ${ct.items.length} items into a new contract`,'success',6000);
        }
      };
      rd.readAsText(f);
    });
    inp.click();
  },

  _exportContractItems(idx){
    const ar=this.lang==='ar';
    const ct=this.state.contracts[idx];
    if(!ct)return;
    const data={type:'contract-items',version:1,exported:new Date().toISOString(),contractRef:ct.ref||ct.id,items:ct.items||[]};
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download=`contract_items_${ct.ref||ct.id}.json`;a.click();
    URL.revokeObjectURL(url);
    toast(ar?'تم تصدير بنود العقد':'Contract items exported','success');
  },

  _importContractItemsFile(idx){
    const ar=this.lang==='ar';
    const inp=document.createElement('input');
    inp.type='file';inp.accept='.json';
    inp.addEventListener('change',()=>{
      const f=inp.files[0]; if(!f)return;
      const rd=new FileReader();
      rd.onload=()=>{
        try{
          const obj=JSON.parse(rd.result);
          const items=(obj.items||(obj.contract&&obj.contract.items)||(Array.isArray(obj)?obj:null));
          if(!items||!items.length)throw new Error('no items');
          const ct=this.state.contracts[idx]; if(!ct)return;
          ct.items=ct.items||[];
          items.forEach(i=>{
            if(!i||!i.code)return;
            const code=String(i.code);
            const ex=ct.items.find(x=>String(x.code)===code);
            const qty=parseFloat(i.qty)||0;
            const price=parseFloat(i.price??i.customPrice)||0;
            if(ex){ex.qty=(parseFloat(ex.qty)||0)+qty; if(price)ex.price=price;}
            else ct.items.push({code,qty:qty||1,price:price||0});
          });
          this._saveContracts();
          toast(ar?'✅ تم استيراد البنود':'✅ Items imported','success');
          document.getElementById('ct-import-modal')?.remove();
          this._openContract(idx);
        }catch(e){toast(ar?'ملف بنود غير صالح':'Invalid items file','error');}
      };
      rd.readAsText(f);
    });
    inp.click();
  },

    const ar=this.lang==='ar';
    const ct=this.state.contracts[idx];
    if(!ct)return;
    const sources=[];
    (this.state.savedBOQs||[]).forEach(b=>{

      sources.push({type:'ct',title:c.title||('#'+(ci+1)),items:its});
    });
    if(!sources.length){toast(ar?'لا توجد مقايسات أو عقود سابقة للاستيراد':'No previous BOQs/contracts to import','warning');return;}
    const bx=document.createElement('div');

          <div style="font-size:10.5px;color:var(--text-sub);">${ar?'اختر مصدراً لدمج بنوده في هذا العقد (دمج تلقائي حسب الكود):':'Pick a source to merge its items into this contract (auto-merged by code):'}</div>

        ${sources.map((s,si)=>`<div style="display:flex;align-items:center;gap:10px;padding:11px 13px;background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--r-md);cursor:pointer;" onclick="App._applyContractImport(${idx},${si})">

            <div style="font-size:10px;color:var(--text-muted);">${s.type==='boq'?(ar?'مقايسة محفوظة':'Saved BOQ'):(ar?'عقد آخر':'Another contract')} • ${s.items.length} ${ar?'بند':'items'}</div>
          </div>
          <span class="btn btn-outline btn-sm" style="font-size:10.5px;padding:5px 12px;">${ar?'دمج':'Merge'} +</span>
        </div>`).join('')}

  _applyContractImport(idx,si){
    const ar=this.lang==='ar';
    const ct=this.state.contracts[idx];
    if(!ct)return;
    const sources=[];
    (this.state.savedBOQs||[]).forEach(b=>{if((b.items||[]).length)sources.push({type:'boq',items:b.items});});
    this.state.contracts.forEach((c,ci)=>{if(ci===idx)return;const its=this._contractItems(c);if(its.length)sources.push({type:'ct',items:its});});
    const s=sources[si]; if(!s)return;
    ct.items=ct.items||[];
    s.items.forEach(i=>{
      if(!i||!i.code)return;
      const code=String(i.code);
      const ex=ct.items.find(x=>String(x.code)===code);
      const qty=parseFloat(i.qty)||0;
      const price=parseFloat(i.price??i.customPrice)||0;
      if(ex){ex.qty=(parseFloat(ex.qty)||0)+qty; if(price)ex.price=price;}
      else ct.items.push({code,qty:qty||1,price:price||0});
    });
    this._saveContracts();
    document.getElementById('ct-import-modal')?.remove();
    toast(ar?'✅ تم دمج البنود — اعرض التقدير السوقي':'✅ Items merged — view market estimate','success');
    this._openContract(idx);
  },

  _renderContractList() {
    const container=document.getElementById('ct-list');
    if(!container)return;
    const ar=this.lang==='ar';
    const q=(document.getElementById('ct-search')?.value||'').toLowerCase();
    const statusFilter=document.getElementById('ct-filter-status')?.value||'';
    let contracts=this.state.contracts||[];
    if(q) contracts=contracts.filter(c=>(c.title||'').toLowerCase().includes(q)||(c.partner||'').toLowerCase().includes(q)||(c.ref||'').toLowerCase().includes(q));
    if(statusFilter){
      if(statusFilter==='expiring') contracts=contracts.filter(c=>{const l=this._lifecycleInfo(c);return c.endDate&&l.daysLeft!=null&&l.daysLeft>=0&&l.daysLeft<=30;});
      else if(statusFilter==='overdue') contracts=contracts.filter(c=>this._lifecycleInfo(c).overdue);
      else contracts=contracts.filter(c=>c.status===statusFilter);
    }

    if(!contracts.length){
      container.innerHTML=`<div class="card"><div class="card-body"><div class="empty-state" style="padding:36px 10px;"><div class="empty-icon">📭</div><p>${ar?'لا توجد عقود':'No contracts found'}</p></div></div></div>`;
      return;
    }
    container.innerHTML=contracts.map((ct,i)=>`
      <div class="card mb-12" style="border-color:rgba(200,168,75,0.08);cursor:pointer;" onclick="App._openContract(${i})">

                <span style="display:block;font-size:10px;color:var(--text-muted);margin-top:2px;">${ct.date||''}</span>
              </div>
              <div style="display:flex;gap:4px;">
                <button class="btn btn-mini" title="${ar?'تقدير السوق':'Market estimate'}" onclick="event.stopPropagation();App._contractEstimate(${i});App._openContract(${i});">🧮</button>
                <button class="btn btn-mini" title="${ar?'تصدير':'Export'}" onclick="event.stopPropagation();App._contractExport(${i})">📤</button>
              </div>
            </div>
          </div>
          <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;">
            <span class="badge ${ct.status==='active'?'badge-ok':ct.status==='closed'?'badge-medium':'badge-warning'}" style="font-size:9px;">
              ${ct.status==='active'?ar?'نشط':'Active':ct.status==='closed'?ar?'منتهي':'Closed':ar?'مسودة':'Draft'}
            </span>
            <span class="badge" style="font-size:9px;background:rgba(0,102,204,0.08);color:var(--se-blue);border-color:rgba(0,102,204,0.15);">
              ${ar?'بنود':'Items'}: ${this._contractItems(ct).length}
            </span>
            ${this._renderMarketBadge(ct)}
            ${this._renderLifecycleChip(ct)}
            ${ct.aiAnalysis?.risks?.length?`<span class="badge badge-critical" style="font-size:9px;">⚠️ ${ct.aiAnalysis.risks.length} ${ar?'مخاطرة':'risks'}</span>`:''}

          <div class="card mb-16" style="border-color:rgba(200,168,75,0.08);">

                <div class="form-group"><label class="form-label">${ar?'نهاية العقد (تسليم)':'End Date (Delivery)'}</label>

              <div class="form-group"><label class="form-label">${ar?'الحالة':'Status'}</label>
                <select class="form-control" id="ct-edit-status" style="font-size:11.5px;">
                  <option value="draft" ${ct.status==='draft'?'selected':''}>${ar?'مسودة':'Draft'}</option>
                  <option value="active" ${ct.status==='active'?'selected':''}>${ar?'نشط':'Active'}</option>

                <textarea class="form-control" id="ct-edit-notes" rows="3" style="font-size:11.5px;resize:vertical;">${ct.notes||''}</textarea>
              </div>
            </div>

          ${this._renderLifecyclePanel(ct)}

          <!-- Contract Text / Clauses -->
          <div class="card mb-16" style="border-color:rgba(200,168,75,0.08);">
            <div class="card-head" style="background:linear-gradient(90deg,rgba(200,168,75,0.05),transparent);border-bottom:1px solid rgba(200,168,75,0.08);">

          <!-- Versions -->
          <div class="card mb-16" style="border-color:rgba(200,168,75,0.08);">

                  <span><strong>v${vi+1}</strong> — ${v.date||''} ${v.label?': '+v.label:''}</span>
                  <span onclick="App._compareVersions(${idx},${vi})" style="cursor:pointer;color:var(--se-blue);font-weight:700;">⚖️ ${ar?'مقارنة':'Compare'}</span>

              `).join(''):`<div style="text-align:center;padding:14px;color:var(--text-muted);font-size:11px;">${ar?'لا توجد إصدارات سابقة':'No previous versions'}</div>`}

        <!-- RIGHT: AI Analysis Panel -->
        <div>
          <div class="card mb-16" style="border-color:rgba(0,214,138,0.1);">
            <div class="card-head" style="background:linear-gradient(90deg,rgba(0,214,138,0.04),transparent);border-bottom:1px solid rgba(0,214,138,0.08);">
              <span>🤖</span>
              <span class="card-title" style="color:var(--accent-green);font-weight:800;">${ar?'تحليل الذكاء الاصطناعي':'AI Analysis'}</span>
            </div>
            <div class="card-body" id="ct-ai-panel" style="padding:12px;min-height:100px;">
              ${ct.aiAnalysis?this._renderAIAnalysis(ct.aiAnalysis):`<div style="text-align:center;padding:20px 0;color:var(--text-muted);font-size:11.5px;">🤖 ${ar?'اضغط "تحليل AI" لبدء التحليل':'Press "AI Analyze" to start'}</div>`}
            </div>
          </div>

          <!-- Market Estimate & Comparison (تقدير السوق) -->
          <div class="card mb-16" style="border-color:rgba(14,165,233,0.12);">
            <div class="card-head" style="background:linear-gradient(90deg,rgba(14,165,233,0.06),transparent);border-bottom:1px solid rgba(14,165,233,0.1);">
              <span>🧮</span>
              <span class="card-title" style="color:var(--se-blue);font-weight:800;">${ar?'تقدير السوق والمقارنة (الكود السعودي)':'Market Estimate & Comparison (SBC)'}</span>
            </div>
            <div class="card-body" id="ct-estimate-panel" style="padding:12px;min-height:80px;"></div>
          </div>

          <!-- Linked Items -->
          <div class="card mb-16" style="border-color:rgba(200,168,75,0.08);">
            <div class="card-head" style="background:linear-gradient(90deg,rgba(200,168,75,0.05),transparent);border-bottom:1px solid rgba(200,168,75,0.08);">
              <span>🔗</span>
              <span class="card-title" style="font-weight:800;">${ar?'المقايسات المرتبطة':'Linked BOQs'}</span>
              <span style="margin-${ar?'right':'left'}:auto;font-size:10.5px;color:var(--text-muted);" id="ct-link-count">${(ct.linkedBoqs||[]).length}</span>
            </div>
            <div class="card-body" style="padding:12px;display:flex;flex-direction:column;gap:10px;">
              <div id="ct-linked-list" style="display:flex;flex-direction:column;gap:8px;">
                ${this._renderLinkedBOQs(idx)}
              </div>
              <div style="display:flex;gap:8px;align-items:center;">
                <select class="form-control" id="ct-link-select" style="font-size:11.5px;flex:1;">
                  <option value="">${ar?'— اختر مقايسة لحفظها بالعقد —':'— Select a BOQ to link —'}</option>
                  ${(this.state.savedBOQs||[]).map(b=>`<option value="${b.id}">${b.meta?.wo||b.id} — ${(b.meta?.project||'').slice(0,34)} (${fmtNum(this.boqSubtotal(b.items,b.isEmergency))} ${ar?'ر.س':'SAR'})</option>`).join('')}
                </select>
                <button class="btn btn-primary btn-sm" style="font-size:11px;padding:7px 14px;" onclick="App._linkBOQToContract(${idx})">🔗 ${ar?'ربط':'Link'}</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    `;
    if(ct.aiAnalysis)this._renderAIAnalysis(ct.aiAnalysis);
    this._contractEstimate(idx);
  },

  _saveContractDetail(idx) {
    const ct=this.state.contracts[idx];
    if(!ct)return;
    ct.title=document.getElementById('ct-edit-title')?.value||'';
    ct.ref=document.getElementById('ct-edit-ref')?.value||'';
    ct.date=document.getElementById('ct-edit-date')?.value||'';
    ct.partner=document.getElementById('ct-edit-partner')?.value||'';
    ct.value=parseFloat(document.getElementById('ct-edit-value')?.value)||0;
    ct.startDate=document.getElementById('ct-edit-start')?.value||'';
    ct.endDate=document.getElementById('ct-edit-end')?.value||'';
    ct.paidValue=parseFloat(document.getElementById('ct-edit-paid')?.value)||0;
    ct.progress=Math.min(100,Math.max(0,parseFloat(document.getElementById('ct-edit-progress')?.value)||0));
    const newStatus=document.getElementById('ct-edit-status')?.value||'draft';
    if(newStatus!==ct.status){
      if(!ct.lifecycle)ct.lifecycle=[];
      const stName=newStatus==='active'?(this.lang==='ar'?'نشط':'Active'):newStatus==='closed'?(this.lang==='ar'?'منتهي':'Closed'):(this.lang==='ar'?'مسودة':'Draft');
      ct.lifecycle.push({date:new Date().toISOString().slice(0,10),from:ct.status,to:newStatus,note:(this.lang==='ar'?'تغيير الحالة إلى ':'Status → ')+stName});
      ct.status=newStatus;
    }
    ct.notes=document.getElementById('ct-edit-notes')?.value||'';
    ct.text=document.getElementById('ct-edit-text')?.value||'';
    this._saveContracts();
    toast(this.lang==='ar'?'✅ تم حفظ العقد':'✅ Contract saved','success');
  },

  _saveContracts() {
    Store.setKey('contracts', this.state.contracts);
  },

  // ── Contract Lifecycle (دورة حياة العقود: مدد/مالية/إنجاز/تنبيهات) ──
  _lifecycleInfo(ct) {
    const today=new Date();
    const end=ct&&ct.endDate?new Date(ct.endDate+'T23:59:59'):null;
    let daysLeft=null, overdue=false;
    if(end){
      const ms=end-today;
      daysLeft=Math.ceil(ms/86400000);
      overdue=daysLeft<0;
    }
    const value=parseFloat(ct&&ct.value||0);
    const paid=parseFloat(ct&&ct.paidValue||0);
    const remaining=Math.max(0,value-paid);
    const progress=(ct&&ct.progress!=null)?Math.min(100,Math.max(0,parseFloat(ct.progress)||0)):(value?Math.round(paid/value*100):0);
    return {daysLeft,overdue,value,paid,remaining,progress};
  },

  _renderLifecycleChip(ct) {
    const ar=this.lang==='ar';
    const lc=this._lifecycleInfo(ct);
    if(!ct.endDate) return `<span class="badge" style="font-size:9px;background:rgba(0,102,204,0.06);color:var(--text-muted);border-color:var(--border);">🗓️ ${ar?'بدون مدة':'no deadline'}</span>`;
    if(lc.overdue) return `<span class="badge badge-critical" style="font-size:9px;">⏰ ${ar?'متأخر':'Overdue'} ${Math.abs(lc.daysLeft)} ${ar?'يوم':'d'}</span>`;
    if(lc.daysLeft<=30) return `<span class="badge badge-medium" style="font-size:9px;">⏳ ${lc.daysLeft} ${ar?'يوم متبقي':'days left'}</span>`;
    return `<span class="badge" style="font-size:9px;background:rgba(0,214,138,0.08);color:var(--accent-green);border-color:rgba(0,214,138,0.15);">🗓️ ${lc.daysLeft} ${ar?'يوم':'days'}</span>`;
  },

  _renderLifecyclePanel(ct) {
    const ar=this.lang==='ar';
    const lc=this._lifecycleInfo(ct);
    const chip=this._renderLifecycleChip(ct);
    const chipCell=()=>{
      if(!ct.endDate) return `<div style="font-size:10px;color:var(--text-muted);">${ar?'حدد تاريخ التسليم لعرض العداد':'Set an end date to enable the counter'}</div>`;
      const days=Math.abs(lc.daysLeft);
      const txt=lc.overdue?(ar?`متأخر عن التسليم منذ ${days} يوم`:`Overdue by ${days} day(s)`):(ar?`${days} يوم متبقٍ للتسليم`:`${days} day(s) until delivery`);
      return `<div style="font-size:11px;font-weight:900;color:${lc.overdue?'var(--accent-red)':lc.daysLeft<=30?'var(--sec-gold)':'var(--accent-green)'};">${lc.overdue?'⏰':'⏳'} ${txt}</div>`;
    };
    const fin=(l,v,col)=>`<div style="flex:1;min-width:96px;background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--r-md);padding:8px 10px;border-top:3px solid ${col};">
      <div style="font-size:9px;color:var(--text-muted);font-weight:700;">${l}</div>
      <div style="font-size:13px;font-weight:900;color:var(--text-h);margin-top:2px;">${v}</div>
    </div>`;
    const timeline=(ct.lifecycle||[]).length?(ct.lifecycle||[]).slice().reverse().map(e=>`
      <div style="display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--border);font-size:11px;">
        <span style="font-size:13px;margin-top:1px;">${e.to==='active'?'🟢':e.to==='closed'?'⚫':'📝'}</span>
        <div style="flex:1;min-width:0;">
          <div style="font-weight:800;color:var(--text-h);">${esc(e.note||e.to)}</div>
          <div style="font-size:10px;color:var(--text-muted);margin-top:1px;">${e.date||''}${e.from&&e.to&&e.from!==e.to?' · '+esc(e.from)+' → '+esc(e.to):''}</div>
        </div>
      </div>`).join(''):`<div style="text-align:center;padding:12px 0;color:var(--text-muted);font-size:10.5px;">${ar?'لا يوجد سجل دورة حياة بعد':'No lifecycle events yet'}</div>`;
    return `
      <div class="card mb-16" style="border-color:rgba(0,214,138,0.1);">
        <div class="card-head" style="background:linear-gradient(90deg,rgba(0,214,138,0.05),transparent);border-bottom:1px solid rgba(0,214,138,0.08);">
          <span>🔄</span><span class="card-title" style="color:var(--accent-green);font-weight:800;">${ar?'دورة حياة العقد':'Contract Lifecycle'}</span>
          <span style="margin-${ar?'right':'left'}:auto;">${chip}</span>
        </div>
        <div class="card-body" style="padding:14px;">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px;">
            ${chipCell()}
            <span style="font-size:10px;color:var(--text-muted);">${ct.startDate?ar?'بداية: '+'📅 '+ct.startDate:'Start: 📅 '+ct.startDate:''}${ct.startDate&&ct.endDate?' — ':''}${ct.endDate?ar?'تسليم: '+'🚚 '+ct.endDate:'Delivery: 🚚 '+ct.endDate:''}</span>
          </div>
          <div style="height:10px;background:var(--bg-soft);border-radius:99px;overflow:hidden;margin-bottom:10px;">
            <div style="height:100%;width:${lc.progress}%;background:linear-gradient(90deg,var(--accent-green),#34d399);border-radius:99px;"></div>
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;">
            ${fin(ar?'قيمة العقد':'Value',fmtNum(lc.value)+' '+(ar?'ر.س':'SAR'),'var(--se-blue)')}
            ${fin(ar?'المدفوع':'Paid',fmtNum(lc.paid)+' '+(ar?'ر.س':'SAR'),'var(--accent-green)')}
            ${fin(ar?'المتبقي':'Remaining',fmtNum(lc.remaining)+' '+(ar?'ر.س':'SAR'),'var(--sec-gold)')}
            ${fin(ar?'الإنجاز':'Progress',lc.progress+'%',lc.progress>=100?'var(--accent-green)':'var(--sec-gold)')}
          </div>
          <div style="font-size:10px;font-weight:800;color:var(--text-sub);margin-bottom:2px;">📜 ${ar?'سجل الحالات':'Status History'}</div>
          ${timeline}
        </div>
      </div>`;
  },

  _renderLinkedBOQs(idx) {
    const ar=this.lang==='ar';
    const ct=this.state.contracts[idx];
    if(!ct) return '';
    const links=ct.linkedBoqs||[];
    if(!links.length){
      return `<div style="text-align:center;padding:16px 0;color:var(--text-muted);font-size:11px;">${ar?'لا توجد مقايسات مرتبطة بعد':'No linked BOQs yet'}</div>`;
    }
    return links.map(bid=>{
      const b=this.state.savedBOQs.find(x=>x.id===bid);
      if(!b) return '';
      const sub=this.boqSubtotal(b.items,b.isEmergency);
      return `
        <div style="display:flex;align-items:center;gap:10px;padding:9px 11px;background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--r-md);">
          <span style="font-size:15px;">📋</span>
          <div style="flex:1;min-width:0;">
            <div style="font-size:11.5px;font-weight:800;color:var(--text-h);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${b.meta?.project||b.meta?.wo||b.id}</div>
            <div style="font-size:10px;color:var(--text-muted);">${b.meta?.wo||''} • ${(b.items||[]).length} ${ar?'بند':'items'} • ${fmtNum(sub)} ${ar?'ر.س':'SAR'}</div>
          </div>
          <span class="btn btn-outline btn-sm" style="font-size:10px;padding:4px 10px;cursor:pointer;" onclick="App.loadBOQ('${b.id}'); App.go('boq')">${ar?'فتح':'Open'}</span>
          <span class="btn btn-danger btn-sm btn-icon" style="cursor:pointer;" onclick="App._unlinkBOQFromContract(${idx},'${b.id}')">✕</span>
        </div>`;
    }).join('');
  },

  _linkBOQToContract(idx) {
    const ar=this.lang==='ar';
    const sel=document.getElementById('ct-link-select');
    if(!sel||!sel.value){ toast(ar?'اختر مقايسة أولاً':'Select a BOQ first','warning'); return; }
    const ct=this.state.contracts[idx];
    if(!ct) return;
    if(!ct.linkedBoqs) ct.linkedBoqs=[];
    if(!ct.linkedBoqs.includes(sel.value)){
      ct.linkedBoqs.push(sel.value);
      this._saveContracts();
      toast(ar?'✅ تم ربط المقايسة بالعقد':'✅ BOQ linked to contract','success');
    } else {
      toast(ar?'المقايسة مرتبطة مسبقاً':'BOQ already linked','warning');
    }
    this._openContract(idx);
  },

  _unlinkBOQFromContract(idx,bid) {
    const ar=this.lang==='ar';
    const ct=this.state.contracts[idx];
    if(!ct) return;
    ct.linkedBoqs=(ct.linkedBoqs||[]).filter(x=>x!==bid);
    this._saveContracts();
    toast(ar?'تم إلغاء الربط':'Link removed');
    this._openContract(idx);
  },

  _addContractVersion(idx) {
    const ar=this.lang==='ar';
    const ct=this.state.contracts[idx];
    if(!ct)return;
    if(!ct.versions)ct.versions=[];
    ct.versions.push({
      date:new Date().toISOString().slice(0,10),
      label:ar?'إصدار تلقائي':'Auto version',
      snapshot:JSON.parse(JSON.stringify({title:ct.title,ref:ct.ref,text:ct.text,value:ct.value,partner:ct.partner,notes:ct.notes}))
    });
    this._saveContracts();
    toast(ar?'✅ تم حفظ الإصدار':'✅ Version saved','success');
    this._openContract(idx);
  },

  _analyzeContract(idx) {
    const ar=this.lang==='ar';
    const ct=this.state.contracts[idx];
    if(!ct)return;
    const text=ct.text||'';
    if(!text.trim()){
      toast(ar?'الرجاء إدخال نصوص العقد للتحليل':'Please enter contract text for analysis','warning');
      return;
    }
    const panel=document.getElementById('ct-ai-panel');
    if(panel)panel.innerHTML=`<div style="text-align:center;padding:20px 0;"><div style="display:inline-block;width:24px;height:24px;border:3px solid rgba(0,214,138,0.15);border-top-color:var(--accent-green);border-radius:50%;animation:spin 1s linear infinite;margin-bottom:8px;"></div><div style="font-size:11px;color:var(--text-muted);">${ar?'جاري التحليل...':'Analyzing...'}</div></div>`;

    setTimeout(()=>{
      const analysis=this._runContractAI(text);
      ct.aiAnalysis=analysis;
      this._saveContracts();
      if(panel)panel.innerHTML=this._renderAIAnalysis(analysis);
      toast(ar?'✅ اكتمل تحليل AI':'✅ AI analysis complete','success');
    },600);
