  _runContractAI(text) {
    const t=text.toLowerCase();
    const ar=this.lang==='ar';
    const analysis={obligations:[],risks:[],timelines:[],responsibilities:[],itemsCount:0,summary:''};

    // Extract obligations (التزامات)
    const obligationKeywords=ar?['يلتزم','يجب على','على الطرف','يتعهد','يلزم']:['shall','must','obliged','undertake','responsible for'];
    obligationKeywords.forEach(kw=>{
      const regex=new RegExp((ar?'':'\\b')+kw+'.*?(?:\\.|\\n)',ar?'g':'gi');
      let m;
      while((m=regex.exec(t))!==null){
        const txt=m[0].trim().slice(0,120);
        if(txt.length>10&&!analysis.obligations.some(o=>o.includes(txt.slice(0,30))))analysis.obligations.push(txt);
      }
    });

    // Extract risks (مخاطر)
    const riskKeywords=ar?['مخاط','غرامة','جزاء','فسخ','تعويض','تأخير']:['penalty','fine','terminat','delay','liability','risk','default'];
    riskKeywords.forEach(kw=>{
      if(t.includes(kw)){
        const lines=t.split('\n').filter(l=>l.includes(kw)&&l.trim().length>15);
        lines.forEach(l=>{
          const txt=l.trim().slice(0,120);
          if(!analysis.risks.some(r=>r.includes(txt.slice(0,30))))analysis.risks.push(txt);
        });
      }
    });

    // Extract timelines (مدد زمنية)
    const datePatterns=[/(\d+)\s*(يوم|شهر|سنة|week|month|year|day)/gi,/(خلال|within|within)\s*(\d+)/gi];
    datePatterns.forEach(re=>{
      let m;
      while((m=re.exec(t))!==null){
        const ctx=t.slice(Math.max(0,m.index-30),m.index+m[0].length+30).trim();
        if(ctx.length>10&&!analysis.timelines.some(tl=>tl.includes(ctx.slice(0,30))))analysis.timelines.push(ctx);
      }
    });

    // Extract responsibilities (مسؤوليات)
    const respKeywords=ar?['مسؤول','مسؤولية','مهام','صلاحيات','اختصاص']:['responsib','accountable','authority','shall ensure'];
    respKeywords.forEach(kw=>{
      const regex=new RegExp((ar?'':'\\b')+kw+'.*?(?:\\.|\\n)',ar?'g':'gi');
      let m;
      while((m=regex.exec(t))!==null){
        const txt=m[0].trim().slice(0,120);
        if(txt.length>10&&!analysis.responsibilities.some(r=>r.includes(txt.slice(0,30))))analysis.responsibilities.push(txt);
      }
    });

    analysis.summary=ar
      ?`تم استخراج ${analysis.obligations.length} التزام، ${analysis.risks.length} مخاطرة، ${analysis.timelines.length} مدة زمنية، ${analysis.responsibilities.length} مسؤولية.`
      :`Extracted ${analysis.obligations.length} obligations, ${analysis.risks.length} risks, ${analysis.timelines.length} timelines, ${analysis.responsibilities.length} responsibilities.`;
    analysis.itemsCount=Math.round(analysis.obligations.length*1.5+analysis.risks.length*2);

    return analysis;
  },

  _renderAIAnalysis(a) {
    const ar=this.lang==='ar';
    if(!a)return `<div style="text-align:center;padding:20px 0;color:var(--text-muted);font-size:11.5px;">🤖 ${ar?'اضغط "تحليل AI" لبدء التحليل':'Press "AI Analyze" to start'}</div>`;
    const sections=[
      {icon:'📋',title:ar?'الالتزامات المستخرجة':'Obligations',items:a.obligations,color:'var(--se-blue)',empty:ar?'لم يتم العثور على التزامات':'No obligations found'},
      {icon:'⚠️',title:ar?'المخاطر المكتشفة':'Risks',items:a.risks,color:'var(--accent-red)',empty:ar?'لم يتم اكتشاف مخاطر':'No risks detected'},
      {icon:'⏱️',title:ar?'المدد الزمنية':'Timelines',items:a.timelines,color:'var(--sec-gold)',empty:ar?'لم يتم العثور على مدد':'No timelines found'},
      {icon:'👤',title:ar?'المسؤوليات':'Responsibilities',items:a.responsibilities,color:'var(--accent-green)',empty:ar?'لم يتم العثور على مسؤوليات':'No responsibilities found'}

    return `<div style="font-size:10.5px;font-weight:700;color:var(--accent-green);margin-bottom:8px;">${esc(a.summary)}</div>
      ${sections.map(s=>`
        <div style="margin-bottom:10px;">

            ${s.items.map(it=>`<div style="padding:4px 8px;border-bottom:1px solid var(--border);font-size:10px;color:var(--text-main);line-height:1.4;">• ${esc(it)}</div>`).join('')}

        </div>
      `).join('')}`;
  },

  _compareVersions(ctIdx, vIdx) {
    const ar=this.lang==='ar';
    const ct=this.state.contracts[ctIdx];
    if(!ct||!ct.versions||!ct.versions[vIdx])return;
    const v=ct.versions[vIdx];
    const current={title:ct.title,ref:ct.ref,text:ct.text,value:ct.value,partner:ct.partner,notes:ct.notes};
    const prev=v.snapshot;
    if(!prev){
      toast(ar?'الإصدار لا يحتوي على بيانات':'Version has no data','warning');
      return;
    }
    const fields=['title','ref','partner','value','notes'];
    let diffHtml=fields.map(f=>{
      const old=prev[f]||'';
      const cur=current[f]||'';
      if(String(old)===String(cur))return '';
      return `<tr>
        <td style="font-size:10.5px;font-weight:700;color:var(--text-h);padding:4px 8px;border-bottom:1px solid var(--border);">${ar?{
          title:'العنوان',ref:'المرجع',partner:'الطرف الثاني',value:'القيمة',notes:'ملاحظات'
        }[f]:{
          title:'Title',ref:'Reference',partner:'Partner',value:'Value',notes:'Notes'
        }[f]}</td>
        <td style="font-size:10.5px;padding:4px 8px;border-bottom:1px solid var(--border);color:var(--accent-red);"><del>${esc(old)}</del></td>
        <td style="font-size:10.5px;padding:4px 8px;border-bottom:1px solid var(--border);color:var(--accent-green);"><ins>${esc(cur)}</ins></td>
      </tr>`;
    }).join('');

    if(!diffHtml){
      toast(ar?'لا توجد تغييرات بين الإصدارين':'No changes between versions','info');
      return;
    }
    const panel=document.getElementById('ct-ai-panel');
    if(panel)panel.innerHTML=`
      <div style="font-weight:700;font-size:11px;color:var(--sec-gold);margin-bottom:8px;">⚖️ ${ar?'مقارنة الإصدارات':'Version Comparison'} v${vIdx+1} → ${ar?'الحالي':'Current'}</div>
      <table style="width:100%;border-collapse:collapse;font-size:10.5px;">
        <thead><tr style="background:rgba(200,168,75,0.05);">
          <th style="padding:6px 8px;text-align:right;border-bottom:1px solid var(--border);">${ar?'الحقل':'Field'}</th>
          <th style="padding:6px 8px;text-align:right;border-bottom:1px solid var(--border);color:var(--accent-red);">${ar?'السابق':'Previous'}</th>
          <th style="padding:6px 8px;text-align:right;border-bottom:1px solid var(--border);color:var(--accent-green);">${ar?'الحالي':'Current'}</th>
        </tr></thead>
        <tbody>${diffHtml||`<tr><td colspan="3" style="text-align:center;padding:12px;color:var(--text-muted);">${ar?'لا توجد تغييرات':'No changes'}</td></tr>`}</tbody>
      </table>
    `;
  },

          <!-- Right Workspace: Beautiful SEC Price List & Interactive Catalog Explorer (Always visible & selectable) -->

                  <button class="chip" data-cat="${c.id}" onclick="App._filterSearchCat('${c.id}', this)" style="font-size:10px;padding:4px 9px;">${ar?c.labelAr:c.labelEn}</button>
                  `).join('')}

                  <!-- Dynamically populated vertical items rendered here -->
                </div>
                
                <div id="spacious-catalog-prompt" style="padding:12px;text-align:center;color:var(--text-muted);font-size:11px;border:1px dashed var(--border);border-radius:var(--r-md);display:none;">
                  ${ar?'اكتب في البحث أو تصفح الأقسام لتصفية بنود العقد الموحد لمدينة الرياض':'Type in search or select categories to filter Riyadh unified items'}

    this._setupBOQSearch();

    // Init Voice Assistant Card

    // Check for session restore

  },

  _activeSearchCat: 'all',

  _filterSearchCat(cat, btn) {
    this._activeSearchCat = cat;
    document.querySelectorAll('.cat-chips .chip').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    this._triggerSearch();
  },

  _setupBOQSearch() {
    const inp = document.getElementById('boq-search');
    if (!inp) return;

    inp.addEventListener('input', () => {
      this._triggerSearch();
    });
    
    // Automatically trigger initial search to show default list of items!
    this._triggerSearch();
  },

  _triggerSearch() {
    const inp = document.getElementById('boq-search');
    const q = inp ? inp.value.trim() : '';
    
    let res = [];
    if (q.length > 0) {
      res = searchItems(q);
    } else if (this._activeSearchCat !== 'all') {
      res = PRICE_LIST.filter(i => i.subcat === this._activeSearchCat);
    } else {
      // By default when empty, show the first 30 items of the catalog for vertical selection
      res = PRICE_LIST;
    }

    if (this._activeSearchCat !== 'all' && q.length > 0) {
      res = res.filter(i => i.subcat === this._activeSearchCat);
    }

    this._renderCatalogResults(res.slice(0, 30));
  },

  _getCatLabel(cat) {
    const ar = this.lang === 'ar';
    const sub = SUB_CATEGORIES.find(c => c.id === cat);
    if (sub) return ar ? sub.labelAr : sub.labelEn;
    const labels = {
      all: ar ? 'الكل' : 'All',
      cable: ar ? 'كابلات وتمديد' : 'Cables',
      excavation: ar ? 'حفر ومدني' : 'Civils',
      equipment: ar ? 'معدات ومحولات' : 'Equipment',
      composite: ar ? 'وصلات وتأريض' : 'Testing'
    };
    return labels[cat] || cat;
  },

  _renderCatalogResults(items) {
    const ar = this.lang === 'ar';
    const c = document.getElementById('spacious-catalog-results');
    const prompt = document.getElementById('spacious-catalog-prompt');
    if (!c) return;

    if (!items.length) {
      c.innerHTML = `<div style="padding:20px;text-align:center;color:var(--text-muted);font-size:12px;">${ar?'لا توجد نتائج مطابقة لعقد الرياض الموحد':'No matching items found'}</div>`;
      if (prompt) prompt.style.display = 'none';
      return;
    }

    c.innerHTML = `
      <div style="display:flex;flex-direction:column;gap:8px;">
        ${items.map((item) => `
          <div class="spacious-catalog-item" style="display:flex;flex-direction:column;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-md);padding:10px;gap:6px;transition:all var(--t-fast);position:relative;">
            
            <!-- Code & Category row -->
            <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:10px;">
              <span style="font-family:var(--font-mono);background:var(--sec-primary-dim);color:var(--accent-green);padding:2px 6px;border-radius:4px;border:1px solid rgba(0,132,61,0.2);">${item.code}</span>
              <span class="badge" style="font-size:9px;background:rgba(200,168,75,0.08);color:var(--sec-gold);padding:2px 6px;border-radius:4px;border:1px solid rgba(200,168,75,0.15);">${App._getCatLabel(item.cat)}</span>
            </div>
            
            <!-- Description -->
            <div style="text-align:right;">
              <div style="font-size:12.5px;font-weight:800;color:var(--text-h);line-height:1.4;">${item.arDesc}</div>
              <div style="font-size:10.5px;color:var(--text-sub);margin-top:3px;line-height:1.3;">${item.enDesc}</div>
            </div>
            
            <!-- UOM, Price and Add row -->
            <div style="display:flex;align-items:center;justify-content:space-between;border-top:1px dashed var(--border);padding-top:8px;margin-top:2px;gap:6px;">
              <div style="display:flex;align-items:center;gap:6px;">
                <span class="uom-tag" style="font-size:10.5px;background:var(--bg-surface);border:1px solid var(--border);color:var(--text-body);padding:2px 6px;border-radius:4px;">${item.uom}</span>
                <span style="font-size:12px;font-weight:900;color:var(--accent-gold);">${fmtNum(item.newPrice)} ر.س</span>
              </div>
              
              <!-- Qty input & add button -->
              <div style="display:flex;align-items:center;gap:6px;">
                <input class="qty-cell-input" type="number" id="cat-qty-${item.code}" value="1" min="0.01" step="0.01" style="width:52px;padding:3px;font-size:11px;height:26px;text-align:center;">
                <button class="btn btn-primary" onclick="App._addFromCatalog('${item.code}')" style="font-size:11px;padding:4px 10px;height:26px;border-radius:4px;">➕ ${ar?'إضافة':'Add'}</button>
              </div>
            </div>
          </div>
        `).join('')}
      </div>
    `;
    
    if (prompt) prompt.style.display = 'none';
  },

  _addFromCatalog(code) {
    const qtyInput = document.getElementById(`cat-qty-${code}`);
    const qty = qtyInput ? parseFloat(qtyInput.value) || 1 : 1;
    const p = getItemByCode(code);
    if (!p) return;
    const ar = this.lang === 'ar';
    const ex = this.state.boq.items.find(x => String(x.code) === String(code));
    if (ex) {
      ex.qty = (parseFloat(ex.qty) || 0) + qty;
      toast(ar ? `تم دمج البند ${code} — الكمية ${ex.qty}` : `Merged item ${code} — qty ${ex.qty}`, 'info');
    } else {
      this.state.boq.items.push({ code, qty, customPrice: null, note: '' });
      toast(ar ? `تمت إضافة بند ${code} للمقايسة` : `Added item ${code} to BOQ`);
    }
    this._renderBOQTable();
  },

  _renderBOQReminders(depResults) {
    const ar = this.lang === 'ar';
    const c = document.getElementById('boq-related-reminders');
    if (!c) return;

    const auto = (typeof autoLinkItems === 'function') ? autoLinkItems(this.state.boq.items) : { linked: [], equipment: null, logistics: null, source: null, area: 0, excav: 0 };
    const exists = code => this.state.boq.items.some(x => String(x.code) === String(code));

    let html = '';

    // ── قسم الربط التلقائي: الحفر ⇄ الترحيل ⇄ التوريد ⇄ المعدات واللوجستيات ──
    if (auto.linked.length) {
      const eq = auto.equipment || {};
      const lg = auto.logistics || {};
      const statChip = (label, val, unit, col) => `
        <div style="background:var(--bg-surface);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:11px;">
          <span style="color:var(--text-muted);">${label}:</span>
          <b style="color:${col};font-size:12.5px;font-weight:900;">${fmtNum(val)} ${unit}</b>
        </div>`;
      html += `
        <div style="background:rgba(0,102,204,0.05);border:1px dashed rgba(0,102,204,0.3);border-radius:var(--r-md);padding:16px;margin:16px;position:relative;overflow:hidden;">
          <div style="position:absolute;inset:0;background:radial-gradient(ellipse at 90% 10%,rgba(0,102,204,0.10),transparent 45%);pointer-events:none;"></div>
          <div style="display:flex;align-items:center;justify-content:space-between;font-weight:900;color:var(--accent-blue);margin-bottom:10px;font-size:13.5px;border-bottom:1px solid rgba(0,102,204,0.15);padding-bottom:8px;gap:8px;flex-wrap:wrap;">
            <span style="display:flex;align-items:center;gap:8px;"><span>🔗</span><span>${ar ? 'الربط التلقائي — الحفر ⇄ الترحيل ⇄ التوريد ⇄ المعدات واللوجستيات' : 'Auto-Link — Excavation ⇄ Disposal ⇄ Supply ⇄ Equipment & Logistics'}</span></span>
            <button class="btn btn-primary btn-sm" style="font-size:11px;padding:4px 12px;" onclick="App._autoAddLinked()">➕ ${ar?'أضف الكل':'Add all'}</button>
          </div>
          <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;">
            ${statChip(ar?'حجم الحفر':'Excavation', auto.excav, 'م³', 'var(--accent-blue)')}
            ${statChip(ar?'مخلفات الترحيل':'Waste', lg.waste||0, 'م³', 'var(--accent-red)')}
            ${statChip(ar?'مساحة الإغلاق':'Closure area', auto.area, 'م²', 'var(--sec-gold)')}
            ${statChip(ar?'قلابات':'Trucks', lg.trucks||0, ar?'قلابة':'tr', 'var(--accent-gold)')}
            ${statChip(ar?'حفار (تقديري)':'Excavator (est.)', eq.excavatorH||0, 'س', 'var(--accent-blue)')}
            ${statChip(ar?'أسفلت (تقديري)':'Asphalt (est.)', lg.asphaltTons||0, 'طن', 'var(--accent-gold)')}
          </div>
          <div style="display:flex;flex-direction:column;gap:8px;">
      `;
      auto.linked.forEach(x => {
        const has = exists(x.code);
        html += `
          <div style="display:flex;align-items:center;justify-content:space-between;background:var(--bg-card);border:1px solid var(--border);border-right:3px solid ${has ? 'var(--sec-primary)' : 'var(--accent-blue)'};border-radius:var(--r-md);padding:8px 12px;gap:10px;">
            <div style="flex:1;min-width:0;text-align:right;font-size:12px;">
              <span class="uom-tag" style="font-family:var(--font-mono);font-size:10px;background:rgba(255,255,255,0.05);color:var(--text-code);padding:1px 5px;border-radius:3px;">${x.code}</span>
              <strong style="color:var(--text-h);"> ${x.name}</strong>
              <div style="font-size:10.5px;color:var(--text-muted);margin-top:2px;">${x.reason}</div>
            </div>
            <div style="display:flex;align-items:center;gap:10px;flex-shrink:0;">
              <span class="uom-tag" style="font-size:11px;">${x.uom}</span>
              <span style="font-size:13px;font-weight:900;color:var(--sec-primary);">${fmtNum(x.qty)}</span>
              ${has
                ? `<span style="font-size:10px;color:var(--sec-primary);font-weight:800;">✓ ${ar?'مضاف':'added'}</span>`
                : `<button class="btn btn-primary btn-sm" style="font-size:11px;padding:4px 10px;" onclick="App._autoAddLinked('${x.code}')">➕ ${ar?'أضف':'Add'}</button>`}
            </div>
          </div>`;
      });
      html += `
          </div>
          <div style="font-size:10.5px;color:var(--text-muted);margin-top:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;">
            ${ar ? 'معدات تقديرية:' : 'Est. equipment:'}
            <span class="chip">حفار ${fmtNum(eq.excavatorH||0)} س</span>
            <span class="chip">قلابات ${fmtNum(eq.dumpH||0)} س</span>
            <span class="chip">هراس ${fmtNum(eq.rollerH||0)} س</span>
            <span class="chip">مكبس ${fmtNum(eq.compactorH||0)} س</span>
            <span class="chip">ناقلة مياه ${eq.waterTrips||0} ${ar?'رحلة':'trips'}</span>
            <span class="chip">سفتي ${lg.barriers||0} حبة</span>
          </div>
      `;
      const mats = auto.materials;
      if (mats) {
        const matRow = (label, m, col) => {
          const p = (typeof getItemByCode === 'function') ? getItemByCode(String(m.code || '')) : null;
          return `<div style="display:flex;align-items:center;justify-content:space-between;background:var(--bg-card);border:1px solid var(--border);border-right:3px solid ${col};border-radius:var(--r-md);padding:6px 10px;font-size:11px;gap:8px;">
            <span style="color:var(--text-muted);flex:1;">${label}</span>
            <span style="font-weight:900;color:${col};font-size:12px;">${fmtNum(m.qty)} ${m.unit}</span>
          </div>`;
        };
        html += `
          <div style="margin-top:12px;padding-top:10px;border-top:1px dashed rgba(0,102,204,0.15);">
            <div style="font-size:11px;font-weight:800;color:var(--accent-blue);margin-bottom:8px;">📦 ${ar?'تفصيل المواد والكميات (تقديري)':'Materials & Quantities Breakdown (est.)'}</div>
            <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px;">
              ${matRow(ar?'رمل دفان (10سم فراش + 30سم تغطية)':'Sand bedding (10cm) + cover (30cm)', mats.sand, 'var(--accent-blue)')}
              ${matRow(ar?'خرسانة حماية الكابلات':'Concrete cable protection', mats.concrete, 'var(--accent-blue)')}
              ${matRow(ar?'أسفلت ('+fmtNum(mats.asphalt.qty)+' طن)':'Asphalt ('+fmtNum(mats.asphalt.qty)+' tons)', mats.asphalt, 'var(--sec-gold)')}
              ${matRow(ar?'طلاء أولي RC-70':'Prime coat RC-70', mats.primeCoat, 'var(--accent-gold)')}
              ${matRow(ar?'طلاء لاصق RC-2':'Tack coat RC-2', mats.tackCoat, 'var(--accent-gold)')}
              ${matRow(ar?'طبقة أساس فرعية 20سم':'Subbase 20cm', mats.subbase, 'var(--accent-blue)')}
              ${matRow(ar?'طبقة أساس طريق 15سم':'Road base 15cm', mats.roadBase, 'var(--accent-blue)')}
              ${matRow(ar?'مياه تكستيف':'Compaction water', mats.water, 'var(--accent-blue)')}
              ${matRow(ar?'احتيام بلاطة خاملة 10%':'Inactive pavement contingency 10%', mats.inactivePavement, 'var(--accent-red)')}
            </div>
            ${this.state.boq.isEmergency ? `<div style="font-size:10px;color:var(--text-sub);margin-top:6px;">${ar?'التصنيف طوارئ؛ تُستخدم أسعار البنود المرجعية دون زيادة عامة. أضف بند النسبة التعاقدي مستقلاً عند انطباقه.':'Emergency classification only; use each reference item rate without a blanket uplift. Add the contract percentage item separately when applicable.'}</div>` : ''}
          </div>
        `;
      }
      html += `
          <span style="opacity:.7;">${ar ? '— أبعاد تقديرية عرض 1م × عمق 1م؛ أدقّها من محرك الكميات ثم أعد الفحص' : '— est. at 1m×1m; refine in the Quantity Engine then re-audit'}</span>
        </div>`;
    }

    const hasDeps = depResults && (depResults.missing.length || depResults.warnings.length);
    if (!hasDeps) {
      if (!html) {
        html = `
          <div style="background:rgba(0,132,61,0.04);border:1px dashed var(--border-sec);border-radius:var(--r-md);padding:12px;margin:16px;text-align:center;color:var(--accent-green);font-size:12.5px;font-weight:700;">
            ✅ ${ar?'المقايسة متوازنة ومكتملة تماماً بموجب شروط ومواصفات العقد الموحد!':'BOQ workbook is completely balanced and technically compliant!'}
          </div>
        `;
      }
      c.innerHTML = html;
      return;
    }

    html += `
      <div style="background: rgba(200,168,75,0.03); border: 1px dashed rgba(200,168,75,0.28); border-radius: var(--r-md); padding: 16px; margin: 16px; position:relative; overflow:hidden;">
        <div style="position:absolute;inset:0;background:radial-gradient(ellipse at 5% 50%,rgba(200,168,75,0.08),transparent 45%);pointer-events:none;"></div>
        <div style="display:flex;align-items:center;gap:8px;font-weight:900;color:var(--accent-gold);margin-bottom:12px;font-size:13.5px;border-bottom:1px solid rgba(200,168,75,0.15);padding-bottom:8px;">
          <span>📌</span>
          <span>${ar ? 'بنود مكملة مفقودة للتذكير والتوازن الفني (Labor-Material Balance)' : 'Suggested Complementary Items (Labor-Material Balance)'}</span>
        </div>
        <div style="display:flex;flex-direction:column;gap:10px;">
    `;

    const allReminders = [...depResults.missing, ...depResults.warnings];
    const seenCodes = new Set();

    allReminders.forEach(m => {
      const codes = m.missingCodes || m.suggestedCodes || [];
      codes.forEach(c => {
        if (seenCodes.has(c)) return;
        seenCodes.add(c);
        const p = getItemByCode(c);
        if (!p) return;

        html += `
          <div style="display:flex;align-items:center;justify-content:space-between;background:var(--bg-card);border:1px solid var(--border);border-right:3px solid ${m.risk === 'critical' ? 'var(--accent-red)' : 'var(--accent-gold)'};border-radius:var(--r-md);padding:10px 14px;gap:12px;">
            <div style="text-align:right;flex:1;min-width:0;font-size:12.5px;">

  /* ═══════════ Trench Interactive Calculator ═══════════ */
  _trenchState: { length: 0, width: 1, depth: 1, surfaceType: 'dirt' },

  _setTrenchSurf(type, btn) {
    this._trenchState.surfaceType = type;
    document.querySelectorAll('.trench-surf-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    this._onTrenchInput();
  },

  _onTrenchInput() {
    const L = parseFloat(document.getElementById('trenchLen')?.value) || 0;
    const W = parseFloat(document.getElementById('trenchWid')?.value) || 1;
    const D = parseFloat(document.getElementById('trenchDep')?.value) || 1;
    this._trenchState = { length: L, width: W, depth: D, surfaceType: this._trenchState.surfaceType };
    const vol = L * W * D;
    const volEl = document.getElementById('trenchVol');
    if (volEl) volEl.textContent = vol.toFixed(2);
    const bar = document.getElementById('trench-result-bar');
    if (!bar) return;
    if (L <= 0) { bar.style.display = 'none'; return; }
    bar.style.display = 'block';
    const auto = autoLinkItems(null, { length: L, width: W, depth: D, surfaceType: this._trenchState.surfaceType });
    const ar = this.lang === 'ar';
    const fmt = n => (Math.round(n * 100) / 100).toLocaleString('en', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
    const surfName = { dirt: ar ? 'ترابي' : 'Dirt', asphalt: ar ? 'أسفلت' : 'Asphalt', tiles: ar ? 'بلاط' : 'Tiles', interlock: ar ? 'إنترلوك' : 'Interlock' }[this._trenchState.surfaceType] || '';
    let h = `<span style="font-weight:800;">${ar ? '⚡ النتائج الفورية' : '⚡ Live Results'}</span> · `;
    h += `<span style="color:var(--text-sub);">${ar ? 'نوع السطح' : 'Surface'}: <b style="color:#92400e;">${surfName}</b></span> · `;
    h += `<span>${ar ? 'الحفر' : 'Excav'}: <b>${fmt(auto.excav)} م³</b></span> · `;
    h += `<span>${ar ? 'المخلفات' : 'Waste'}: <b>${fmt(auto.logistics.waste)} م³</b></span> · `;
    h += `<span>${ar ? 'القلابات' : 'Trucks'}: <b>${auto.logistics.trucks}</b></span> · `;
    if (auto.logistics.asphaltTons > 0) h += `<span>${ar ? 'الأسفلت' : 'Asphalt'}: <b>${fmt(auto.logistics.asphaltTons)} طن</b></span> · `;
    h += `<span>${ar ? 'الرمل' : 'Sand'}: <b>${fmt(auto.logistics.sand)} م³</b></span> · `;
    h += `<span>${ar ? 'الخرسانة' : 'Concrete'}: <b>${fmt(auto.logistics.concrete)} م³</b></span>`;
    bar.innerHTML = h;
  },

  _resetTrenchCalc() {
    const el = id => document.getElementById(id);
    if (el('trenchLen')) el('trenchLen').value = 0;
    if (el('trenchWid')) el('trenchWid').value = 1;
    if (el('trenchDep')) el('trenchDep').value = 1;
    if (el('trenchVol')) el('trenchVol').textContent = '0';
    this._trenchState = { length: 0, width: 1, depth: 1, surfaceType: 'dirt' };
    document.querySelectorAll('.trench-surf-btn').forEach(b => b.classList.remove('active'));
    const first = document.querySelector('.trench-surf-btn[data-surf="dirt"]');
    if (first) first.classList.add('active');
    const bar = document.getElementById('trench-result-bar');
    if (bar) bar.style.display = 'none';
  },

  // إضافة بنود الربط التلقائي للمقايسة (بند واحد بالرمز أو كل البنود المحسوبة)
  _autoAddLinked(code) {
    const ar = this.lang === 'ar';
    if (code) {
      if (this.state.boq.items.some(x => String(x.code) === String(code))) { toast(ar ? 'البند مضاف بالفعل' : 'Item already added', 'info'); return; }
      const p = getItemByCode(code);
      if (!p) return;
      this.state.boq.items.push({ code, qty: 1, customPrice: null, note: '🔗 ربط تلقائي' });
      toast(ar ? 'تمت إضافة بند الربط التلقائي' : 'Auto-link item added', 'success');
      this._renderBOQTable();
      this.runDepsCheck();
      return;
    }
    if (typeof autoLinkItems !== 'function') return;
    const t = this._trenchState;
    const auto = autoLinkItems(this.state.boq.items, {
      length: t.length > 0 ? t.length : undefined,
      width: t.width, depth: t.depth, surfaceType: t.surfaceType
    });
    let n = 0;
    auto.linked.forEach(x => {
      if (this.state.boq.items.some(it => String(it.code) === String(x.code))) return;
      this.state.boq.items.push({ code: x.code, qty: x.qty, customPrice: null, note: '🔗 ربط تلقائي — ' + x.reason });
      n++;
    });
    this._mergeBOQDuplicates();
    this._renderBOQTable();
    this.runDepsCheck();
    toast(ar ? `تمت إضافة ${n} بند تلقائياً` : `Auto-linked ${n} items`, n ? 'success' : 'info');
  },

  _saveMeta() {
    const m = this.state.boq.meta;
    m.wo = document.getElementById('meta-wo')?.value || m.wo;
    m.project = document.getElementById('meta-project')?.value || m.project;
    m.location = document.getElementById('meta-location')?.value || m.location;
    m.date = document.getElementById('meta-date')?.value || m.date;
  },

  _renderBOQTable() {
    const tbody = document.getElementById('boq-tbody');
    const totals = document.getElementById('boq-totals');
    const count = document.getElementById('boq-count');
    if (!tbody) return;
    const items = this.state.boq.items;
    const ar = this.lang === 'ar';
    const isEmerg = !!this.state.boq.isEmergency;

    if (count) count.textContent = `${items.length} ${ar?'بند':'items'}`;
    if (!items.length) {
      tbody.innerHTML = `<div class="empty-state" style="padding:40px 20px;">
        <div class="empty-icon">📋</div>
        <h3>${ar?'لا توجد بنود بعد':'No items yet'}</h3>
        <p>${ar?'ابدأ بإضافة بند من مربع البحث أعلاه':'Add items from the search box above'}</p>
      </div>`;
      if (totals) totals.style.display = 'none';
      return;
    }
    if (totals) totals.style.display = 'block';

    let html = `<div class="tbl-wrap"><table class="data-table"><thead><tr>
      <th>#</th><th>${ar?'الرمز':'Code'}</th><th>${ar?'الوصف':'Description'}</th>
      <th>${ar?'وحدة':'UOM'}</th><th>${ar?'الكمية':'Qty'}</th>
      <th>${ar?'الإجمالي المستهدف':'Target Total'}</th>
      <th>${ar ? 'سعر البند المرجعي' : 'Reference Item Rate'}</th>
      <th>${ar?'الإجمالي':'Total'}</th><th>${ar?'ملاحظة':'Note'}</th><th></th>
    </tr></thead><tbody>`;

    let n=1; let lastSec=''; let secSum=0;
    const secName=p=>p?p.section:(ar?'🔧 معدات وبنود أخرى':'🔧 Equipment & other items');
    const secSub=()=>{ if(lastSec&&secSum>0){ html+=`<tr><td colspan="10" style="text-align:left;padding:6px 12px;font-size:11px;font-weight:800;color:var(--sec-gold);background:rgba(200,168,75,0.05);">${ar?'إجمالي القسم':'Section subtotal'} «${esc(lastSec)}»: <span class="td-price">${fmtNum(secSum)} ${ar?'ر.س':'SAR'}</span></td></tr>`; } };
    items.forEach((itm,idx)=>{
      const p = getItemByCode(itm.code);
      const up = this.boqUnitPrice(itm, isEmerg);
      const tot = up * itm.qty;
      const sn=secName(p);
      if(sn!==lastSec){
        secSub();
        lastSec=sn;
        secSum=0;
        html+=`<tr><td colspan="10" class="td-section">📁 ${esc(sn)}</td></tr>`;
      }
      secSum+=tot;
      html+=`<tr>
        <td style="color:var(--text-muted);font-size:11px;">${n++}</td>
        <td class="td-code">${esc(itm.code)}</td>
        <td class="td-desc"><div class="td-desc-ar">${esc(p?.arDesc||'—')}</div><div class="td-desc-en">${esc(p?.enDesc||'')}</div></td>
        <td><span class="uom-tag">${p?.uom||''}</span></td>
        <td><input class="qty-cell-input" type="number" id="boq-qty-${idx}" value="${itm.qty}" min="0.01" step="0.01" oninput="App.updateBOQQty(${idx},this.value)"></td>
        <td><input class="qty-cell-input target-cell-input" type="number" id="boq-target-${idx}" value="${tot}" min="0" step="0.01" oninput="App.updateBOQTargetTotal(${idx},this.value)" style="width:104px;"></td>
        <td class="td-price">${fmtNum(up)}</td>
        <td class="td-total" id="boq-tot-${idx}">${fmtNum(tot)}</td>
        <td><input class="form-control" style="width:110px;font-size:11px;padding:4px 8px;" value="${esc(itm.note||'')}" placeholder="${ar?'ملاحظة':'Note'}" onchange="App.state.boq.items[${idx}].note=this.value"></td>
        <td><button class="btn btn-danger btn-sm btn-icon" onclick="App.removeBOQItem(${idx})">✕</button></td>
      </tr>`;
    });
    secSub();
    tbody.innerHTML = html;
    const depResults = checkDependencies(items);
    this._renderBOQReminders(depResults);
    this._updateTotals();
  },

  updateBOQQty(idx,v) {
    const itm = this.state.boq.items[idx];
    if (!itm) return;
    const qty = parseFloat(v) || 0;
    itm.qty = Math.max(qty, 0);
    this._refreshBOQRow(idx);
    this._updateTotals();
  },

  // Target-total driven price: user types a total, customPrice = total / qty (qty stays unchanged)
  updateBOQTargetTotal(idx,v) {
    const itm = this.state.boq.items[idx];
    if (!itm) return;
    const target = parseFloat(v) || 0;
    const qty = parseFloat(itm.qty) || 0;
    if (qty > 0 && target > 0) {
      const base = (typeof getItemByCode === 'function') ? getItemByCode(itm.code) : null;
      const basePrice = base ? base.newPrice : 0;
      const rawPrice = target / qty;
      itm.customPrice = Math.round(rawPrice * 100) / 100;
    } else if (target === 0) {
      itm.customPrice = null;
    }
    this._refreshBOQRow(idx);
    this._updateTotals();
  },

  _refreshBOQRow(idx) {
    const itm = this.state.boq.items[idx];
    if (!itm) return;
    const up = this.boqUnitPrice(itm);
    const tot = up * itm.qty;
    const qtyEl = document.getElementById(`boq-qty-${idx}`);
    if (qtyEl) qtyEl.value = itm.qty;
    const totEl = document.getElementById(`boq-tot-${idx}`);
    if (totEl) totEl.textContent = fmtNum(tot);
    // avoid feedback loop: only sync target field when it isn't the active element
    const targetEl = document.getElementById(`boq-target-${idx}`);
    if (targetEl && document.activeElement !== targetEl) targetEl.value = String(tot);
  },

  removeBOQItem(idx) {
    const ar = this.lang === 'ar';
    const item = this.state.boq.items[idx];
    if (!item) return;
    const code = String(item.code || '');
    const linkedNote = '🔗 ربط تلقائي';
    const hasLinked = this.state.boq.items.some((x, i) => i !== idx && x.note && x.note.includes(linkedNote));
    if (hasLinked) {
      if (confirm(ar ? 'هذا البند له بنود مرتبطة تلقائياً. حذفه سيحذف البنود المرتبطة أيضاً.\nهل تريد المتابعة؟' : 'This item has auto-linked items. Deleting it will remove linked items too.\nProceed?')) {
        this.state.boq.items = this.state.boq.items.filter((x, i) => i === idx || !(x.note && x.note.includes(linkedNote)));
      } else {
        this.state.boq.items.splice(idx, 1);
      }
    } else {
      this.state.boq.items.splice(idx, 1);
    }
    this._mergeBOQDuplicates();
    this._renderBOQTable();
  },
  clearBOQ() { if(!confirm(this.lang==='ar'?'مسح جميع البنود؟':'Clear all items?'))return; this.state.boq.items=[]; this._renderBOQTable(); },

  _checkSessionRestore() {
    const banner = document.getElementById('boq-session-restore-banner');
    if (banner) banner.style.display = 'none';
  },

  _restoreBOQSession() {
    const banner = document.getElementById('boq-session-restore-banner');
    if (banner) banner.style.display = 'none';
  },

  _dismissSessionRestore() {
    const banner = document.getElementById('boq-session-restore-banner');
    if (banner) banner.style.display = 'none';
  },

  // ── Comprehensive Pricing Engine (الوحدة 4: نسب/أعباء/تقريب) ──
  _boqPricing() {
    const p=(this.state.boq.meta&&this.state.boq.meta.pricing)||{};
    return { overhead: p.overhead??5, profit: p.profit??10, contingency: p.contingency??3, vat: p.vat??15, round: p.round??true };
  },

  _boqTotals(items) {
    const pr=this._boqPricing();
    const works=(items||[]).reduce((s,i)=>{
      const up=this.boqUnitPrice(i);
      return s+Math.round(up*i.qty);
    },0);
    const overhead=Math.round(works*pr.overhead/100);
    const profit=Math.round((works+overhead)*pr.profit/100);
    const contingency=Math.round((works+overhead+profit)*pr.contingency/100);
    const preVAT=works+overhead+profit+contingency;
    const vat=Math.round(preVAT*pr.vat/100);
    const grand=pr.round?Math.round(preVAT+vat):preVAT+vat;
    return { works, overhead, profit, contingency, preVAT, vat, grand, round:!!pr.round, vatPct:pr.vat };
  },

  _updateTotals() {
    const t=this._boqTotals(this.state.boq.items);
    const ar=this.lang==='ar';
    const sar=ar?' ر.س':' SAR';
    const e=id=>document.getElementById(id);
    if(e('t-sub')) e('t-sub').textContent=fmtNum(t.works)+sar;
    if(e('t-over')) e('t-over').textContent=fmtNum(t.overhead)+sar;
    if(e('t-profit')) e('t-profit').textContent=fmtNum(t.profit)+sar;
    if(e('t-cont')) e('t-cont').textContent=fmtNum(t.contingency)+sar;
    if(e('t-vat')){
      e('t-vat').textContent=fmtNum(t.vat)+sar;
      const tl=e('t-vat').querySelector('.tl');
      if(tl) tl.textContent=(ar?'ضريبة القيمة المضافة ('+t.vatPct+'%)':'VAT ('+t.vatPct+'%)');
    }
    if(e('t-grand')) e('t-grand').textContent=fmtNum(t.grand)+(t.round?'':(ar?' (غير مُقرّب)':' (unrounded)'))+sar;
  },

  _renderPricingPanel() {
    const box=document.getElementById('boq-pricing');
    if(!box) return;
    const ar=this.lang==='ar';
    const pr=this._boqPricing();
    const f=(label,key,suffix)=>`<label style="display:flex;flex-direction:column;gap:3px;font-size:10px;font-weight:700;color:var(--text-sub);">${esc(label)}<input data-pricing="${key}" type="number" min="0" step="0.5" value="${pr[key]}" style="padding:6px 8px;border:1px solid var(--border);border-radius:8px;background:var(--bg-surface);color:var(--text-h);font-size:12px;">${suffix}</label>`;
    box.innerHTML =
      `<div style="grid-column:1/-1;font-size:11px;font-weight:800;color:var(--accent-gold);margin-bottom:2px;">⚖️ ${ar?'إعدادات التسعير (نسب مئوية)':'Pricing Settings (%)'}</div>`
      + f(ar?'أعباء عامة':'Overheads %','overhead','%')
      + f(ar?'هامش ربح':'Profit %','profit','%')
      + f(ar?'طوارئ':'Contingency %','contingency','%')
      + f(ar?'ضريبة':'VAT %','vat','%')
      + `<label style="display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--text-sub);font-weight:700;">${ar?'التقريب إلى الريال':'Round to SAR'}<input id="pricing-round" type="checkbox" ${pr.round?'checked':''}></label>`
      + `<label style="display:flex;align-items:center;"><button class="btn btn-gold btn-sm" onclick="App._boqPricingChanged()">${ar?'تطبيق':'Apply'}</button></label>`;
    box.querySelectorAll('input[data-pricing]').forEach(inp=>{
      inp.addEventListener('change',()=>App._boqPricingChanged());
    });
    const rb=box.querySelector('#pricing-round');
    if(rb) rb.addEventListener('change',()=>App._boqPricingChanged());
  },

  _boqPricingChanged() {
    const box=document.getElementById('boq-pricing');
    if(!box) return;
    const pr=this._boqPricing();
    box.querySelectorAll('input[data-pricing]').forEach(inp=>{
      const k=inp.getAttribute('data-pricing');
      const v=parseFloat(inp.value);
      if(isFinite(v)&&v>=0) pr[k]=v;
    });
    const rb=box.querySelector('#pricing-round');
    pr.round=rb?rb.checked:true;
    if(!this.state.boq.meta) this.state.boq.meta={};
    this.state.boq.meta.pricing=pr;
    this._updateTotals();
    toast(this.lang==='ar'?'حُفظت إعدادات التسعير':'Pricing settings saved','success');
  },

  saveBOQ() {
    this._saveMeta();
    if(!this.state.boq.items.length){ toast(this.lang==='ar'?'أضف بنوداً أولاً':'Add items first','warning'); return; }
    const ar=this.lang==='ar';
    if(this.state.boq.status==='approved'){
      if(confirm(ar?`المقايسة معتمدة برقم ${this.state.boq.refNo}. هل تريد إنشاء نسخة مسودة جديدة للتعديل؟`:`This BOQ is approved (${this.state.boq.refNo}). Create a new draft copy to edit?`)){
        const id=this.saveBOQAsCopy();
        if(id) this.loadBOQ(id);
      }
      return;
    }
    this.saveBOQToStore();
    toast(ar?'تم حفظ المقايسة ✅':'BOQ saved ✅','success');
  },

  saveBOQAsCopy() {
    this._saveMeta();
    if(!this.state.boq.items.length){ toast(this.lang==='ar'?'أضف بنوداً أولاً':'Add items first','warning'); return; }
    const copy = { ...this.state.boq, id: 'boq_' + Date.now(), savedAt: new Date().toISOString(), status: 'draft', draftNo: null, refNo: null, approvedAt: null, approvedBy: null, rejectedAt: null, archivedAt: null, workflowLog: [], meta: { ...this.state.boq.meta }, items: this.state.boq.items.map(i => ({ ...i })) };
    this.state.savedBOQs.unshift(copy);
    Store.setKey('boqs', this.state.savedBOQs);
    this._lastBoqId = copy.id;
    toast(this.lang==='ar'?'تم حفظ نسخة جديدة ✅':'Copy saved ✅','success');
    return copy.id;
  },

  // ── BOQ Approval Workflow & Official Number (اعتماد المقايسة + الرقم الرسمي + QR) ──
  _boqStatusMeta(s) {
    const m={
      draft:{ar:'مسودة',en:'Draft',col:'var(--text-muted)',bg:'rgba(148,163,184,0.12)',border:'rgba(148,163,184,0.25)',ic:'📝'},
      under_review:{ar:'قيد المراجعة',en:'Under Review',col:'var(--sec-gold)',bg:'rgba(200,168,75,0.1)',border:'rgba(200,168,75,0.28)',ic:'🔍'},
      technical_review:{ar:'مراجعة فنية',en:'Technical Review',col:'var(--se-blue)',bg:'rgba(0,102,204,0.1)',border:'rgba(0,102,204,0.25)',ic:'🛠️'},
      financial_review:{ar:'مراجعة مالية',en:'Financial Review',col:'#8B5CF6',bg:'rgba(139,92,246,0.1)',border:'rgba(139,92,246,0.28)',ic:'💰'},
      approved:{ar:'معتمدة',en:'Approved',col:'var(--accent-green)',bg:'rgba(0,214,138,0.1)',border:'rgba(0,214,138,0.28)',ic:'✅'},
      rejected:{ar:'مرفوضة',en:'Rejected',col:'var(--accent-red)',bg:'rgba(220,38,38,0.08)',border:'rgba(220,38,38,0.22)',ic:'⛔'},

    };

  _boqStatusBadge(s, small) {
    const m=this._boqStatusMeta(s);
    const ar=this.lang==='ar';
    return `<span class="badge" title="${m.ar} / ${m.en}" style="font-size:${small?'8.5px':'10px'};background:${m.bg};color:${m.col};border-color:${m.border};">${m.ic} ${ar?m.ar:m.en}</span>`;

  _nextBOQNo(prefix) {
    let seq=parseInt(localStorage.getItem('boq_seq_v1')||'0',10)+1;
    localStorage.setItem('boq_seq_v1',String(seq));
    return `${prefix}-${new Date().getFullYear()}-${String(seq).padStart(6,'0')}`;
  },

  _boqWFSteps(boq) {
    const ar=this.lang==='ar';
    const steps=['draft','under_review','technical_review','financial_review','approved'];
    const cur=steps.indexOf(boq.status||'draft');
    if(cur<0) return `<div style="font-size:10px;color:var(--text-sub);">${this._boqStatusBadge(boq.status||'draft')}</div>`;
    return steps.map((s,i)=>{
      const m=this._boqStatusMeta(s);
      const active=i<=cur;

  setBOQStatus(status, by) {
    const ar=this.lang==='ar';
    const boq=this.state.boq;
    if(!boq) return;
    if(status==='approved'&&!boq.items.length){ toast(ar?'لا يمكن اعتماد مقايسة بدون بنود':'Cannot approve a BOQ with no items','warning'); return; }
    boq.workflowLog=boq.workflowLog||[];
    boq.workflowLog.push({status, at:new Date().toISOString(), by:by||(ar?'محلي':'Local')});
    boq.status=status;
    if(status==='approved'){
      if(!boq.refNo) boq.refNo=this._nextBOQNo('M');
      boq.approvedAt=new Date().toISOString();
      boq.approvedBy=by||(ar?'محلي':'Local');
    }
    if(status==='rejected') boq.rejectedAt=new Date().toISOString();
    if(status==='archived') boq.archivedAt=new Date().toISOString();
    this.saveBOQToStore();
    toast(ar?'تم تحديث الحالة: '+(this._boqStatusMeta(status).ar):'Status updated: '+(this._boqStatusMeta(status).en),'success');
    this.renderBOQ(this.getArea());
  },

  _renderQR(text, el) {
    if(!el) return;
    const ar=this.lang==='ar';
    if(typeof QRCode==='function'){
      try{ el.innerHTML=''; new QRCode(el,{text,width:176,height:176,correctLevel:QRCode.CorrectLevel.M}); return; }catch(e){}
    }
    if(!this._qrLoading){
      this._qrLoading=true;
      const s=document.createElement('script');
      s.src='https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js';
      s.onload=()=>{ this._qrLoading=false; this._renderQR(text,el); };
      s.onerror=()=>{ this._qrLoading=false; el.innerHTML=`<div style="padding:12px;font-size:10.5px;color:var(--text-muted);border:1px dashed var(--border);border-radius:10px;text-align:center;">${ar?'تعذر تحميل مولّد QR (يلزم اتصال) —':'QR generator unavailable offline —'}<br><b style="font-family:var(--font-mono);">${text}</b></div>`; };
      document.head.appendChild(s);
    } else {
      setTimeout(()=>this._renderQR(text,el),400);
    }
  },

  _dropSavedBOQ(e, el) {
    e.preventDefault();
    if (el) el.style.outline = '';
    const hint = document.getElementById('boq-drop-hint');
    if (hint) hint.style.display = 'none';
    const id = e.dataTransfer && (e.dataTransfer.getData('text/plain') || e.dataTransfer.getData('text/boqid'));
    if (!id) { toast(this.lang==='ar'?'لم يتم التعرف على المقايسة':'BOQ not recognized','error'); return; }
    const boq = this.state.savedBOQs.find(b => b.id === id);
    if (!boq) { toast(this.lang==='ar'?'المقايسة غير موجودة':'BOQ not found','error'); return; }
    const ar = this.lang==='ar';
    const action = confirm(ar ? 'تحميل هذه المقايسة محل البنود الحالية؟ (موافق = استبدال، إلغاء = إضافة البنود)'
                              : 'Load this BOQ? (OK = replace, Cancel = merge items)');
    if (action) {
      this.state.boq = JSON.parse(JSON.stringify(boq));
    } else {
      const existing = this.state.boq.items;
      const newItems = (boq.items || []).filter(ni => !existing.some(x => x.code === ni.code));
      this.state.boq.items = existing.concat(newItems);
    }
    this._renderBOQTable();
    this.runDepsCheck();
    toast(ar ? `تم تحميل المقايسة: ${boq.meta.project || boq.meta.wo || '—'} ✅` : `BOQ loaded: ${boq.meta.project || boq.meta.wo || '—'} ✅`, 'success');
  },

  exportBOQ(type) {
    this._saveMeta();
    if(!this.state.boq.items.length){ toast(this.lang==='ar'?'لا توجد بنود':'No items to export','warning'); return; }
    
    const mappedItems = this.state.boq.items.map(item => {
      const p = getItemByCode(item.code);
      const basePrice = item.customPrice ?? p?.newPrice ?? 0;
      return {
        ...item,
        contractPrice: Math.round(basePrice),
        priceItem: p
      };
    });

    const boqData = {
      ...this.state.boq,
      items: mappedItems
    };

    if(type==='excel') exportToExcel(boqData, this.state.boq.meta);
    else if(type==='pdf') exportToPDF(boqData, this.state.boq.meta);
    else if(type==='json') exportToJSON(boqData, this.state.boq.meta);
    else if(type==='xml') exportToXML(boqData, this.state.boq.meta);
    else if(type==='sheet') exportMeasurementSheet(boqData, this.state.boq.meta);
    else if(type==='csv') exportToCSV(boqData, this.state.boq.meta);
    else if(type==='odoo') {
      if (typeof ERPIntegration !== 'undefined') {
        ERPIntegration.exportToOdoo(this.state.boq.meta.project || 'Odoo_BOQ', mappedItems);
        toast(this.lang==='ar'?'تم تصدير ملف Odoo بنجاح!':'Odoo file exported successfully!');
      } else {
        toast('ERP module missing','error');
      }
    }
    else if(type==='sap') {
      if (typeof ERPIntegration !== 'undefined') {
        ERPIntegration.exportToSAP(this.state.boq.meta.project || 'SAP_BOQ', mappedItems);
        toast(this.lang==='ar'?'تم تصدير ملف SAP بنجاح!':'SAP file exported successfully!');
      } else {
        toast('ERP module missing','error');
      }
    }
  },

  // ── Dependency Checker ──
  runDepsCheck() {
    const items = this.state.boq.items;
    const ar = this.lang==='ar';
    if(!items.length){ toast(ar?'أضف بنوداً أولاً':'Add items first','warning'); return; }
    
    const res = checkDependencies(items);
    const panel = document.getElementById('deps-panel');
    if(!panel) return;

    const nm = res.missing.length;
    const nw = res.warnings.length;

    // Get productivity and budget balancer details
    let totalWorkDays = 0;
    let crewSummaryHtml = '';
    let equipSummaryHtml = '';
    let balanceHtml = '';

    if (window.ProductivityEngine) {
      const isEmerg = !!this.state.boq.isEmergency;
      const adjustedItems = items.map(itm => {
        return {
          ...itm,
          contractPrice: this.boqUnitPrice(itm, isEmerg)
        };
      });

      const est = window.ProductivityEngine.estimateBOQ(adjustedItems);
      totalWorkDays = est.totalDays || 0;

      const activeCrews = {};
      est.items.forEach(itm => {
        const c = itm.costDetails;
        if (!c) return;
        if (!activeCrews[c.crewCode]) {
          activeCrews[c.crewCode] = {
            code: c.crewCode,
            nameAr: c.crewNameAr,
            nameEn: c.crewNameEn,
            days: 0
          };
        }
        activeCrews[c.crewCode].days += c.requiredDays;
      });

      const crewLaborSpecs = {
        "CR-01": "مشرف طاقم مدني + سائق حفار + سائق لودر + 3 عمال حفر وتأمين مسار خندق",
        "CR-02": "مشرف سلامة فنية + سائق حفار صخري (جاك هامر) + 2 عمال يدويين لتكسير وتنظيف الجحور",
        "CR-03": "مهندس كابلات ميداني + فني تشغيل رافعة سحب الكابل + 8 عمال سحب وتوجيه كابلات الجهد المتوسط",

  quickAdd(code) {
    const item = getItemByCode(code);
    if(!item) return;
    const ar = this.lang === 'ar';
    const ex = this.state.boq.items.find(x => String(x.code) === String(code));
    if (ex) {
      ex.qty = (parseFloat(ex.qty) || 1) + 1;
      toast(ar ? `البند مضاف بالفعل — تمت زيادة الكمية إلى ${ex.qty}` : `Item exists — quantity increased to ${ex.qty}`, 'info');
    } else {
      this.state.boq.items.push({code, qty:1, customPrice:null, note:''});
      toast(`${ar?'تمت إضافة':'Added'}: ${item.arDesc.slice(0,28)}...`);
    }
    this._renderBOQTable();
    this.runDepsCheck();
  },

  addAnalyzedItems(list) {
    if (!Array.isArray(list) || !list.length) return;
    let added = 0;
    list.forEach(i => {
      if (!i || !getItemByCode(i.code)) return;
      const qty = parseFloat(i.qty) || 0;
      if (!(qty > 0)) return; // only add items with a real quantity from the file
      if (this.state.boq.items.some(x => x.code === i.code)) return;
      this.state.boq.items.push({ code: i.code, qty, customPrice: null, note: '' });
      added++;
    });
    this._renderBOQTable();
    this.runDepsCheck();
    toast(`${this.lang==='ar'?'تمت إضافة':'Added'} ${added} ${this.lang==='ar'?'بند من الملف':'items from file'}`, added ? 'success' : 'warning');
  },

  _parseImportRows(rows) {
    const items = [];
    const CODE_KEYS = ['الرمز', 'رمز', 'الكود', 'code', 'Code', 'CODE', 'item code', 'رقم البند', 'بند'];
    const QTY_KEYS = ['الكمية', 'كمية', 'qty', 'Qty', 'QTY', 'quantity', 'الكميه', 'العدد'];
    const PRICE_KEYS = ['السعر', 'سعر الوحدة', 'unit price', 'Unit Price', 'UNIT PRICE', 'السعر (ر.س)', 'unit price (sar)', 'price', 'Price', 'سعر'];
    const UOM_KEYS = ['الوحدة', 'وحدة', 'uom', 'UOM', 'unit', 'Unit'];

    const norm = v => String(v == null ? '' : v).trim().replace(/^\s*"|"\s*$/g, '').replace(/,/g, '');
    const findCol = (headers, keys) => {
      const idx = headers.findIndex(h => keys.includes(norm(h)));
      return idx >= 0 ? idx : -1;
    };

    let grid = (rows || []).map(r => Array.isArray(r) ? r : String(r).split(/[,;\t]/));
    grid = grid.filter(r => r && r.length && String(r[0] || '').trim());

    // Detect header row (first row that contains known column names)
    const hasHeader = grid.length > 0 && (
      findCol(grid[0], CODE_KEYS) >= 0 || findCol(grid[0], QTY_KEYS) >= 0 || findCol(grid[0], PRICE_KEYS) >= 0
    );

    let startRow = 0, ci = 0, qi = 1, pi = 2;
    if (hasHeader) {
      const head = grid[0];
      ci = findCol(head, CODE_KEYS);
      qi = findCol(head, QTY_KEYS);
      pi = findCol(head, PRICE_KEYS);
      if (ci < 0) ci = 0;
      if (qi < 0) qi = ci + 1;
      if (pi < 0) pi = -1; // price optional
      startRow = 1;
    }

    const meta = { wo: '', project: '', location: '', date: '' };
    for (let i = startRow; i < grid.length; i++) {
      const parts = grid[i];
      const code = norm(parts[ci]);
      if (!code) continue;
      const qtyRaw = String(parts[qi] == null ? '' : parts[qi]).replace(/[^0-9.]/g, '');
      const qty = parseFloat(qtyRaw);
      if (!isFinite(qty) || qty <= 0) continue; // only import rows with a real quantity
      const price = pi >= 0 && parts[pi] != null ? parseFloat(String(parts[pi]).replace(/[^0-9.]/g, '')) : NaN;
      // First 3 columns may hold WO / project / location when file starts with meta row
      if (parts.length >= 3 && !getItemByCode(code)) {
        if (i === startRow) {
          meta.wo = code; meta.project = norm(parts[1]); meta.location = norm(parts[2]);
          continue;
        }
        continue;
      }
      if (!getItemByCode(code)) continue;
      if (this.state.boq.items.some(x => x.code === code)) continue;
      items.push({ code, qty, customPrice: isFinite(price) && price > 0 ? price : null, note: '' });
    }
    return { items, meta };
  },

  importBOQFile(input) {
    const inp = input || document.getElementById('boq-file-input');
    if (!inp || !inp.files || !inp.files[0]) { toast(this.lang==='ar'?'اختر ملفاً أولاً':'Choose a file first', 'warning'); return; }
    const file = inp.files[0];
    const ar = this.lang === 'ar';
    const isXlsx = /\.(xlsx|xls)$/i.test(file.name);
    const isJson = /\.json$/i.test(file.name);
    const isXml = /\.xml$/i.test(file.name);

    const process = () => {
      const reader = new FileReader();
      reader.onload = () => {
        try {
          let items = [];
          let meta = {};

          if (isXlsx) {
            if (typeof XLSX === 'undefined') throw new Error(ar ? 'مكتبة Excel غير محمّلة' : 'Excel library not loaded');
            const wb = XLSX.read(reader.result, { type: 'array' });
            const ws = wb.Sheets[wb.SheetNames[0]];
            const data = XLSX.utils.sheet_to_json(ws, { header: 1 });
            const parsed = this._parseImportRows(data);
            items = parsed.items; meta = parsed.meta;
          } else if (isJson) {
            const obj = JSON.parse(String(reader.result || ''));
            const src = (obj && obj.boqs) ? obj.boqs[0] : obj;
            if (src && src.meta) meta = src.meta;
            const list = (src && src.items) ? src.items : (Array.isArray(src) ? src : []);
            list.forEach(it => {
              const code = String(it.code ?? it.Code ?? '').trim();
              if (!code || !getItemByCode(code)) return;
              if (this.state.boq.items.some(x => x.code === code)) return;
              const qty = parseFloat(it.qty ?? it.Qty ?? 1) || 1;
              const price = parseFloat(it.unitPrice ?? it.unit_price ?? it.price ?? it.customPrice ?? '');
              this.state.boq.items.push({ code, qty, customPrice: isFinite(price) && price > 0 ? price : null, note: '' });
            });
            items = list.filter(it => getItemByCode(String(it.code ?? it.Code ?? '').trim()));
          } else if (isXml) {
            const xml = String(reader.result || '');
            const doc = new DOMParser().parseFromString(xml, 'text/xml');
            const g = (t) => { const el = doc.querySelector(t); return el ? (el.textContent || '').trim() : ''; };
            meta = { wo: g('wo'), project: g('project'), location: g('location'), date: g('date') || this.state.boq.meta.date };
            Array.from(doc.querySelectorAll('item')).forEach(it => {
              const code = String(it.getAttribute('code') || '').trim();
              if (!code || !getItemByCode(code)) return;
              if (this.state.boq.items.some(x => x.code === code)) return;
              const qty = parseFloat(it.getAttribute('qty')) || 1;
              const price = parseFloat(it.getAttribute('unitPrice') || it.getAttribute('price') || '');
              this.state.boq.items.push({ code, qty, customPrice: isFinite(price) && price > 0 ? price : null, note: '' });
            });
            items = Array.from(doc.querySelectorAll('item'));
          } else {
            // CSV / TXT
            const text = String(reader.result || '');
            const rows = text.split(/\r?\n/).filter(l => l.trim());
            const parsed = this._parseImportRows(rows);
            items = parsed.items; meta = parsed.meta;
          }

          // Apply imported meta to the active BOQ
          ['wo', 'project', 'location', 'date'].forEach(k => { if (meta && meta[k]) this.state.boq.meta[k] = meta[k]; });
          this._saveMetaBack();

          this._renderBOQTable();
          this.runDepsCheck();
          if (typeof BOQImporter !== 'undefined' && items.length > 0) {
            BOQImporter.saveSession(this.state.boq.items, this.state.boq.meta);
          }
          toast(`${ar?'تم استيراد':'Imported'} ${items.length} ${ar?'بند':'items'}`, items.length ? 'success' : 'warning');
        } catch (err) {
          toast(ar ? 'فشل الاستيراد: ' + err.message : 'Import failed: ' + err.message, 'error');
        }
        inp.value = '';
      };
      if (isXlsx) reader.readAsArrayBuffer(file);
      else reader.readAsText(file, 'utf-8');
    };

    if (isXlsx && typeof XLSX === 'undefined') {
      toast(ar ? 'جارٍ تحميل مكتبة Excel...' : 'Loading Excel library...', 'success');
      _loadScript('https://cdn.jsdelivr.net/npm/xlsx@0.19.3/dist/xlsx.full.min.js')
        .then(process)
        .catch(err => toast(ar ? 'تعذّر تحميل مكتبة Excel' : 'Failed to load Excel library', 'error'));
    } else {
      process();
    }
  },

  _saveMetaBack() {
    ['meta-wo', 'meta-project', 'meta-location', 'meta-date'].forEach(id => {
      const el = document.getElementById(id);
      const key = id.replace('meta-', '');
      if (el && this.state.boq.meta[key]) el.value = this.state.boq.meta[key];

  // SEARCH
  // ────────────────────────────────────────────────
  renderSearch(c) {

    this._searchCat='all';
    this._searchType='all';
    c.innerHTML=`
      <div id="search-voice-card" class="mb-16"></div>

        <div class="search-wrap mb-12">
          <span class="search-icon">🔍</span>
          <input class="form-control search-input" id="main-search" style="font-size:15px;padding:13px 42px 13px 14px;" placeholder="${ar?'ابحث: رمز/وصف بند، مشروع/أمر عمل/حالة مقايسة، رقم مستخلص، أو عقد...':'Search: item code/desc, BOQ project/WO/status, cert no., or contract...'}">

          <span style="font-size:11px;color:var(--text-muted);font-weight:800;">${ar?'المصدر':'Source'}:</span>
          ${[['all','🔎 '+(ar?'الكل':'All')],['items','📦 '+(ar?'البنود':'Items')],['boqs','📋 '+(ar?'المقايسات':'BOQs')],['certs','🧾 '+(ar?'المستخلصات':'Certs')],['contracts','📄 '+(ar?'العقود':'Contracts')]].map(t=>`<button class="chip${t[0]==='all'?' active':''}" data-stype="${t[0]}" onclick="App._filterType('${t[0]}',this)">${t[1]}</button>`).join('')}

      </div></div>
      <div id="search-results"></div>
    `;
    VoiceAssistant.renderVoiceCard('search-voice-card', 'search');
    this._applySearch('');

  },

  _filterType(t,btn) {
    this._searchType=t;
    document.querySelectorAll('.chip[data-stype]').forEach(b=>b.classList.toggle('active',b.dataset.stype===t));
    this._applySearch(document.getElementById('main-search')?.value||'');
  },

  _filterCat(cat,btn) {
    this._searchCat=cat;
    document.querySelectorAll('.chip[data-cat]').forEach(b=>b.classList.toggle('active',b.dataset.cat===cat));
    this._applySearch(document.getElementById('main-search')?.value||'');
  },

  _applySearch(q) {
    const ar=this.lang==='ar';
    const res=this._smartSearch(q);
    const el=document.getElementById('search-count');
    const total=res.items.length+res.boqs.length+res.certs.length+res.contracts.length;
    if(el) el.textContent=`${total} ${ar?'نتيجة':'result(s)'} • ${res.items.length} ${ar?'بند':'items'} / ${res.boqs.length} ${ar?'مقايسة':'BOQs'} / ${res.certs.length} ${ar?'مستخلص':'certs'} / ${res.contracts.length} ${ar?'عقد':'contracts'}`;
    this._renderSmartResults(res);
  },

  _smartSearch(q) {
    const res={items:[],boqs:[],certs:[],contracts:[]};
    q=(q||'').trim().toLowerCase();
    const t=this._searchType||'all';
    if(t==='all'||t==='items') res.items=searchItems(q).slice(0,80);
    if(t==='all'||t==='boqs') res.boqs=this._smartSearchBOQs(q);
    if(t==='all'||t==='certs') res.certs=this._smartSearchCerts(q);
    if(t==='all'||t==='contracts') res.contracts=this._smartSearchContracts(q);
    return res;
  },

  _smartSearchBOQs(q) {
    const out=[];
    (this.state.savedBOQs||[]).forEach(b=>{
      const meta=b.meta||{};
      const itCodes=(b.items||[]).map(i=>String(i.code)).join(' ');
      const hay=[meta.wo,meta.project,meta.location,meta.date,b.status,b.draftNo,b.refNo,itCodes].join(' ').toLowerCase();
      const matched=!q||hay.includes(q)||(b.items||[]).some(i=>String(i.code).toLowerCase().includes(q));
      if(matched) out.push(b);
    });
    return out.slice(0,40);
  },

  _smartSearchCerts(q) {
    const out=[];
    try{
      const certs=JSON.parse(localStorage.getItem('boq_certificates')||'[]')||[];
      certs.forEach(c=>{
        const hay=[c.num,c.wo,c.boqId,c.date].join(' ').toLowerCase();
        if(!q||hay.includes(q)) out.push(c);
      });
    }catch(e){}
    return out.slice(0,40);
  },

  _smartSearchContracts(q) {
    const out=[];
    (this.state.contracts||[]).forEach(ct=>{
      const its=this._contractItems(ct);
      const itCodes=its.map(i=>String(i.code)).join(' ');
      const hay=[ct.title,ct.ref,ct.partner,ct.status,ct.notes,ct.date,itCodes].join(' ').toLowerCase();
      const matched=!q||hay.includes(q)||its.some(i=>String(i.code).toLowerCase().includes(q));
      if(matched) out.push(ct);
    });
    return out.slice(0,40);
  },

  _renderSmartResults(res) {
    const c=document.getElementById('search-results');
    if(!c) return;
    const ar=this.lang==='ar';
    const t=this._searchType||'all';
    let html='';
    if(res.boqs.length && (t==='all'||t==='boqs')) html+=this._renderBOQGroup(res.boqs);
    if(res.certs.length && (t==='all'||t==='certs')) html+=this._renderCertGroup(res.certs);
    if(res.contracts.length && (t==='all'||t==='contracts')) html+=this._renderContractGroup(res.contracts);
    if(res.items.length && (t==='all'||t==='items')) html+=this._renderItemGroup(res.items);
    if(!html) c.innerHTML=`<div class="empty-state"><div class="empty-icon">🔍</div><h3>${ar?'لا توجد نتائج':'No results'}</h3></div>`;
    else c.innerHTML=html;
  },

    return `
      <div class="card mb-16">
        <div class="card-head"><span>📋</span><span class="card-title">${ar?'المقايسات':'Saved BOQs'}</span><span style="font-size:11px;color:var(--text-muted);margin-${ar?'right':'left'}:auto;">${boqs.length}</span></div>
        <div class="tbl-wrap"><table class="data-table"><thead><tr>

          ${boqs.map((b,i)=>{

              <td style="color:var(--text-muted);font-size:11px;">${i+1}</td>

              <td>${this._boqStatusBadge(b.status||'draft',true)}<div style="font-size:10px;font-family:var(--font-mono);color:var(--text-muted);margin-top:2px;">${esc(b.refNo||b.draftNo||b.id||'')}</div><div style="font-size:10px;color:var(--text-muted);">${esc(meta.wo||'')}</div></td>

        <div class="tbl-wrap"><table class="data-table"><thead><tr>

  _renderItemGroup(items) {

  // ────────────────────────────────────────────────

  // ────────────────────────────────────────────────
  renderCompare(c) {
    const ar=this.lang==='ar';
    const savedOpts=this.state.savedBOQs.map(b=>`<option value="${b.id}">${b.meta.wo||b.id} — ${b.meta.project||''}</option>`).join('');
    c.innerHTML=`
      <div class="grid-2 mb-16">
        ${['A','B'].map(x=>`
          <div class="card">
            <div class="card-head"><span>${x==='A'?'🅰️':'🅱️'}</span><span class="card-title">${ar?`المقايسة (${x})`:x==='A'?'BOQ (A)':'BOQ (B)'}</span></div>
            <div class="card-body">
              <div class="form-group"><label class="form-label">${ar?'اختر محفوظة':'Select Saved'}</label>
                <select class="form-control" id="cmp-sel-${x}"><option value="">— ${ar?'اختر':'Select'} —</option>${savedOpts}</select>
              </div>

              <div class="form-group"><label class="form-label">CSV (${ar?'رمز,كمية,سعر':'code,qty,price'})</label>
                <textarea class="form-control" id="cmp-csv-${x}" rows="5" placeholder="304010101,100,9&#10;301010101,100" style="font-family:var(--font-mono);font-size:11px;"></textarea>
              </div>
              <div class="form-group"><label class="form-label">${ar?'اسم للعرض':'Label'}</label>
                <input class="form-control" id="cmp-lbl-${x}" value="${ar?`المقايسة ${x}`:x==='A'?'BOQ A':'BOQ B'}">
              </div>
            </div>
          </div>
        `).join('')}
      </div>
      <div style="text-align:center;margin-bottom:20px;">
        <button class="btn btn-primary btn-lg" onclick="App.runCompare()">⚖️ ${ar?'تشغيل المقارنة':'Run Comparison'}</button>
      </div>
      <div id="compare-result"></div>
    `;
  },

  _getCmpItems(selId,csvId) {
    const sid=document.getElementById(selId)?.value;
    if(sid){ const b=this.state.savedBOQs.find(x=>x.id===sid); if(b) return b.items.map(i=>{ const p=getItemByCode(i.code); return {code:i.code,qty:i.qty,price:i.customPrice||(p?p.newPrice:0)}; }); }
    const csv=document.getElementById(csvId)?.value||'';
    return csv.split('\n').filter(l=>l.trim()).map(line=>{ const [code,qty,price]=line.split(','); return {code:code?.trim(),qty:parseFloat(qty)||1,price:parseFloat(price)||0}; }).filter(i=>i.code&&getItemByCode(i.code));
  },

  runCompare() {
    const ar=this.lang==='ar';
    const itemsA=this._getCmpItems('cmp-sel-A','cmp-csv-A');
    const itemsB=this._getCmpItems('cmp-sel-B','cmp-csv-B');
    const lA=document.getElementById('cmp-lbl-A')?.value||'A';
    const lB=document.getElementById('cmp-lbl-B')?.value||'B';
    if(!itemsA.length||!itemsB.length){ toast(ar?'أدخل بيانات المقايستين':'Enter data for both BOQs','warning'); return; }

    const mA=Object.fromEntries(itemsA.map(i=>[i.code,i]));
    const mB=Object.fromEntries(itemsB.map(i=>[i.code,i]));
    const codes=[...new Set([...Object.keys(mA),...Object.keys(mB)])];
    let tA=0,tB=0,same=0,up=0,dn=0,onlyA=0,onlyB=0;
    let rows='';

    codes.forEach(code=>{
      const a=mA[code],b=mB[code];
      const p=getItemByCode(code);
      const aT=a?a.price*a.qty:0, bT=b?b.price*b.qty:0;
      tA+=aT; tB+=bT;
      const diff=bT-aT;
      const pct=aT?((diff/aT)*100).toFixed(1):'—';
      let status='';
      if(!a){onlyB++;status=`<span class="badge badge-info">${ar?'جديد في ب':'New in B'}</span>`;}
      else if(!b){onlyA++;status=`<span class="badge badge-medium">${ar?'في أ فقط':'Only in A'}</span>`;}
      else if(diff>0.01){up++;status=`<span class="price-up">🔺 +${pct}%</span>`;}
      else if(diff<-0.01){dn++;status=`<span class="price-down">🔻 ${pct}%</span>`;}
      else{same++;status=`<span class="badge badge-ok">✅</span>`;}
      rows+=`<tr>
        <td class="td-code">${code}</td>
        <td class="td-desc"><div class="td-desc-ar">${p?.arDesc||'—'}</div></td>
        <td>${p?.uom||''}</td>
        <td>${a?`${a.qty}×${fmtNum(a.price)}`:'—'}</td>
        <td>${b?`${b.qty}×${fmtNum(b.price)}`:'—'}</td>
        <td class="td-total ${diff>0.01?'price-up':diff<-0.01?'price-down':''}">${aT?fmtNum(aT):'—'}</td>
        <td class="td-total ${diff>0.01?'price-up':diff<-0.01?'price-down':''}">${bT?fmtNum(bT):'—'}</td>
        <td>${status}</td>
      </tr>`;
    });

    const nd=tB-tA;
    document.getElementById('compare-result').innerHTML=`
      <div class="card">
        <div class="card-head"><span>⚖️</span><span class="card-title">${ar?'تقرير المقارنة':'Comparison Report'}: ${lA} ${ar?'مقابل':'vs'} ${lB}</span></div>
        <div class="card-body">
          <div class="grid-4 mb-16">
            <div style="text-align:center;"><div style="font-size:10.5px;color:var(--text-muted);">${ar?'مطابق':'Same'}</div><div style="font-size:22px;font-weight:800;color:var(--sec-primary);">${same}</div></div>
            <div style="text-align:center;"><div style="font-size:10.5px;color:var(--text-muted);">${ar?'ارتفع':'Up'}</div><div style="font-size:22px;font-weight:800;color:var(--accent-red);">${up}</div></div>
            <div style="text-align:center;"><div style="font-size:10.5px;color:var(--text-muted);">${ar?'انخفض':'Down'}</div><div style="font-size:22px;font-weight:800;color:var(--sec-primary);">${dn}</div></div>
            <div style="text-align:center;"><div style="font-size:10.5px;color:var(--text-muted);">${ar?'مختلف':'Different'}</div><div style="font-size:22px;font-weight:800;color:var(--accent-gold);">${onlyA+onlyB}</div></div>
          </div>
          <div class="grid-3">
            <div style="background:var(--bg-surface);border-radius:var(--r-md);padding:14px;text-align:center;">
              <div style="font-size:10.5px;color:var(--text-muted);">${ar?'إجمالي':'Total'} ${lA}</div>
              <div style="font-size:18px;font-weight:800;color:var(--accent-gold);">${fmtNum(tA)} ${ar?'ر.س':'SAR'}</div>
            </div>
            <div style="background:var(--bg-surface);border-radius:var(--r-md);padding:14px;text-align:center;">
              <div style="font-size:10.5px;color:var(--text-muted);">${ar?'إجمالي':'Total'} ${lB}</div>
              <div style="font-size:18px;font-weight:800;color:var(--accent-blue);">${fmtNum(tB)} ${ar?'ر.س':'SAR'}</div>
            </div>
            <div style="background:var(--bg-surface);border-radius:var(--r-md);padding:14px;text-align:center;border:1px solid ${nd>0?'rgba(255,77,106,0.3)':'rgba(0,132,61,0.3)'};">
              <div style="font-size:10.5px;color:var(--text-muted);">${ar?'صافي الفارق':'Net Difference'}</div>
              <div style="font-size:18px;font-weight:800;color:${nd>0?'var(--accent-red)':'var(--sec-primary)'};">${nd>0?'+':''}${fmtNum(nd)} ${ar?'ر.س':'SAR'}</div>
            </div>
          </div>
        </div>
        <div class="tbl-wrap"><table class="data-table"><thead><tr>
          <th>${ar?'الرمز':'Code'}</th><th>${ar?'الوصف':'Desc'}</th><th>${ar?'وحدة':'UOM'}</th>
          <th>${lA}</th><th>${lB}</th><th>${ar?'إجمالي أ':'Total A'}</th><th>${ar?'إجمالي ب':'Total B'}</th><th>${ar?'الحالة':'Status'}</th>
        </tr></thead><tbody>${rows}</tbody></table></div>
      </div>`;
  },

  // CERTIFICATE
  // ────────────────────────────────────────────────

    const ar=this.lang==='ar';
    const savedOpts=this.state.savedBOQs.map(b=>`<option value="${b.id}">${b.meta.wo||b.id} — ${b.meta.project||''}</option>`).join('');
    c.innerHTML=`
      <div class="grid-2 mb-16" style="align-items:start;">
        <div class="card">

            <div class="form-group"><label class="form-label">${ar?'التاريخ':'Date'}</label><input class="form-control" type="date" id="cert-date" value="${new Date().toISOString().slice(0,10)}"></div>

  loadCertBOQ() {
    const id=document.getElementById('cert-boq')?.value;
    if(!id) return;
    const boq=this.state.savedBOQs.find(b=>b.id===id);
    if(!boq) return;
    const ar=this.lang==='ar';
    this._certBoqId=id;
    document.getElementById('cert-wo').value=boq.meta.wo||'';
    this._certItems=boq.items.map(i=>{ const p=getItemByCode(i.code); return {...i,unitPrice:i.customPrice||(p?p.newPrice:0),pct:0}; });

  addVoiceItemsToCert(items) {
    const ar = this.lang === 'ar';
    if (!this._certItems) {
      this._certItems = [];
    }

    const newItems = items.map(itm => {
      const p = getItemByCode(itm.code);
      const unitPrice = Math.round(itm.customPrice ?? p?.newPrice ?? 0);
      return {
        code: itm.code,
        qty: itm.qty || 1,
        unitPrice: unitPrice,
        pct: 100,
        note: ar ? '🎙️ مساعد صوتي' : '🎙️ Voice Assistant'
      };
    });

    this._certItems = [...this._certItems, ...newItems];
    this._renderCertItems();
    this.genCertPreview();
    this._saveCertSession();

    const woInput = document.getElementById('cert-wo');
    if (woInput && !woInput.value) {
      woInput.value = ar ? 'مستخلص صوتي ذكي' : 'Voice AI WO';

  _saveCertSession() {
    try {
      if (this._certItems && this._certItems.length > 0) {
        localStorage.setItem('cert_session_cache', JSON.stringify({
          items: this._certItems,
          wo: document.getElementById('cert-wo')?.value || '',
          num: document.getElementById('cert-num')?.value || '1',
          date: document.getElementById('cert-date')?.value || '',
          gpct: document.getElementById('cert-gpct')?.value || '',
          savedAt: new Date().toISOString()
        }));
      } else {
        localStorage.removeItem('cert_session_cache');
      }
    } catch (e) {}
  },

  _restoreCertSession() {
    try {
      const raw = localStorage.getItem('cert_session_cache');
      if (!raw) return;
      const session = JSON.parse(raw);
      if (!session || !session.items || session.items.length === 0) return;
      this._certItems = session.items;
      setTimeout(() => {
        const woInput = document.getElementById('cert-wo');
        if (woInput) woInput.value = session.wo || '';
        const numInput = document.getElementById('cert-num');
        if (numInput) numInput.value = session.num || '1';
        const dateInput = document.getElementById('cert-date');
        if (dateInput) dateInput.value = session.date || '';
        const gpctInput = document.getElementById('cert-gpct');
        if (gpctInput) gpctInput.value = session.gpct || '';
        this._renderCertItems();
        this.genCertPreview();
      }, 100);
    } catch (e) {}
  },

  _savedStatusFilter: null,
  _savedFilter(f, btn) {
    this._savedStatusFilter=f;
    if(btn) document.querySelectorAll('.cat-chips .chip[data-f]').forEach(b=>b.classList.toggle('active',b.dataset.f===f));
    this.renderSaved(this.getArea());

  _showSavedApproval(id) {
    const b=this.state.savedBOQs.find(x=>x.id===id);
    if(b) this._showBOQApproval(b);
  },

  _savedDragId: null,
  _savedRowDrag(e, id) {
    this._savedDragId = id;
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', id);
  },
  _savedRowDrop(e, targetId) {
    e.preventDefault();
    const from = this._savedDragId;
    if (!from || from === targetId) { this._savedDragId = null; return; }
    const boqs = this.state.savedBOQs;
    const i = boqs.findIndex(b => b.id === from);
    const j = boqs.findIndex(b => b.id === targetId);
    if (i < 0 || j < 0) { this._savedDragId = null; return; }
    const [moved] = boqs.splice(i, 1);
    boqs.splice(j, 0, moved);
    this.state.savedBOQs = boqs;
    Store.setKey('boqs', boqs);
    this._savedDragId = null;
    toast(this.lang==='ar'?'تم ترتيب المقايسات ✅':'BOQs reordered ✅','success');
    this.go('saved');
  },

  clearAllBOQs() {
    const ar=this.lang==='ar';
    if(!confirm(ar?'حذف جميع المقايسات نهائياً؟':'Delete all BOQs permanently?')) return;
    this.state.savedBOQs=[];
    Store.setKey('boqs',[]);
    this.go('saved');
  },

  _importPriceRef(input) {

    const rd=new FileReader();
    rd.onload=e=>{
      try{
        const res=refreshPricesFromReference(String(e.target.result||''));
        const ar=this.lang==='ar';
        if(res.total===0) toast(ar?'الملف غير صالح — لم يتم العثور على بنود (Breakdown)':'Invalid file — no Breakdown items found','error');
        else if(res.updated===0) toast(ar?'الأسعار مطابقة للملف المرجعي — لا تغيير':'Prices already match the reference — no changes');
        else toast(`${ar?'تم تحديث':'Updated'} ${res.updated} ${ar?'بند من الملف المرجعي':'items from reference file'}`);
        this._applyPL();
      }catch(err){ toast('Error: '+err.message,'error'); }
    };
    rd.readAsText(f,'utf-8');
    input.value='';

  _applyPL() {

    if(this._plCatActive!=='all') items=items.filter(i=>i.cat===this._plCatActive);

          <th>${ar?'وحدة':'UOM'}</th><th>${ar?'السعر الموحد':'Unified Price'}</th><th></th>
        </tr></thead><tbody>

              <td><span class="uom-tag">${item.uom}</span></td>
              <td class="td-price">${fmtNum(item.newPrice)} <span style="font-size:9.5px;color:var(--text-muted);">${ar?'ر.س':'SAR'}</span></td>
              <td><button class="btn btn-primary btn-sm btn-icon" onclick="App._addFromSearch('${item.code}')" title="${ar?'إضافة للمقايسة':'Add to BOQ'}">➕</button></td>

  _renderPriceIntel() {
    const el=document.getElementById('pl-intel');
    if(!el) return;
    const ar=this.lang==='ar';
    const stats=this._plStats();
    const ref=this._priceRefMeta();
    el.innerHTML=`
